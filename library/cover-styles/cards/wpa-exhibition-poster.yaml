# 1940s — WPA art-exhibition / art-week poster.
# Derived from temp/covers/1940s samples: International Exhibition of Water Colors, Exhibition, Sculpture,
# Federal Art Exhibition, National Art Week, General Exhibition, Opening Ottumwa Art Center.
id: wpa-exhibition-poster
label: Modernist exhibition poster
family: H
decades: ["1940s"]
summary: Geometric modernist shapes in soft flat colours on a light ground, with elegant lettering.
medium: >-
  silkscreen poster with modernist geometric shapes: flat soft inks, overlapping planes, thin drawn lines,
  a pale paper ground, slight print texture
palette_rule: 4 to 5 soft flat inks on a pale ground — muted blue, ochre, rose, sage, charcoal
palettes:
  - { name: gallery,   inks: ["#efe8d8", "#3c6e9e", "#d9a441", "#2b2b2b", "#c8726a"] }
  - { name: watercolor,inks: ["#f3eee2", "#6b9ac4", "#e3b448", "#4a4a4a", "#8fae8b"] }
  - { name: plaster,   inks: ["#ece4d4", "#9b4a3c", "#5f7f8f", "#d7c08a", "#262626"] }
composition:
  - "overlapping geometric planes and one simplified object build a still, balanced arrangement"
  - "generous pale space; the title runs along one edge or across the lower third"
  - "one thin line or shadow cuts across the arrangement"
motifs: [an easel or picture frame, a window frame, a bust in profile, a vase of flowers, a long cast shadow]
figure_treatment: a profile or bust reduced to simple planes, no facial detail
lettering: >-
  elegant 1940s modernist lettering — tall thin geometric capitals or a light slab-serif, generously letter-spaced,
  in charcoal or a strong ink, possibly running vertically up one edge
title_position: either
avoid: [photographic realism, 3d rendering, heavy black grounds, any text other than the title]
suits:
  axis: [spatial, physical, temporal]
  tone: [Cozy, Classic]
  location: [CountryHouse, Village, Gallery, Museum, CityHouse, Garden]
