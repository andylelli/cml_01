    social:
      trust_channels:
        - family relationships
        - servants' testimonies
        - alibis from witnesses
        - police surveillance
      authority_sources:
        - District Attorney John F.-X. Markham
        - Sergeant Ernest Heath
        - Chief Medical Examiner Dr. Emanuel Doremus
        - Professor Bertrand Dillard
