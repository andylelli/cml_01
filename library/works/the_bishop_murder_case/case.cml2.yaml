  inference_path:
    steps:
      - observation: >-
          Sperling confessed to killing Robin with a bow and arrow, but his attempt to reveal guilt
          was motivated by emotional distress rather than fact.
        correction: >-
          Confession was too easy and inconsistent with physical evidence; the attempt to confirm
          guilt failed.
        effect: Sperling is innocent; suspicion shifts to someone with more knowledge and a deeper motive.
        required_evidence:
          - >-
            Typewritten Bishop notes with intimate details of the crime and a failed attempt to
            confirm guilt
          - Bow and arrow found at the scene with no blood or tissue traces matching Robin's wound
        reader_observable: true
      - observation: >-
          Riemann-Christoffel tensor formula found on Sprigg's body, suggesting a mathematical
          motivation and intellectual rivalry among suspects.
        correction: >-
          Formula is known to advanced mathematicians, linking the crime to mathematicians with
          jealousy or rivalry.
        effect: Focus on suspects with mathematical background and possible jealousy or rivalry as motive.
        required_evidence:
          - Sprigg's body with formula scrap and evidence of intellectual rivalry
          - Knowledge of tensor formula by Drukker, Arnesson, Pardee, and Dillard
        reader_observable: true
      - observation: >-
          Black bishop chess piece left at Mrs. Drukker's door at midnight, an attempt to reveal the
          murderer's symbolic signature and guilt.
        correction: >-
          Symbolic signature linking the murderer to chess and Arnesson, but also to Dillard's
          attempt to reveal guilt through misdirection.
        effect: >-
          Arnesson becomes a suspect due to possession of chess set, but the attempt to confirm
          guilt is misdirected.
        required_evidence:
          - Mrs. Drukker's testimony of midnight visit and the attempt to reveal guilt
          - Missing black bishop from Arnesson's chess set, but Dillard also had access
        reader_observable: true
      - observation: >-
          Pardee's suicide in the archery room was staged as an attempt to reveal guilt and close
          the case.
        correction: >-
          Suicide staged by murderer to mislead investigation; the attempt to confirm guilt was a
          red herring.
        effect: Pardee is victim, not culprit; the real murderer remains hidden.
        required_evidence:
          - House of cards on table and note suggesting guilt
          - Pardee's emotional state and chess obsession, but no concrete motive
        reader_observable: true
      - observation: >-
          Typewriter and Drukker's note-book found in attic, hidden by the murderer in an attempt to
          conceal and later reveal guilt.
        correction: >-
          Murderer hid evidence in attic to delay discovery, but the attempt to reveal guilt through
          Bishop notes ultimately backfired.
        effect: >-
          Proof of murderer's identity and connection to household, and an attempt to confirm guilt
          through planted evidence.
        required_evidence:
          - Typewriter with Bishop notes and attempt to reveal guilt
          - Drukker's stolen note-book with references to jealousy and rivalry
        reader_observable: true
      - observation: >-
          Child Madeleine Moffat abducted and found locked in Drukker house closet, an attempt to
          motivate fear and reveal guilt through nursery rhyme motifs.
        correction: >-
          Murderer used child as part of nursery rhyme motif and to implicate Arnesson, but the
          attempt to confirm guilt was staged.
        effect: >-
          Final proof of murderer's identity, motive of jealousy and rivalry, and an attempt to
          reveal guilt through psychological manipulation.
        required_evidence:
          - Child's identification of abductor and description of the attempt to frighten her
          - Bishop notes referencing nursery rhymes and attempt to reveal guilt
        reader_observable: true
      - observation: >-
          Professor Dillard's suicide by cyanide poisoning was an attempt to reveal guilt and end
          the case, motivated by jealousy and intellectual rivalry.
        correction: >-
          Murderer committed suicide when cornered, revealing guilt and confirming the motive of
          jealousy and rivalry.
        effect: Case closed with confession by death and confirmation of guilt, jealousy, and rivalry.
        required_evidence:
          - Cyanide lab in attic and evidence of suicide as an attempt to reveal guilt
          - Switching of wine glasses during final meeting, confirming guilt and motive
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      Investigators staged a confrontation with Professor Dillard, feigning suspicion of Arnesson
      and implying weak evidence. Vance deliberately switched wine glasses to test if Dillard would
      poison Arnesson's glass, revealing his guilt. The presence of cyanide lab and the switching of
      glasses were key to exposing the murderer.
    knowledge_revealed: >-
      The test revealed that Dillard attempted to poison Arnesson, confirming his guilt and
      desperation.
    pass_condition: >-
      Detection of cyanide poisoning attempt by observing which glass was poisoned and linking it to
      Dillard's actions.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given all necessary clues including the timing of murders, alibis, the
      significance of nursery rhymes, the mathematical formula linking suspects, and the symbolic
      use of the black bishop chess piece. The discovery of the typewriter and note-book in the
      attic, the child’s identification, and the psychological analysis of suspects provide a fair
      basis for deducing the true culprit. The false confession and misleading evidence are clearly
      presented as red herrings.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
