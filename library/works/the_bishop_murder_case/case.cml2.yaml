  culpability:
    culprit_count: 1
    culprits:
      - Professor Bertrand Dillard
  surface_model:
    narrative:
      summary: >-
        A series of bizarre murders occur around the Dillard household, each linked to nursery
        rhymes and mathematical motifs. The police initially suspect a rival archer, Sperling, who
        confesses but is doubted. The case deepens with further murders, cryptic notes signed 'The
        Bishop,' and a kidnapping.
    accepted_facts:
      - Joseph Cochrane Robin was killed with an arrow on the archery range.
      - Raymond Sperling confessed to Robin's murder but was doubted and held without indictment.
      - >-
        John E. Sprigg was shot in Riverside Park and found dead with a mathematical formula on a
        scrap of paper.
      - >-
        Professor Bertrand Dillard and his household were intimately connected to the victims and
        the crime scenes.
    inferred_conclusions:
      - Sperling was the murderer of Robin due to jealousy over Belle Dillard.
      - Adolph Drukker was involved in the murders due to his mental instability.
      - Pardee committed suicide due to guilt over the murders.
  hidden_model:
    mechanism:
      description: >-
        Professor Bertrand Dillard, motivated by jealousy and intellectual rivalry against his
        adopted son Sigurd Arnesson, committed the murders of Robin, Sprigg, and Drukker, and
        orchestrated the abduction of Madeleine Moffat. He staged the murders with nursery rhyme
        motifs and attempted to frame Arnesson. Dillard used his knowledge of the household and
        access to commit the crimes and left cryptic notes signed 'The Bishop.' When confronted, he
        committed suicide by poisoning.
      delivery_path:
        - step: >-
            Dillard struck Robin in the archery-room, killed him with an arrow, and staged the
            scene.
        - step: He placed the tensor formula on Sprigg's body to implicate Arnesson.
        - step: Dillard murdered Drukker by striking him and pushing him off a wall.
        - step: He sent threatening notes signed 'The Bishop' to the press.
        - step: He abducted Madeleine Moffat, locking her in a closet to frighten the household.
        - step: When suspicion closed in, Dillard poisoned himself to avoid arrest.
    outcome:
      result: >-
        Professor Bertrand Dillard is revealed as the murderer and commits suicide, ending the
        Bishop murder case.
  false_assumption:
    statement: Raymond Sperling's confession to killing Cock Robin is genuine and he is the murderer.
    type: behavioral
    why_it_seems_reasonable: >-
      Sperling confessed voluntarily and was the last person seen with Robin before his death. His
      name meaning 'sparrow' fits the nursery rhyme motif.
    what_it_hides: >-
      The confession was a false admission under emotional pressure, and the real murderer was
      someone else with deeper motives and access.
  false_solution:
    accused_suspect: Raymond Sperling
    supporting_points:
      - Sperling confessed to the murder.
      - He was jealous of Robin and had a quarrel with him.
      - He was the last person seen with Robin.
      - His name means 'sparrow,' matching the nursery rhyme.
    the_one_flaw: >-
      The confession was too easy and inconsistent with physical evidence and psychological
      analysis.
    refuted_in_chapter: 7
  red_herrings:
    - id: adolph_drukker_mental_instability
      description: >-
        Adolph Drukker, a hunchbacked scientist with mental instability, is suspected due to his
        erratic behavior and proximity to the crimes.
      points_at_suspect: His presence near crime scenes and strange conduct.
      innocent_explanation: He was a victim and had no motive or opportunity; his behavior was due to illness.
      resolved_in_chapter: 24
    - id: missing_32_revolver
      description: A .32 revolver goes missing and is later returned, suggesting a possible weapon and suspect.
      points_at_suspect: The revolver was linked to the shooting of Sprigg and was missing from the household.
      innocent_explanation: The revolver was taken and returned by the murderer to mislead investigators.
      resolved_in_chapter: 14
  closed_circle:
    suspects:
      - Professor Bertrand Dillard
      - Sigurd Arnesson
      - Belle Dillard
      - Adolph Drukker
      - John Pardee
      - Raymond Sperling
      - Pyne
      - Beedle
      - Mrs. Otto Drukker
    rationale: >-
      All persons with access to the Dillard household and knowledge of the victims and events were
      investigated, and no outsiders had plausible opportunity or motive.
  constraint_space:
    time:
      anchors:
        - April 2, 1929, 11:15 am to 11:40 am (time of Robin's murder)
        - April 11, 1929, 7:30 pm to 1:19 am (Pardee-Rubinstein chess game)
        - April 16, 1929, about 10 pm (Drukker's death)
        - April 25, 1929, afternoon (discovery of typewriter and note-book)
        - April 26, 1929, morning (final confrontation and Dillard's suicide)
      windows:
        - Robin was killed between Sperling's departure and Professor Dillard's discovery
        - Sprigg was shot early morning before 8 am
        - Drukker was killed around 10 pm
        - Pardee's suicide occurred around midnight
        - Madeleine Moffat was abducted late afternoon
    access:
      actors:
