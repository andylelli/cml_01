  culpability:
    culprit_count: 1
    culprits:
      - Shibo Horikawa (Shibo)
  surface_model:
    narrative:
      summary: >-
        James Cunningham, Sr. is found murdered in his apartment, tied to a chair and shot.
        Suspicion falls on several family members and associates, including his nephews and a land
        agent, with conflicting testimonies and secret marriages complicating the case.
    accepted_facts:
      - James Cunningham, Sr. was found dead with a bullet wound to the head
      - He was tied to a chair and chloroformed before being shot
      - Several people were seen entering or leaving the apartment around the time of the murder
      - A large sum of money was withdrawn from the bank the day of the murder and went missing
    inferred_conclusions:
      - Kirby Lane was the murderer because he was seen entering and leaving the apartment
      - Cass Hull killed James Cunningham in a fit of rage during a dispute
      - James Cunningham, Jr. killed his uncle to inherit the fortune
  hidden_model:
    mechanism:
      description: >-
        Shibo Horikawa, the Japanese valet, killed James Cunningham, Sr. by chloroforming him, tying
        him to a chair, and then shooting him at close range. He also killed Horikawa to silence
        him. Shibo acted out of self-preservation after Cunningham discovered his plan to steal
        money and frame others.
      delivery_path:
        - step: Shibo chloroformed James Cunningham, Sr. and tied him to a chair
        - step: Shibo shot Cunningham at close range with an automatic pistol
        - step: Shibo and Horikawa fled through the window to the fire escape
        - step: Horikawa hid in a neighboring apartment, supplied with newspapers and food by Shibo
        - step: Shibo killed Horikawa to prevent him from revealing the truth
        - step: Shibo attempted to murder Kirby Lane to prevent exposure
        - step: Shibo was captured and confessed to the murders
    outcome:
      result: >-
        Shibo Horikawa is arrested and confesses to the murders of James Cunningham, Sr. and
        Horikawa.
  false_assumption:
    statement: Wild Rose McLean was the murderer because her glove was found at the crime scene.
    type: identity
    why_it_seems_reasonable: >-
      The glove with a rose embroidery was found at the scene, and Wild Rose was known to be present
      in the apartment shortly before the murder. Her passionate anger towards James Cunningham also
      provided a plausible motive.
    what_it_hides: >-
      The glove was left inadvertently and taken by Kirby Lane, and Wild Rose was not capable of the
      complex murder involving chloroform and tying up the victim.
  false_solution:
    accused_suspect: Kirby Lane
    supporting_points:
      - He was seen entering and leaving the apartment by witnesses
      - He fled by the fire escape to avoid suspicion
      - His glove was found at the crime scene
      - He had a motive of family resentment
    the_one_flaw: >-
      He was not capable of the murder and was protecting Wild Rose and Esther; evidence later
      proved his innocence.
    refuted_in_chapter: 41
  red_herrings:
    - id: cass_hull_blackmail_and_murder
      description: >-
        Cass Hull was suspected due to his threats and presence at the crime scene, and his wife’s
        aggressive behavior.
      points_at_suspect: Cass Hull
      innocent_explanation: >-
        Hull was involved in a quarrel but did not commit the murder; he was scared and tried to
        flee.
      resolved_in_chapter: 37
    - id: james_cunningham_jr_secret_marriage_and_motive
      description: >-
        James Cunningham, Jr.'s secret marriage to Phyllis Harriman and his motive to inherit the
        fortune made him a prime suspect.
      points_at_suspect: James Cunningham, Jr.
      innocent_explanation: >-
        Though guilty of deception and conspiracy, he did not physically commit the murder; the
        valet Shibo was the actual killer.
      resolved_in_chapter: 41
  closed_circle:
    suspects:
      - Kirby Lane
