    social:
      trust_channels:
        - Family relationships
        - Employment of Shibo as valet and janitor
        - Friendship between Kirby Lane and Wild Rose
      authority_sources:
        - Denver Police Department
        - Coroner's inquest
        - Reverend Nicodemus Rankin (marriage officiant)
  inference_path:
    steps:
      - observation: Glove with rose embroidery found at crime scene
        correction: Glove belonged to Wild Rose but was taken by Kirby Lane
        effect: Wild Rose initially suspected but later cleared
        required_evidence:
          - Wild Rose's testimony about glove and its embroidery being hers
          - Kirby Lane's account of glove possession and timeline of when he picked it up
        reader_observable: true
      - observation: Mrs. Hull and Cass Hull lied about time they saw Kirby
        correction: They shifted time to implicate Kirby Lane
        effect: Suspicion on Hulls increased
        required_evidence:
          - Testimony of Mrs. Hull and Cass Hull at inquest regarding Kirby's arrival and departure
          - Kirby Lane's watch time records showing his presence within the apartment
        reader_observable: true
      - observation: Secret marriage certificate of James Cunningham, Jr. and Phyllis Harriman
        correction: Marriage was concealed to protect estate interests
        effect: Motive for murder to secure inheritance
        required_evidence:
          - Marriage certificate from Golden with date and signatures
          - Testimony of Reverend Rankin and family confirming the secret marriage
        reader_observable: true
      - observation: Japanese papers lost by James Cunningham, Jr., containing confession by Horikawa
        correction: Papers revealed Shibo's opportunity to commit the murder within the critical time window
        effect: Link to valet Shibo as murderer and his access to the apartment
        required_evidence:
          - Lost papers report describing contents and timeline of disappearance
          - >-
            Physical evidence of Shibo's access to the apartment and opportunity to commit the crime
            within the murder window
        reader_observable: true
      - observation: >-
          Horikawa found dead, tied up in neighboring apartment, with signs of chloroform and tying
          to chair
        correction: Horikawa was killed to silence him after he witnessed the murder
        effect: Murder conspiracy deeper than first thought and method of tying and chloroform established
        required_evidence:
          - Discovery of Horikawa's body tied to a chair with rope and presence of chloroform odor
          - Physical trace of tying and evidence of chloroform use in the neighboring apartment
        reader_observable: true
      - observation: >-
          Attempted murder of Kirby Lane by masked assailant using same method as original crime
          (chloroform and shooting)
        correction: >-
          Assailant identified as Shibo Horikawa, who had opportunity and access to commit the
          attack within the building
        effect: Confirms Shibo as murderer and his repeated use of chloroform, tying, and shooting
        required_evidence:
          - Attack at Denmark Building with timeline showing Shibo's presence within the building
          - >-
            Shoes and bandanna evidence matching those used in the original murder and opportunity
            for Shibo to commit the crime
        reader_observable: true
      - observation: >-
          Physical evidence and timeline reveal Shibo's opportunity to commit the murder within the
          critical window using chloroform, tying, and shooting
        correction: Shibo admits to killing James Cunningham, Sr. and Horikawa, revealing the mechanism
        effect: Case solved with Shibo as culprit and method established
        required_evidence:
          - >-
            Physical evidence linking Shibo to the murder weapon, chloroform bottle, and rope used
            for tying the chair
          - >-
            Timeline of Shibo's movements within the apartment and access records showing he was
            present during the murder window
        reader_observable: true
  discriminating_test:
    method: constraint_proof
    design: >-
      Reconstruct the timeline of arrivals and departures at the apartment using witness testimonies
      and physical evidence such as glove presence, time on watches, and presence on fire escape.
      Verify the presence of suspects in the apartment during the critical murder window and check
      for contradictions in alibis and testimonies. The test must reveal who had the opportunity to
      commit the murder within the window, using chloroform, tying, and shooting as established by
      physical traces.
    knowledge_revealed: >-
      This test reveals who had the opportunity to commit the murder within the narrow time window
      and who was lying about their presence or actions. It also establishes the use of chloroform,
      tying to a chair, and shooting as the murder method.
    pass_condition: >-
      The suspect must be proven to have been present in the apartment during the murder time window
      with no credible alibi and with access to the murder method of chloroform, tying, and
      shooting.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed timelines, witness testimonies, and physical evidence such as the
      glove, the note, and the Japanese confession. The presence and movements of all suspects are
      described, including their motives and alibis. The false solution accusing Kirby Lane is
      presented and refuted, allowing the reader to deduce the real culprit by careful analysis of
      the timeline and motives.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
