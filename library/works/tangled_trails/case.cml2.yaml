    rationale: >-
      All these individuals had access to the apartment and motives related to the victim; the
      investigation focused on them exclusively.
  constraint_space:
    time:
      anchors:
        - 8.45 - Uncle James leaves City Club
        - 8.55 - Uncle James reaches apartment
        - 9.10-9.30 - Hulls in apartment
        - 9.40-9.53 - James Cunningham, Jr. in apartment
        - 9.44-9.50 - Jack Cunningham and Phyllis Harriman in apartment
        - 9.55-10.05 - Wild Rose in apartment
        - 10.00 - Kirby Lane arrives at apartment
