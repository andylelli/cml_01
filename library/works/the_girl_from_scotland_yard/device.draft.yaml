pattern_id: the_girl_from_scotland_yard
title: The Moved Body
family: spatial_routing
axes:
  - identity
principle: >-
  It obscures the true culprit, the culprit, who had both motive and opportunity to kill the victim
  to protect her blackmail operation.
principleType: social_logic
surface_illusion_template: >-
  a suspect a suspect murdered the victim out of revenge.; Lady the victim was protecting her own
  interests by hiding the truth.; the culprit was innocent and only a victim of circumstances.
underlying_reality_template: >-
  the culprit killed the victim during a confrontation over blackmail. In a struggle, the culprit
  shot the victim, who managed to hold onto the emerald pendant. the culprit then concealed the
  victim body by placing it in a car and leaving it at a remote spot. The murder was motivated by
  the culprit desire to protect her blackmail scheme and maintain control over the secrets involving
  Lady the victim and the lost child.
