  inference_path:
    steps:
      - observation: Varney claims Purcell landed at Penzance and other ports during the expedition.
        correction: >-
          Scientific and testimonial evidence disproves these sightings and the expedition's
          reported conduct.
        effect: Purcell likely never landed and is dead.
        required_evidence:
          - >-
            Captain's report of the steamer Hedwig passenger list showing no Purcell and no record
            of his conduct during the expedition
          - >-
            Witness statements denying Purcell's presence at Falmouth and Ipswich, including details
            of the expedition's route and location
        reader_observable: true
      - observation: >-
          Letters purportedly from Purcell received after disappearance reference the expedition and
          his physical location.
        correction: >-
          Microscopic and forensic examination shows letters are forged and do not reveal Purcell's
          true location.
        effect: Letters are fabrications to conceal Purcell's death.
        required_evidence:
          - >-
            Microscopic analysis of postmarks on letters showing lithographic forgery and absence of
            physical handling from the claimed location
          - >-
            Comparison of handwriting and ink with known samples, including analysis of the
            expedition's trawl-rope and creeper references
        reader_observable: true
      - observation: Blood stain and hand print found on yacht's sail after the expedition.
        correction: >-
          Hand print matches Varney's maimed finger and the physical evidence from the trawl-rope
          and creeper used during the expedition.
        effect: Varney was present at the time of Purcell's death and involved.
        required_evidence:
          - >-
            Chemical test of blood stain on sail and physical residue from trawl-rope and creeper
            used in the expedition
          - >-
            Visual and microscopic comparison of hand print with Varney's finger, including analysis
            of conduct during the search
        reader_observable: true
      - observation: >-
          Missing ballast weight and cut rope from yacht, both used in the expedition's trawl-rope
          search.
        correction: >-
          Weight and rope likely used to sink Purcell's body, as revealed by the expedition's
          physical findings.
        effect: Body disposed of weighted to sink at sea bottom.
        required_evidence:
          - >-
            Inventory check of yacht gear showing missing weight and rope, including trawl-rope and
            creeper used in the expedition
          - >-
            Witness testimony of yacht condition before and after voyage, and conduct of the search
            expedition
        reader_observable: true
      - observation: >-
          Cork button with marine worm tube found on sea bottom during the expedition's trawl-rope
          search.
        correction: >-
          Button is from Purcell's oilskin coat and has been underwater for months, as revealed by
          the physical evidence collected by the creeper.
        effect: Purcell's coat and body have been at sea bottom near Wolf Rock.
        required_evidence:
          - >-
            Identification of button embroidery as Purcell's, recovered by creeper during the
            expedition
          - >-
            Expert analysis of marine worm tube composition and origin, and physical location of the
            find
        reader_observable: true
      - observation: Varney's sudden disappearance from social circles after the expedition's findings.
        correction: >-
          Varney's disappearance coincides with investigation progress and the reveal of physical
          evidence from the trawl-rope search.
        effect: Varney attempts to avoid detection and consequences.
        required_evidence:
          - Witness statements of Varney's last known whereabouts after the expedition's reveal
          - >-
            Correspondence and social visits records, including details of the search expedition's
            conduct
        reader_observable: true
      - observation: >-
          Varney appears on lugger near Wolf Rock during the search expedition using creeper and
          trawl-rope.
        correction: >-
          Varney's presence confirms proximity to crime scene and body disposal, as revealed by the
          expedition's physical findings.
        effect: Varney is implicated as murderer and responsible for body disposal.
        required_evidence:
          - >-
            Eyewitness account of Varney boarding search boat during the expedition and conduct at
            the location
          - >-
            Matching of hand print and blood evidence to Varney, as revealed by the physical
            evidence recovered by creeper and trawl-rope
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      A search expedition using creepers and trawl-rope is conducted near Wolf Rock to recover
      physical evidence. The search focuses on the area identified by the marine worm tube analysis
      and the missing ballast weight. The test observes if the body or identifiable remains can be
      recovered to conclusively prove death.
    knowledge_revealed: >-
      The test reveals the location of Purcell's body and physical evidence linking Varney to the
      murder and disposal.
    pass_condition: >-
      Recovery of Purcell's identifiable remains, such as the oilskin coat with the button and skull
      with bullet hole, from the sea bottom near Wolf Rock.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given all necessary clues including Varney's suspicious behavior, the forged
      letters, the blood stain on the sail, the missing ballast weight and rope, and the scientific
      evidence of the marine worm tube on Purcell's button. The false sightings and letters are
      exposed as fabrications. The reader could deduce that Purcell was murdered during the yacht
      voyage and that Varney concealed the crime by fabricating evidence of Purcell's survival.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
