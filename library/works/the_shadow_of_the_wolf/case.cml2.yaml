  culpability:
    culprit_count: 1
    culprits:
      - Mr. Varney
  surface_model:
    narrative:
      summary: >-
        Daniel Purcell disappears during a yacht voyage from Sennen Cove to Penzance. His companion,
        Mr. Varney, claims Purcell landed at Penzance and later at other ports, supported by letters
        purportedly from Purcell. Suspicious circumstances and scientific evidence suggest Purcell's
        death and Varney's deception.
    accepted_facts:
      - Purcell and Varney sailed alone on the yacht from Sennen Cove
      - Purcell was last seen by Varney during the voyage
      - Letters purportedly from Purcell were received after his disappearance
      - >-
        Scientific examination found a blood stain on the yacht's sail and a cork button with marine
        worm tube from Purcell's coat
    inferred_conclusions:
      - Purcell landed at Penzance and other ports after the voyage
      - Purcell is alive and hiding in the Eastern Counties
      - Varney is a loyal friend trying to protect Purcell
  hidden_model:
    mechanism:
      description: >-
        Varney murdered Purcell during the yacht voyage by shooting him and disposing of his body
        weighted with an iron half-hundred weight. He fabricated evidence of Purcell's survival by
        forging letters and inventing false sightings at ports. Scientific evidence, including the
        blood stain on the sail and the cork button with marine worm tube found on the sea bottom
        near Wolf Rock, proved Purcell's death and Varney's guilt.
      delivery_path:
        - step: Varney shoots Purcell on the yacht during fog near Wolf Rock
        - step: Varney attaches Purcell's body to an iron weight and throws it overboard
        - step: >-
            Varney cleans blood stains from the sail and fabricates a story of Purcell landing at
            Penzance
        - step: Varney forges letters in Purcell's handwriting and posts them from distant locations
        - step: >-
            Scientific evidence including the cork button with marine worm tube is found on the sea
            bottom near Wolf Rock
        - step: Investigation reveals missing ballast weight and rope from the yacht
        - step: Varney's forged letters and false sightings are exposed, confirming Purcell's death
    outcome:
      result: >-
        Purcell is conclusively proven dead and Varney is identified as his murderer, though legal
        proof of murder is complicated by lack of direct evidence.
  false_assumption:
    statement: Purcell landed at Penzance and other ports after the yacht voyage and is alive.
    type: identity
    why_it_seems_reasonable: >-
      Varney, the sole companion, testified to Purcell's landing and subsequent sightings; letters
      purportedly from Purcell were received after his disappearance. These facts appeared to
      confirm Purcell's survival.
    what_it_hides: >-
      Varney fabricated the sightings and forged the letters to conceal Purcell's murder and death
      during the voyage.
  false_solution:
    accused_suspect: Margaret Purcell
    supporting_points:
      - Margaret's suspicions about her husband's disappearance
      - Her emotional distress and desire for freedom
      - Her possible motive related to Purcell's secretive and brutal nature
      - Her access to the letters and knowledge of the case
    the_one_flaw: >-
      There is no evidence that Margaret had opportunity or motive to commit the murder; all
      incriminating evidence points to Varney.
    refuted_in_chapter: 16
  red_herrings:
    - id: ipswich_falmouth_sightings
      description: >-
        Reports and Varney's testimony that Purcell was seen at Falmouth and Ipswich after the
        disappearance.
      points_at_suspect: Varney, as the fabricator of these false sightings
      innocent_explanation: >-
        These sightings were invented by Varney to mislead the investigation and divert suspicion
        from the murder.
      resolved_in_chapter: 16
    - id: penfield_letter_contents
      description: The mysterious letter and enclosures received by Mr. Penfield from Purcell.
      points_at_suspect: Purcell, suggesting illicit activities or secret communications
      innocent_explanation: >-
        The letter contained forged bank-note blanks and was part of Varney's scheme to expose
        Purcell and cover up the murder.
      resolved_in_chapter: 10
  closed_circle:
    suspects:
      - Mr. Varney
    rationale: >-
      Only Varney was present on the yacht with Purcell, had opportunity and motive, and all
      fabricated evidence and scientific findings point to him as the murderer.
  constraint_space:
    time:
      anchors:
        - June 23rd, 1911, yacht voyage and disappearance
        - October 28th and 29th, forged letter postmarks
        - December, Varney posting forged letter
      windows:
        - Voyage duration from Sennen to Penzance
        - Letter posting times and collections
        - Investigation period from disappearance to recovery of evidence
