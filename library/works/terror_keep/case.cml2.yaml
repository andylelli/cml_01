  culpability:
    culprit_count: 2
    culprits:
      - John Flack
      - George Ravini
  surface_model:
    narrative:
      summary: >-
        The case appears as a daring gold convoy robbery involving an escaped madman, John Flack,
        and his criminal associates at Larmes Keep. Suspicious disappearances, mysterious guests,
        and strange happenings at the boarding house suggest a complex criminal conspiracy.
    accepted_facts:
      - John Flack escaped from Broadmoor and is believed to be in London
      - George Ravini disappeared leaving behind his pyjamas and was later found dead
      - A gold convoy was intercepted and stolen near Tilbury without gunfire
      - Margaret Belman was taken hostage and later escaped from Larmes Keep
    inferred_conclusions:
      - The robbery was a straightforward armed attack on the convoy
      - George Ravini was killed by an unknown rival gang member
      - Margaret Belman was complicit in the robbery or a willing accomplice
  hidden_model:
    mechanism:
      description: >-
        John Flack orchestrated the robbery by using a gas attack to incapacitate the gold convoy
        guards at a narrow road cutting. The gang used a disguised lorry and gas stored in a water
        wagon to silently kill the guards. The stolen gold was taken to Larmes Keep, which served as
        their headquarters, connected to a network of caves for escape. Flack killed Ravini to
        eliminate a threat and used his daughter Olga and the housekeeper Mrs. Burton as
        accomplices.
      delivery_path:
        - step: Purchase and modification of an old water wagon to store deadly gas
        - step: Deployment of gas hose over the bridge at the convoy's route to release gas
        - step: Convoy incapacitated silently, lorry swerves and crashes, men die from gas
        - step: Gang members wearing gas masks retrieve the gold and drive away in disguised lorry
        - step: Gold and gang retreat to Larmes Keep, using secret cave passages
        - step: Ravini is killed by Flack to prevent betrayal
        - step: Flack and accomplices prepare to escape by motor boat through cave network
    outcome:
      result: >-
        The gold convoy robbery is solved, the culprits are identified, and Margaret Belman is
        rescued from captivity.
  false_assumption:
    statement: The robbery was a violent shootout with the gold convoy guards.
    type: behavioral
    why_it_seems_reasonable: >-
      The presence of armed guards and the disappearance of the convoy suggest a gun battle. No
      witnesses reported gas or silent incapacitation, so a shootout is the natural assumption.
    what_it_hides: >-
      The actual use of a gas attack that silently incapacitated the guards, leaving no gunfire or
      struggle, which was a clever and unexpected method.
  false_solution:
    accused_suspect: Olga Crewe
    supporting_points:
      - Olga Crewe was present at Larmes Keep during the robbery
      - She behaved coldly and evasively, arousing suspicion
      - Her relationship with Flack and Ravini suggested inside knowledge
      - She was seen near the caves shortly before the gold was moved
    the_one_flaw: >-
      Olga was coerced and manipulated by her father, and evidence shows she was not the mastermind
      or main perpetrator.
    refuted_in_chapter: 20
  red_herrings:
    - id: mrs_burton_housekeeper_madness
      description: Mrs. Burton's apparent madness and complaints mislead suspicion onto her.
      points_at_suspect: Mrs. Burton
      innocent_explanation: Her behavior stems from frustration and fear, not criminal intent.
      resolved_in_chapter: 18
    - id: olga_crewe_cold_behavior
      description: Olga Crewe's cold and evasive behavior suggests she might be the mastermind.
      points_at_suspect: Olga Crewe
      innocent_explanation: She is conflicted and fearful, coerced by her father and circumstances.
      resolved_in_chapter: 20
  closed_circle:
    suspects:
      - John Flack
      - George Ravini
      - Mr. Daver
      - Olga Crewe
      - Mrs. Burton
      - Colonel Hothling
      - Reverend Dean
    rationale: >-
      All suspects were present at Larmes Keep, had connections to Flack, and had opportunity and
      motive related to the gold convoy robbery and subsequent events.
  constraint_space:
    time:
      anchors:
        - John Flack escaped a week before the robbery
        - Gold convoy left Bank of England early morning
        - Ravini left Larmes Keep early morning before disappearance
        - Margaret Belman arrived at Larmes Keep before robbery
        - Flack and gang fled before dawn after robbery
      windows:
        - Nighttime at Larmes Keep for surveillance and escape
        - Early morning hours for robbery and gas attack
        - Daytime for investigation and search
    access:
      actors:
        - John Flack
        - George Ravini
        - Mr. Daver
        - Olga Crewe
        - Mrs. Burton
        - Colonel Hothling
        - Reverend Dean
        - J. G. Reeder
        - Detective Brill
      objects:
        - Safe in Larmes Keep
        - Secret panel door
        - Cave network under Larmes Keep
        - Water wagon modified for gas
        - Gold convoy lorry
        - Motor boat in cave
    social:
      trust_channels:
        - Letters and notes between Flack and gang
        - Verbal instructions from Flack
        - Mr. Daver's authority as proprietor
        - Olga Crewe's interactions with Ravini
      authority_sources:
        - Public Prosecutor's Office
        - Scotland Yard
        - Mr. Daver as proprietor
        - John Flack as gang leader
  inference_path:
    steps:
      - observation: Gold convoy disappeared silently without gunfire
        correction: No shooting occurred; guards were incapacitated
        effect: Suggests use of gas or chemical agent
        required_evidence:
          - Description of convoy route and timing from police reports
          - Medical examination of dead guards showing no gunshot wounds
        reader_observable: true
      - observation: Old water wagon found near robbery site
        correction: Wagon modified to store and release gas
        effect: Source of incapacitating agent identified
        required_evidence:
          - Physical inspection of water wagon and hose
          - Purchase records of municipal equipment
        reader_observable: true
      - observation: Ravini left Larmes Keep suddenly, pyjamas torn
        correction: Ravini was killed by Flack to prevent betrayal
        effect: Ravini is victim, not mastermind
        required_evidence:
          - Luck Rings sent to Reeder with threatening note
          - Witness statements about Ravini's last movements
        reader_observable: true
      - observation: Safe in Larmes Keep has secret panel leading to caves
        correction: Gang used secret passages for escape and hiding
        effect: Explains how Flack escaped and hid
        required_evidence:
          - Inspection of safe and secret door
          - Mapping of cave network under Larmes Keep
        reader_observable: true
      - observation: Margaret Belman escaped from cave after fall
        correction: She was held hostage to ensure Reeder's compliance
        effect: Margaret is innocent victim, not accomplice
        required_evidence:
          - Margaret's testimony and physical evidence of fall
          - Witness accounts of her captivity and escape
        reader_observable: true
      - observation: Mr. Daver acts nervously and tries to mislead
        correction: Daver is collaborator with Flack, double-crossed by him
        effect: Daver is co-conspirator and victim of Flack's paranoia
        required_evidence:
          - Daver's secret notes and correspondence
          - Witness statements about his behavior
        reader_observable: true
      - observation: Flack's escape and presence at Larmes Keep
        correction: Flack masterminded robbery and orchestrated escape
        effect: Identifies Flack as primary culprit
        required_evidence:
          - Brill's testimony of Flack's movements
          - Physical inspection of the secret panel door and cave entrance at Larmes Keep
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Recreate the robbery scenario by releasing gas from a water wagon at the convoy's route and
      observe the effect on guards. Simultaneously, test the secret panel door and cave passages at
      Larmes Keep to verify escape routes. Confirm the presence of gas and the timing of
      incapacitation.
    knowledge_revealed: >-
      This test reveals the use of gas to incapacitate guards silently and the use of secret
      passages for escape, confirming the actual mechanism of the crime.
    pass_condition: >-
      The gas release incapacitates guards without gunfire, and secret passages provide a viable
      escape route.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the convoy's disappearance, the presence of a
      water wagon, the secret panel in the safe, and the cave network. The suspicious behavior of
      suspects and the discovery of gas traces and the secret ladder are all presented. The
      detective's reasoning and the clues about the gas and escape routes are accessible, allowing a
      careful reader to deduce the true mechanism.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
