  inference_path:
    steps:
      - observation: Fingerprints on dispatch-box match Quentin's
        correction: Quentin tampered with victim's belongings
        effect: Links Quentin to victim and crime scene
        required_evidence:
          - Fingerprint analysis of dispatch-box
          - Quentin's fingerprints from tumbler in his room
        reader_observable: true
      - observation: Quentin tried to borrow money from Aylmer and Whitefield
        correction: Quentin was in financial difficulty and scheming
        effect: Motive for crime is financial gain
        required_evidence:
          - Quentin's proposals to Aylmer and Whitefield
          - Whitefield's receipt for loan
        reader_observable: true
      - observation: Quentin's pillow-case contained rare poison
        correction: Poisoning was method of murder
        effect: Explains sudden heart disease deaths
        required_evidence:
          - Toxicological report from Monsieur Dumont
          - Analysis of pillow-case from Whitefield's room
        reader_observable: true
      - observation: Eileen is not legally married to Quentin
        correction: Eileen is innocent and a victim
        effect: Removes suspicion of her complicity
        required_evidence:
          - Marriage records search
          - Eileen's written statement describing her relationship with Quentin
        reader_observable: true
      - observation: Quentin and Dicks associate with Ramon, a known criminal
        correction: Quentin is part of a criminal gang
        effect: Establishes criminal background and network
        required_evidence:
          - Duberry and Webber's surveillance reports
          - Police records on Ramon
        reader_observable: true
      - observation: Martyn abruptly leaves the group and is evasive
        correction: Martyn is not directly involved in murder
        effect: Focus shifts to Quentin as culprit
        required_evidence:
          - Martyn's statements and movements
          - Lack of evidence linking Martyn to poisoning
        reader_observable: true
      - observation: Quentin commits suicide upon arrest
        correction: Confession by act of suicide
        effect: Confirms guilt and ends investigation
        required_evidence:
          - Police report of Quentin's death
          - Monsieur Paillot's testimony
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      Aylmer obtains a duplicate key to Quentin's room and replaces the pillow-case with an
      identical one. He sends the original for toxicological analysis to confirm the presence of
      poison. Meanwhile, Whitefield is instructed to bolt his door to prevent unauthorized entry.
      Observing Quentin's behavior for attempts to enter Whitefield's room tests the hypothesis of
      poisoning via the pillow.
    knowledge_revealed: >-
      The test reveals Quentin's intent to poison Whitefield using the pillow-case and confirms the
      use of a rare poison.
    pass_condition: Quentin attempts to enter Whitefield's room to remove evidence, confirming his guilt.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given access to all key observations, including the suspicious behavior of
      Quentin, the fingerprint evidence, and the toxicological analysis. The clues about the false
      marriage and Eileen's innocence are explicitly stated. The method of poisoning is hinted
      through the symptoms and the presence of the pillow-case. The duplicate key and the timing of
      events are described, allowing the reader to deduce the mechanism before the final reveal.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
