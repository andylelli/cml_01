  culpability:
    culprit_count: 1
    culprits:
      - Judkins Barraclough
  surface_model:
    narrative:
      summary: >-
        The case appears to be a straightforward murder of Mrs. Hannaford, with her husband Mr.
        Hannaford as the prime suspect. Suspicious characters like Flash George and mysterious
        banknotes linked to the victim's first husband add complexity, while Lady Anna Barraclough
        suspects her millionaire husband of bigamy and foul play.
    accepted_facts:
      - Mrs. Hannaford was found murdered in her drawing-room with a poker as the weapon.
      - Mr. Hannaford was found absent from the house and later committed to Broadmoor as insane.
      - >-
        Flash George was seen near the crime scene and later found with banknotes linked to the
        victim's first husband.
      - >-
        Judkins Barraclough is suspected by his second wife Lady Anna of being a bigamist and
        involved in suspicious activities.
    inferred_conclusions:
      - Mr. Hannaford committed the murder in a fit of madness.
      - Flash George was the murderer or an accomplice in the murder.
      - Judkins Barraclough is innocent of any crime and merely a victim of suspicion.
  hidden_model:
    mechanism:
      description: >-
        Judkins Barraclough, the millionaire, was a bigamist who kept his first wife, Mrs. Judkins,
        imprisoned drugged and caged in a locked room in an empty house he rented. He attempted to
        murder her by forcing her to drink chloral-laced brandy to cause a slow death. The murder of
        Mrs. Hannaford was committed by Charles Drayson, Mrs. Hannaford's first husband who faked
        his death and returned to retrieve hidden banknotes concealed in a bear lamp. Drayson killed
        Mrs. Hannaford to prevent exposure of his fraud and to recover the money.
      delivery_path:
        - step: Charles Drayson faked his death in the Opéra Comique fire by discarding his watch.
        - step: >-
            Drayson lived secretly and planned to recover hidden banknotes concealed by himself in
            the bear lamp.
        - step: >-
            On the night of the murder, Drayson entered the house using a latchkey preserved from
            his previous ownership.
        - step: He moved the bear lamp to access the concealed banknotes and hid behind it.
        - step: >-
            Mrs. Hannaford entered the drawing-room expecting her husband and was attacked from
            behind with a poker.
        - step: Drayson struck her to render her senseless to secure the banknotes.
        - step: Drayson fled the scene; Flash George acted as his lookout and accomplice.
    outcome:
      result: >-
        Charles Drayson was revealed as the murderer, and Mr. Hannaford was exonerated and released
        from Broadmoor.
  false_assumption:
    statement: The husband, Mr. Hannaford, was guilty of murdering his wife in a fit of madness.
    type: behavioral
    why_it_seems_reasonable: >-
      The husband was found absent from the house shortly after the murder and was in a nervous,
      excited state. The quarrels and his mental breakdown made him a plausible suspect.
    what_it_hides: >-
      It conceals the fact that the real murderer was the first husband, Charles Drayson, who had
      faked his death and returned to commit the crime for financial motives.
  false_solution:
    accused_suspect: Mr. Hannaford
    supporting_points:
      - He was absent from the house at the time of the murder.
      - He had a history of quarrels with his wife.
      - He was found in a nervous and excited state after the crime.
      - The police had strong circumstantial evidence against him.
    the_one_flaw: >-
      He was insane and incapable of coherent action, and the real murderer was someone else
      entirely.
    refuted_in_chapter: 11
  red_herrings:
    - id: flash_george_suspicion
      description: >-
        Flash George, a known criminal, was seen near the crime scene and had sudden wealth after
        the murder.
      points_at_suspect: Flash George
      innocent_explanation: >-
        Flash George was an accomplice to Charles Drayson but not the murderer; his sudden wealth
        came from swindling unrelated to the murder.
      resolved_in_chapter: 11
    - id: judkins_barraclough_bigamy
      description: Judkins Barraclough was suspected of bigamy and foul play by his second wife Lady Anna.
      points_at_suspect: Judkins Barraclough
      innocent_explanation: >-
        While guilty of bigamy and attempted murder of his first wife, he was not involved in Mrs.
        Hannaford's murder.
      resolved_in_chapter: 11
  closed_circle:
    suspects:
      - Mr. Hannaford
      - Flash George
      - Judkins Barraclough
      - Charles Drayson
    rationale: >-
      The suspects are limited to those with access to the house and motive: the husband, a known
      criminal nearby, the millionaire with a secret, and the first husband presumed dead.
  constraint_space:
    time:
      anchors:
        - night of January 5
        - half-past two in the morning
        - midnight meeting on Hungerford Bridge
      windows:
        - time between Mrs. Hannaford going to bed and discovery of murder
        - time of Flash George's presence near the house
        - time of Drayson's secret entry and murder
    access:
      actors:
        - Mr. Hannaford
        - Charles Drayson
        - Flash George
        - Judkins Barraclough
        - Aleem Mohammed
      objects:
        - latchkeys to the house
        - bear lamp with hidden compartment
        - poker used as weapon
        - wire cage in Burton Crescent house
    social:
      trust_channels:
        - Dorcas Dene's private inquiries
        - Inspector Stromberg's cooperation
        - Colonel Hargreaves' trust in Dorcas
        - Lady Anna Barraclough's cooperation
      authority_sources:
        - Scotland Yard
        - Private detective Dorcas Dene
        - Local police superintendent
        - Coroner's inquest
  inference_path:
    steps:
      - observation: Mrs. Hannaford was attacked with a poker found near her body.
        correction: The poker was likely used by the intruder hiding in the room, not by the husband.
        effect: Shifts suspicion from husband to an intruder with access to the house.
        required_evidence:
          - Plan of the drawing-room showing poker position
          - Caretaker's testimony about furniture arrangement
        reader_observable: true
      - observation: Flash George was seen near the crime scene and had sudden wealth.
        correction: Flash George was an accomplice or lookout, not the murderer.
        effect: Focuses investigation on his connections and accomplices.
        required_evidence:
          - Banknote traced to Charles Drayson
          - Witness statement of Flash George's movements
        reader_observable: true
      - observation: Banknotes linked to the victim's first husband resurfaced after the murder.
        correction: The first husband may be alive and involved.
        effect: Reveals that Charles Drayson faked his death and is a suspect.
        required_evidence:
          - Testimony of Thomas Holmes about Drayson
          - Discovery of banknotes in bear lamp
        reader_observable: true
      - observation: Judkins Barraclough rents an empty house with a locked cage and drugged woman.
        correction: He is imprisoning and attempting to murder his first wife.
        effect: Establishes Barraclough's guilt in attempted murder and bigamy.
        required_evidence:
          - Discovery of wire cage and drug bottles
          - Testimony of Mrs. Judkins
        reader_observable: true
      - observation: The brown bear lamp was moved recently and has a hidden compartment.
        correction: The murderer used it to hide stolen banknotes.
        effect: Links the murder to financial motives and Drayson's return.
        required_evidence:
          - Examination of bear lamp and carpet discoloration
          - Dorcas Dene's reenactment behind the bear lamp
        reader_observable: true
      - observation: The front door opened with a cracking sound before the murder.
        correction: An intruder entered quietly and hid before attacking.
        effect: Supports the theory of a hidden assailant, not the husband.
        required_evidence:
          - Caretaker's testimony on door sound
          - Dorcas Dene's listening test in the bedroom
        reader_observable: true
      - observation: Charles Drayson was seen attempting suicide and later found dead after the murder.
        correction: >-
          His actions and the evidence of the banknotes and lamp confirm he was the murderer acting
          to recover hidden money.
        effect: Confirms Drayson's guilt and clears Mr. Hannaford.
        required_evidence:
          - Discovery of Drayson's body with suicide note referencing the banknotes and lamp
          - Police report on Drayson's movements and connection to the bear lamp
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Dorcas Dene had the assistant lie behind the brown bear lamp to test if a person could be
      concealed there and strike silently with the poker. She also tested the sound of the front
      door opening and the timing of the victim's movements in the house.
    knowledge_revealed: >-
      This reenactment demonstrated that the murderer hid behind the bear lamp and attacked Mrs.
      Hannaford silently, and that the door opening sound was the key to the victim's movement
      before the attack.
    pass_condition: >-
      The test passes if the assistant can be completely concealed behind the bear lamp and can
      strike without alerting an observer, and if the door opening sound matches the caretaker's
      description.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the crime scene, the position of the poker, the
      discovery of the bear lamp and its hidden compartment, and the suspicious behavior of Flash
      George and Judkins Barraclough. Clues such as the banknotes, the door sound, and the testimony
      of witnesses are all presented. The detective's reasoning and the reenactment provide a
      logical path to the solution, allowing an attentive reader to deduce the true murderer.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
