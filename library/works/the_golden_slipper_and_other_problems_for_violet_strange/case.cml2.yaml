  inference_path:
    steps:
      - observation: The pendant was stolen from Violet Strange's room through an open window.
        correction: The window was left ajar intentionally to allow access.
        effect: The thief had to be someone with knowledge of the room and access to the balcony.
        required_evidence:
          - Description of the open window and balcony access
          - Witness statement about the window being left ajar
        reader_observable: true
      - observation: A gold-colored slipper was found outside Violet Strange's window.
        correction: The slipper belonged to Caroline West, not Alicia Driscoll.
        effect: The thief disguised herself using Alicia's slippers to mislead others.
        required_evidence:
          - Physical slipper found outside the window
          - Testimony identifying the slipper's owner
        reader_observable: true
      - observation: The thief's fingers would be stained by the red paste used on the pendant.
        correction: Caroline West's fingers were stained, but she wore gloves to conceal this.
        effect: The red-stained fingers test revealed the true thief despite attempts to hide evidence.
        required_evidence:
          - Red-stained paste on pendant
          - Observation of Caroline West wearing gloves
        reader_observable: true
      - observation: Alicia Driscoll was pale and nervous during accusations.
        correction: Her demeanor was due to social pressure, not guilt.
        effect: Alicia was innocent and a victim of misdirected suspicion.
        required_evidence:
          - Witness statements about Alicia's behavior
          - Red-stained fingers test results
        reader_observable: true
      - observation: Miss West refused to remove gloves.
        correction: She was hiding red-stained fingers but was not the thief.
        effect: Miss West was a red herring, diverting suspicion from the real culprit.
        required_evidence:
          - Glove removal request and refusal
          - Red-stained fingers test results
        reader_observable: true
      - observation: The pendant was returned mysteriously after thefts.
        correction: Caroline West returned some stolen items to expose Alicia's guilt.
        effect: The thefts were part of a personal vendetta, not random crimes.
        required_evidence:
          - Testimony about returned jewels
          - Physical evidence of returned pendant in Violet Strange's room
        reader_observable: true
      - observation: Violet Strange's red-stained fingers test was decisive.
        correction: The test conclusively identified Caroline West as the thief.
        effect: The true culprit was revealed and cleared Alicia Driscoll.
        required_evidence:
          - Red-stained fingers test results showing stains on Caroline West's hands
          - Physical observation of red stains on Caroline West's fingers after glove removal
        reader_observable: true
  discriminating_test:
    method: constraint_proof
    design: >-
      Violet Strange applied a red-stained paste to her pendant, which would mark the fingers of
      anyone who touched it. During the investigation, all suspects were asked to remove gloves and
      show their hands. The presence or absence of red stains on their fingers served as a concrete
      test of who had handled the pendant.
    knowledge_revealed: >-
      This test revealed that Caroline West's fingers were stained despite her attempts to conceal
      them with gloves, proving her guilt.
    pass_condition: >-
      The true thief must have red-stained fingers matching the paste on the pendant, eliminating
      all others.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the social setting, the presence of the
      red-stained paste on the pendant, and the discovery of the gold-colored slipper. The behavior
      of the suspects, especially Caroline West's refusal to remove gloves, and Violet Strange's
      observations provide all necessary clues. The red-stained fingers test is explicitly
      described, allowing attentive readers to deduce the true culprit before the confession.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
