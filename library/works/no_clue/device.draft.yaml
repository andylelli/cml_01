pattern_id: no_clue
title: The Framed Discovery
family: spatial_routing
axes:
  - identity
principle: >-
  It obscures the true culprit, the culprit, who actually made the dagger and committed the murder,
  manipulating a suspect and others to cover his tracks.
principleType: cognitive_bias
surface_illusion_template: >-
  a suspect a suspect killed the victim to silence her demands.; a suspect a suspect was the
  murderer acting out of jealousy.; a suspect a suspect was involved in the murder or is covering
  for someone.
underlying_reality_template: >-
  the culprit, driven by fear of exposure of a past murder and financial desperation, crafted an
  improvised dagger from a nail file and a bed slat. He killed the victim at the appointed time
  after receiving her letter. He attempted to conceal his guilt by manipulating others and staging
  the discovery of the body.
feasibility:
  eras:
    - 1850
    - 1860
    - 1870
    - 1880
    - 1890
    - 1900
    - 1910
    - 1920
    - 1930
    - 1940
    - 1950
  requires:
    - physical_evidence_manipulation
    - social_influence
  forbids:
    - cctv
    - automated_fingerprint_search
clue_archetypes:
  - steel_particles_found_on
  - magnet_test_results_from
  - handkerchief_with_cigar_ashes
  - witness_testimony_of_wilton
  - testimony_of_stevens_from
  - police_report_of_russell
sources:
  - James Hay, "No Clue!" — library/works/no_clue/case.cml2.yaml
