pattern_id: max_carrados
title: The Faked Theft
family: spatial_routing
axes:
  - identity
principle: >-
  The coin theft was a staged ruse by the conspirators to mislead the investigator and the
  authorities, masking their forgery operations.
principleType: social_logic
surface_illusion_template: >-
  The thefts were committed by an insider with access to keys; The coin theft was a genuine robbery
  from the British Museum; The accomplices were acting independently without a coordinated plan
underlying_reality_template: >-
  the culprit the the culprit rented multiple safes and secretly duplicated the keys to them. Using
  disguises, he gained access to the safes without raising suspicion and removed valuables. the
  culprit and her accomplices staged a fake coin theft from the British Museum to mislead
  investigators and cover their forgery operations.
