  inference_path:
    steps:
      - observation: >-
          Several safes were found emptied without signs of forced entry or disturbance to the
          electric light arrangements in the house.
        correction: >-
          The theft was not by force but by key duplication, and the electric light was not tampered
          with during the thefts.
        effect: >-
          Focus investigation on key access, insider knowledge, and the arrangement of the house's
          electric light system.
        required_evidence:
          - >-
            Safe deposit access logs showing no forced entry or interruption to electric light
            arrangements in the house
          - >-
            Physical keys held by clients and staff, and inspection of the house's electric light
            wiring
        reader_observable: true
      - observation: >-
          A man in disguise was seen renting multiple safes and arranging his visits to avoid
          notice.
        correction: The man is likely the thief using disguises and careful arrangement of his house visits.
        effect: Identify suspect by disguises, rental records, and the arrangement of his house visits.
        required_evidence:
          - Photograph of Ulysses K. Groom in disguise taken during one of his arranged house visits
          - Safe rental records with aliases and arrangement of visit times
        reader_observable: true
      - observation: >-
          Coins stolen from British Museum reported missing, and the arrangement of the house
          suggested a planned deception.
        correction: >-
          The theft may be a staged ruse, with the arrangement of the house and electric light used
          to mislead.
        effect: >-
          Investigate possibility of forgery, deception, and arrangement of the house's electric
          light for alibi.
        required_evidence:
          - Testimony of Madame Ferraja about the arrangement of the house during the supposed theft
          - Examination of coin authenticity and arrangement of the house's electric light system
        reader_observable: true
      - observation: >-
          Madame Ferraja and accomplices possess stolen coins and arranged their house to avoid
          suspicion.
        correction: >-
          They are involved in forgery and theft, and arranged the house and electric light to
          support their alibi.
        effect: >-
          Link coin theft to forgery ring and arrangement of the house's electric light as part of
          the deception.
        required_evidence:
          - Coins found at Heronsbourne Place and arrangement of the house's electric light switches
          - Statements from accomplices about the arrangement of the house during the theft
        reader_observable: true
      - observation: >-
          Manager denies complicity but safe was opened and the arrangement of the house's electric
          light was unchanged.
        correction: >-
          Manager unaware but security compromised by key duplication and arrangement of the house's
          electric light.
        effect: >-
          Exclude manager as culprit but consider security flaws and arrangement of the house's
          electric light.
        required_evidence:
          - >-
            Manager's testimony about the arrangement of the house's electric light during the
            thefts
          - >-
            Safe deposit security measures documentation and arrangement of the house's electric
            light
        reader_observable: true
      - observation: >-
          Photographs of record-book pages taken by accomplice's wife revealed the arrangement of
          the house and suspects' reliance on sight.
        correction: >-
          Inside information used to target safes, and arrangement of the house's electric light
          exploited suspects' reliance on sight.
        effect: >-
          Confirm insider assistance in thefts, arrangement of the house, and suspects' reliance on
          sight.
        required_evidence:
          - Photographs of record-book showing arrangement of the house and electric light
          - >-
            Witness statements of accomplice's wife about arrangement of the house and suspects'
            reliance on sight
        reader_observable: true
      - observation: >-
          Carrados traps conspirators in darkness by arranging the house's electric light to be cut,
          revealing the suspects' reliance on sight.
        correction: >-
          Conspirators rely on darkness to control situation, but arrangement of the house's
          electric light and their reliance on sight exposes them.
        effect: >-
          Use darkness and arrangement of the house's electric light as equalizer in confrontation,
          revealing the suspects' reliance on sight.
        required_evidence:
          - Burned-out wire in distributing box showing arrangement of the house's electric light
          - >-
            Testimony of Montmorency and Dompierre about arrangement of the house and their reliance
            on sight
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      Carrados arranges a meeting at a house with the suspects and deliberately cuts the electric
      light, plunging the room into darkness. He relies on his acute hearing and marksmanship to
      control the situation and prevent escape or attack. The suspects' reactions and inability to
      move without noise confirm their guilt.
    knowledge_revealed: >-
      The test reveals the suspects' reliance on sight and their fear of Carrados's marksmanship,
      confirming their criminal intent and presence at the scene.
    pass_condition: >-
      The suspects remain immobilized and silent in darkness, unable to escape or overpower
      Carrados.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the safe deposit's security measures and the
      suspects' disguises and behaviors. Clues such as the psychological pause on hearing 'New
      York,' the presence of duplicated keys, and the staged coin theft are all presented. The
      method of key duplication and the use of disguises are explained, allowing attentive readers
      to deduce the true mechanism.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
