  inference_path:
    steps:
      - observation: Van Dusen communicated with outside via linen notes tied to rats
        correction: He used a hidden drain pipe to send and receive messages
        effect: Established external communication despite prison isolation
        required_evidence:
          - Linen notes with money tied sent from Cell 13
          - Guard's report of rat with linen note outside prison
        reader_observable: true
      - observation: Gas lights in Henley's apartment went out despite locked doors
        correction: Gas jets were extinguished by blowing into gas pipes from adjacent apartment
        effect: Explained how gas was put out without physical entry
        required_evidence:
          - Loose gas jet tip found in Cabell's apartment
          - Mirror on flagpole used to watch Henley
        reader_observable: true
      - observation: Scarlet thread found on flagpole rope
        correction: Thread came from Cabell's bath robe worn by the valet
        effect: Linked valet Jean to the crime scene
        required_evidence:
          - Chemical test matching thread to bath robe
          - Valet's possession of bath robe with scarlet stripe
        reader_observable: true
      - observation: Handkerchief with violet perfume found near bank safe
        correction: Perfume linked to Louise Clarke, implicating her in the bank robbery
        effect: Identified inside accomplice in bank burglary
        required_evidence:
          - Perfume odor on handkerchief and on Dunston's handkerchief
          - Miss Clarke's change from violet to rose perfume
        reader_observable: true
      - observation: Grace Field disappeared; letter threatening her found
        correction: She was held captive by St. George, who attacked Willis
        effect: Connected disappearance and attack to St. George
        required_evidence:
          - Chloroform odor in studio closet
          - Blood-stained revolver found with St. George
        reader_observable: true
      - observation: St. George escaped hospital and was found raving mad
        correction: His mental collapse was due to attack and guilt over captivity
        effect: Explained his erratic behavior and connection to Grace Field
        required_evidence:
          - Hospital records of St. George's condition
          - Witness accounts of attack on Willis
        reader_observable: true
      - observation: Valet Jean's sullen and defiant behavior when accused
        correction: Physical evidence and witness statements linked Jean to the murder and attempted murder
        effect: Confirmed Jean as the culprit in Henley and Regnier cases
        required_evidence:
          - >-
            Scarlet thread from bath robe found on flagpole and chemical test matching it to Jean's
            robe
          - Witness statement describing Jean's actions and presence during the critical times
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Reenact the escape from Cell 13 by simulating the conditions and testing the drain pipe
      communication and the cutting of the arc light feed wire with acid. Observe if the prisoner
      can exit the cell and prison undetected using the described method.
    knowledge_revealed: >-
      Confirms the physical means of escape via the drain pipe and external assistance, disproving
      the theory of mental escape alone.
    pass_condition: >-
      Successful exit from the cell and prison using the drain pipe and acid cutting method without
      detection.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the prison layout, the drain pipe, the notes
      sent, and the presence of the arc light feed wire near the cell window. The chemical
      properties of acid and the use of rats for message delivery are explained. Similarly, in other
      cases, clues such as the scarlet thread, the mirror on the flagpole, the perfume scent on the
      handkerchief, and the handwriting samples are all presented. Logical deduction and careful
      attention to these clues allow the reader to solve the mysteries alongside the detective.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
