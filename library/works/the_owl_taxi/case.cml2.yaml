        - Amy Wilmot
        - Francisco de Socotra
        - De Silva
      objects:
        - Taxi cab T7011
        - Little black book
        - Hotel rooms and apartments
        - Sanitarium
        - Ladder for window entry
    social:
      trust_channels:
        - Notes and telegrams exchanged via taxi
        - Hall-boy Frank
        - Bessie Bickle's taxi yard
        - Maid Nina
      authority_sources:
        - Local police
        - Hotel clerks
        - Doctor Emslie at sanitarium
        - Undertaker
  inference_path:
    steps:
      - observation: The body of Antonio Bareda was found dead in a taxi cab with no visible wounds.
        correction: De Silva used a hypodermic needle with poison to kill Bareda silently.
        effect: The murder method was subtle and left no external marks.
        required_evidence:
          - Hypodermic needle found in De Silva's room
          - Doctor's report on Bareda's body showing no external wounds but symptoms of poisoning
        reader_observable: true
      - observation: A little black book was recovered but contained only flattering testimonials.
        correction: The recovered book was a forged copy; the original was hidden elsewhere.
        effect: The evidence initially found was misleading.
        required_evidence:
          - Estuban's analysis of the book's contents
          - De Silva's note about hiding the original book
        reader_observable: true
      - observation: Francisco de Socotra impersonated Antonio Bareda to mislead political authorities.
        correction: De Socotra used the forged book to deceive the President and others.
        effect: The political conspiracy involved impersonation and forgery.
        required_evidence:
          - Pa Simmons' surveillance report of de Socotra
          - Greg's observation of de Socotra carrying the forged book
        reader_observable: true
      - observation: Amy Wilmot was disguised as a boy and communicated secretly with Greg.
        correction: Amy was the niece of Bareda and opposed de Socotra's plans.
        effect: Amy was a key ally in recovering the evidence and exposing the conspiracy.
        required_evidence:
          - Notes exchanged between Amy and Greg
          - Amy's testimony and actions
        reader_observable: true
      - observation: De Silva attempted suicide and was found in a distressed state.
        correction: De Silva was a remorseful hired assassin who confessed to the murder.
        effect: De Silva's mental state confirmed his guilt and the murder method.
        required_evidence:
          - Doctor's report on De Silva's condition after suicide attempt
          - Hypodermic needle found in De Silva's room
        reader_observable: true
      - observation: De Socotra was confronted and escaped multiple times during the raid.
        correction: De Socotra's escape delayed justice but he was ultimately cornered.
        effect: The final confrontation was tense and required coordinated effort.
        required_evidence:
          - Greg and Estuban's raid reports
          - Witness accounts of de Socotra's escape
        reader_observable: true
      - observation: De Socotra died suddenly of heart failure after the confrontation.
        correction: De Socotra's death ended the political threat and allowed reform.
        effect: The villain's demise resolved the case and restored justice.
        required_evidence:
          - Doctor's report on de Socotra's death
          - Señora de Socotra's statements
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Gregory Parr and Mario Estuban disguised Greg as a shabby cabman and used the taxi to lure
      Francisco de Socotra into revealing the little black book. They staged a hold-up and searched
      his hotel room and headquarters to confirm the presence of the original book and expose the
      forgery.
    knowledge_revealed: >-
      This test revealed the true location of the original little black book and confirmed de
      Socotra's impersonation and guilt.
    pass_condition: >-
      De Socotra is caught with the forged book and the original is found hidden, proving the
      deception.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given access to all key clues including the discovery of the dead body, the
      forged and original little black books, the notes and telegrams exchanged, and the
      observations of the characters. The disguises, surveillance, and political context are clearly
      described, allowing an attentive reader to deduce the true murderer and the method of the
      crime. The false solution and red herrings are plausible but contradicted by concrete evidence
      presented before the final reveal.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
