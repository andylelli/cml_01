        - Statue of Britannia
        - Locked temple door
        - Motorbike
        - State papers
        - Iron prop from statue
    social:
      trust_channels:
        - Family relationships
        - Political alliances
        - Police hierarchy
        - Servants and staff
      authority_sources:
        - British police
        - Government ministers
        - Military officials
        - Legal authorities
  inference_path:
    steps:
      - observation: The statue of Britannia was found toppled with a body beneath it.
        correction: The body was placed there after death; the statue fell after the murder.
        effect: The death was staged to look like an accident.
        required_evidence:
          - Pools of blood around the statue and body
          - Doctor Prince's wound analysis of the throat cut
        reader_observable: true
      - observation: Two swords of identical pattern were present at the scene.
        correction: One sword was used in the duel; the other was a duplicate brought by Horne Fisher.
        effect: The murder weapon was not unique, complicating identification.
        required_evidence:
          - Description of swords with wavy edges and jeweled hilts
          - Horne Fisher's admission of bringing duplicate swords
        reader_observable: true
      - observation: Horne Hewitt's coat was removed before death.
        correction: He removed it himself to prepare for the duel.
        effect: Explains how the murderer could remove the coat without suspicion.
        required_evidence:
          - Absence of struggle signs on the coat
          - Coat found folded on the garden bench before the duel
        reader_observable: true
      - observation: Sir Henry Harland Fisher was found in captivity in a locked room.
        correction: He was captured by his brother Horne Fisher after the murder.
        effect: Reveals the family betrayal and motive.
        required_evidence:
          - Description of locked room with iron grating
          - Horne Fisher's testimony about captivity
        reader_observable: true
      - observation: Lord Bulmer disappeared after a cry was heard at daybreak.
        correction: He was murdered on the ice by a deliberate crack and sabotage.
        effect: The disappearance was a murder disguised as an accident.
        required_evidence:
          - Description of cracked ice and thawing
          - Witness statements about Bulmer's last movements
        reader_observable: true
      - observation: Prince Michael was accused of killing police officers at the tower.
        correction: Police officer Wilson killed his comrades to remove obstacles to promotion.
        effect: Prince Michael was innocent of the murders.
        required_evidence:
          - Wilson's firing pattern and revolver charges
          - Nolan's dying gesture identifying Wilson
        reader_observable: true
      - observation: The relic St. Paul's Penny was stolen from a locked glass case.
        correction: It was removed using a magnet on a string through a hole in the floor.
        effect: The theft was a clever mechanical trick, not a supernatural event.
        required_evidence:
          - Description of broken wire and hole in floor
          - Mesmerist's trance observations
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Horne Fisher and Harold March recreate the duel using the duplicate swords and the statue
      setting. They observe the sequence of events, including the removal of the coat, the fatal
      wound, and the statue's fall. They also test the physical impossibility of moving the statue
      after the murder. This reenactment confirms the timing and method of the murder and the
      staging of the scene.
    knowledge_revealed: >-
      The reenactment reveals that the victim removed his coat before the duel, the murderer used a
      duplicate sword, and the statue fell after the victim was killed, making it impossible for the
      murderer to have moved the body afterward.
    pass_condition: >-
      The reenactment must demonstrate that the murder and staging could be performed by one person
      alone, with the victim removing his coat, and that the statue could not have been lifted after
      falling.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the duplicate swords, the statue and its iron
      prop, and the timing of events. The presence of two swords of identical pattern and the
      victim's coat removal are explicitly mentioned. The physical impossibility of moving the
      statue after the murder is discussed by the detective. The family relationships and political
      motives are clearly outlined. The false accusations against other suspects are presented and
      refuted within the narrative, allowing the attentive reader to deduce the true culprit.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
