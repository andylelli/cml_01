  inference_path:
    steps:
      - observation: >-
          Missing horseshoe found under Crumb’s body matched Custer’s horse shoes; the movement of
          the horses and the timing of the pack train were noted by authorities.
        correction: Allen admitted to planting the horseshoe to frame Custer.
        effect: Discredits direct physical evidence against Custer.
        required_evidence:
          - >-
            Testimony of Slick Allen admitting planting the horseshoe and describing the movement of
            the horses on the night of the murder
          - >-
            Physical horseshoe recovered from crime scene, including a timing record of when it was
            found
        reader_observable: true
      - observation: >-
          Shannon Burke was seen sweeping the trail near the crime scene, and her movement was
          observed by a camp flunky.
        correction: She was trying to erase tracks to protect Custer, not hide her own guilt.
        effect: Explains suspicious behavior without implicating her in murder.
        required_evidence:
          - >-
            Witness statement of camp flunky seeing Shannon sweeping and describing the timing of
            her actions
          - >-
            Shannon’s testimony about her actions, including her movement on the morning after the
            murder
        reader_observable: true
      - observation: >-
          Guy Evans had motive and was involved in bootlegging stolen whisky; his movement to and
          from the camp was not accounted for, and his timing matched the murder window.
        correction: Guy’s confession revealed he killed Crumb in revenge for his sister’s death.
        effect: Identifies true murderer and motive.
        required_evidence:
          - >-
            Physical evidence of Guy Evans’s presence at the scene, such as matching horse tracks
            and a timeline of his movement
          - >-
            Testimony about Grace Evans’s death and Crumb’s role, including statements about Guy’s
            motive
        reader_observable: true
      - observation: >-
          Custer was found with a pistol matching the murder weapon, but the movement of the weapon
          was not directly traced to him.
        correction: No evidence Shannon ever possessed such a pistol; Guy killed Crumb.
        effect: Weakens prosecution’s motive and weapon evidence against Custer.
        required_evidence:
          - >-
            Testimony of Japanese servant about Shannon’s lack of pistol and access record for the
            weapon’s movement
          - >-
            Ballistics evidence linking bullet to pistol found in Custer’s room, including timing of
            when the pistol was found
        reader_observable: true
      - observation: >-
          Shannon’s testimony about killing Crumb was inconsistent with physical evidence, and her
          movement did not include access to the murder weapon.
        correction: She confessed to killing Crumb to protect Custer but did not have the murder weapon.
        effect: Suggests false confession to shield Custer.
        required_evidence:
          - Shannon’s testimony and timeline of her movement on the night of the murder
          - Ballistics and witness testimony about murder weapon, including timing of shots heard
        reader_observable: true
      - observation: >-
          Allen’s sudden change of heart and testimony supporting Shannon included details about the
          movement of evidence and the timing of events.
        correction: Allen is Shannon’s father and sought to protect her and implicate Custer.
        effect: Explains motive behind framing and evidence planting.
        required_evidence:
          - >-
            Allen’s written statement describing his movement and actions, including the timing of
            planting the horseshoe
          - >-
            District attorney’s office investigation records including Allen’s timeline and
            opportunity as a rider
        reader_observable: true
      - observation: >-
          Bartolo’s threats to Shannon and involvement in narcotics gang included movement of
          narcotics and timing of threats to keep her silent.
        correction: Bartolo coerced Shannon to protect Custer and himself from exposure.
        effect: Shows criminal gang’s role in framing and intimidation.
        required_evidence:
          - Shannon’s testimony about Bartolo’s threats and the timing of their encounters
          - >-
            Mexican gang’s activities and Allen’s statements, including movement of narcotics and
            riders
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Reenact the movements of the horses and riders on the night of the murder, including the
      timing of the pack train and the location of the murder. Compare the horseshoes and tracks
      found at the scene with those of the Pennington horses and the burros. Verify the presence or
      absence of the murder weapon with each suspect.
    knowledge_revealed: >-
      This test reveals who had physical access to the crime scene at the time of the murder and
      whose horseshoes and tracks match those found. It also clarifies who could have carried the
      murder weapon.
    pass_condition: >-
      The reenactment confirms that only Guy Evans’s movements and horse tracks align with the
      murder scene and timing, and that the murder weapon was not in Shannon’s possession.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the characters’ movements, the timing of the pack
      train, and the physical evidence such as horseshoes and tracks. Shannon’s suspicious behavior
      and Allen’s threats are presented with plausible innocent explanations. The confession of Guy
      Evans and the planting of evidence by Allen are foreshadowed through dialogue and character
      interactions. Careful attention to these clues allows the reader to deduce the true culprit
      and the framing scheme.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
