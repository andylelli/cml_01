  culpability:
    culprit_count: 1
    culprits:
      - Guy Thackeray Evans
  surface_model:
    narrative:
      summary: >-
        Custer Pennington is arrested and convicted for the murder of Wilson Crumb, a narcotics
        peddler and actor-director. Shannon Burke, a former addict and friend of the Penningtons, is
        also charged but later acquitted. The case appears straightforward with circumstantial
        evidence pointing to Custer, but underlying criminal activities and family secrets
        complicate the truth.
    accepted_facts:
      - Wilson Crumb was found dead with a gunshot wound.
      - Custer Pennington was found near the crime scene with the victim’s horseshoe.
      - Shannon Burke had a past association with Crumb and was seen erasing tracks near the body.
      - Guy Evans was involved in bootlegging stolen whisky and had motive against Crumb.
    inferred_conclusions:
      - Custer Pennington was the murderer motivated by jealousy and love.
      - Shannon Burke was an accomplice or accessory to the murder.
      - Guy Evans was innocent and uninvolved in the murder.
  hidden_model:
    mechanism:
      description: >-
        Guy Evans killed Wilson Crumb in revenge for Crumb’s role in the downfall and death of his
        sister Grace. Evans rode to Crumb’s camp, confronted him, and shot him. To divert suspicion,
        Slick Allen planted evidence implicating Custer Pennington by placing the horse’s missing
        shoe under the body and misleading authorities. Shannon Burke, unaware of the full truth,
        initially tried to protect Custer by erasing tracks.
      delivery_path:
        - step: Guy Evans learns of Crumb’s abuse and death of his sister Grace.
        - step: Evans obtains a pistol and rides to Crumb’s camp in Jackknife Cañon.
        - step: Evans confronts and shoots Crumb during a nighttime encounter.
        - step: Evans hides the pistol and rides away to avoid suspicion.
        - step: Slick Allen, fearing exposure, plants Custer Pennington’s horseshoe at the crime scene.
        - step: Authorities arrest Custer based on circumstantial evidence and planted clues.
        - step: Shannon Burke attempts to erase tracks, unknowingly complicating the investigation.
    outcome:
      result: >-
        Guy Evans confesses to the murder, exonerating Custer Pennington, who is released before
        execution.
  false_assumption:
    statement: >-
      Custer Pennington was the murderer because he was found near the crime scene with
      incriminating evidence.
    type: identity
    why_it_seems_reasonable: >-
      Custer was found with the victim’s horseshoe and had no solid alibi, and circumstantial
      evidence and witness testimony pointed to him. The prosecution presented a coherent narrative
      of jealousy and opportunity.
    what_it_hides: >-
      It hides the fact that the real murderer was Guy Evans, who had motive and opportunity, and
      that the evidence was planted by a third party to frame Custer.
  false_solution:
    accused_suspect: Custer Pennington
    supporting_points:
      - Found near the crime scene with the victim’s horseshoe under the body
      - Had a pistol matching the murder weapon in his room
      - Was seen riding near the victim’s camp on the night of the murder
      - Had a motive of jealousy and love for Shannon Burke
    the_one_flaw: The evidence was circumstantial and some was planted by a criminal associate to frame him.
    refuted_in_chapter: 34
  red_herrings:
    - id: shannon_burke_suspicious_behavior
      description: >-
        Shannon Burke was seen sweeping the trail near the murder scene and had a past with the
        victim.
      points_at_suspect: Shannon Burke
      innocent_explanation: She was trying to erase tracks to protect Custer, not to hide her own guilt.
      resolved_in_chapter: 34
    - id: slick_allen_threats_and_criminality
      description: >-
        Slick Allen’s threats and criminal background suggested he might have committed the murder
        or framed others.
      points_at_suspect: Slick Allen
      innocent_explanation: >-
        Allen was involved in narcotics and bootlegging but did not commit the murder; he planted
        evidence to protect himself.
      resolved_in_chapter: 34
