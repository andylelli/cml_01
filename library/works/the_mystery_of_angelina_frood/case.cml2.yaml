  culpability:
    culprit_count: 1
    culprits:
      - Angelina Frood (Peter "Jimmy" Bundy)
  surface_model:
    narrative:
      summary: >-
        Angelina Frood mysteriously disappears, and a skeleton dressed in her clothes is found
        buried in a city wall. The police suspect murder, but the body is unrecognizable and the
        husband is missing. A disguised figure named Mr. Bundy appears, complicating the
        investigation.
    accepted_facts:
      - Angelina Frood disappeared on the night of April 26th
      - A skeleton dressed in her clothes was found buried in the city wall
      - Nicholas Frood, her husband, died earlier and was identified posthumously
      - Mr. Bundy is a person who appeared in Rochester shortly after Angelina's disappearance
    inferred_conclusions:
      - The skeleton is Angelina Frood's body
      - Nicholas Frood is the prime suspect for murder
      - Mr. Bundy is an unrelated man impersonating someone else
  hidden_model:
    mechanism:
      description: >-
        Angelina Frood faked her disappearance and death by purchasing an ancient skeleton from a
        dealer and dressing it in her clothes to bury it in the city wall, creating the illusion of
        her death. She disguised herself as Mr. Bundy, a man with feminine features, to live
        undetected in Rochester. The real Nicholas Frood died earlier from a cocaine overdose,
        removing him from suspicion. Dr. Thorndyke uncovered the deception through photographic
        comparison, fingerprint analysis, and forensic evidence.
      delivery_path:
        - step: Angelina buys an ancient female skeleton from a dealer in London
        - step: She dresses the skeleton in her own clothes and accessories
        - step: The skeleton is buried in a prepared patch of the city wall
        - step: Angelina disguises herself as Mr. Bundy with a wig, makeup, and male clothing
        - step: She maintains the disguise while interacting with acquaintances and investigators
        - step: Dr. Thorndyke obtains photographs and fingerprints to compare Bundy and Angelina
        - step: The deception is revealed at the inquest when Angelina appears in person
    outcome:
      result: >-
        Angelina Frood is revealed to be alive and disguised as Mr. Bundy, having faked her death
        with a skeleton, and the real Nicholas Frood was already dead.
  false_assumption:
    statement: The skeleton found in the city wall is the actual body of Angelina Frood.
    type: identity
    why_it_seems_reasonable: >-
      The skeleton was found dressed in Angelina's clothes and jewelry, and the disappearance of
      Angelina coincided with the discovery. The presence of personal effects and the skeleton's
      location strongly suggested it was her body.
    what_it_hides: >-
      It conceals that the skeleton was an ancient specimen purchased and planted by Angelina
      herself to fake her death, while she lived disguised as Mr. Bundy.
  false_solution:
    accused_suspect: Nicholas Frood
    supporting_points:
      - He was known to be violent and addicted to drugs
      - He was searching for Angelina and had threatened her life
      - He carried a sheath-knife and had a motive of jealousy
      - He disappeared suspiciously around the time of Angelina's disappearance
    the_one_flaw: Nicholas Frood died before Angelina's disappearance and could not have committed the crime.
    refuted_in_chapter: 19
  red_herrings:
    - id: mole_man_pawned_brooch
      description: A man with a mole on his nose pawned Angelina's brooch, suggesting a suspicious character.
      points_at_suspect: An unknown local man possibly involved in the crime
      innocent_explanation: The man likely found the brooch and pawned it without involvement in the crime.
      resolved_in_chapter: 14
    - id: lost_gate_key
      description: The disappearance of the gate key to the city wall patch where the skeleton was found.
      points_at_suspect: Someone with access to the wall area, possibly the murderer
      innocent_explanation: The key was lost or taken as a prank and thrown over the fence, unrelated to the crime.
      resolved_in_chapter: 14
  closed_circle:
    suspects:
      - Angelina Frood (Peter "Jimmy" Bundy)
      - Nicholas Frood
      - Mr. Japp
      - Sergeant Cobbledick
      - Mrs. Gillow
      - Dr. John Strangeways
