        - Dr. John Thorndyke medico-legal expertise
        - Coroner's inquest
  inference_path:
    steps:
      - observation: Skeleton found buried in city wall with personal effects of Angelina Frood
        correction: The skeleton was ancient and purchased, not Angelina's real body
        effect: Disproves that Angelina is dead and body in wall is hers
        required_evidence:
          - Bill from Oscar Hammerstein for purchase of skeleton dated April 19th
          - Photographic comparison of Mr. Bundy and Angelina Frood
        reader_observable: true
      - observation: Mr. Bundy appears as a man with masculine clothing and manner
        correction: Mr. Bundy is actually Angelina Frood in disguise
        effect: Explains the presence of 'Mr. Bundy' and faked disappearance
        required_evidence:
          - Fingerprints on tumbler and bottle matching Angelina Frood
          - Photographic composites and expert testimony by Dr. Thorndyke
        reader_observable: true
      - observation: Nicholas Frood is missing and suspected of murder
        correction: Nicholas Frood died earlier from cocaine overdose
        effect: Removes Nicholas Frood as suspect in Angelina's disappearance
        required_evidence:
          - Identification of Nicholas Frood's body at St. Barnabas hospital
          - Witness testimony of landlady and Dr. Strangeways
        reader_observable: true
      - observation: Quicklime burial believed to destroy bodies
        correction: Quicklime preserves bodies by drying, not destroying
        effect: Skeleton in wall could not be recent and is not Angelina's
        required_evidence:
          - Experiments by Mr. A. Lucas and Dr. Thorndyke on quicklime effects
          - Expert testimony at inquest
        reader_observable: true
      - observation: Clues found progressively up the river and lane
        correction: Clues were deliberately planted to mislead investigators
        effect: Supports theory of staged disappearance and deception
        required_evidence:
          - Map of find locations from brooch to gate key
          - Testimony of Sergeant Cobbledick and Dr. Thorndyke
        reader_observable: true
      - observation: Fingerprints on household objects match Angelina Frood
        correction: Confirms that Angelina was present in the house disguised
        effect: Supports identity of Mr. Bundy as Angelina Frood
        required_evidence:
          - Photographs of fingerprints on tumbler, bottle, and kitchen objects
          - Expert analysis by Dr. Thorndyke
        reader_observable: true
      - observation: Mr. Bundy and Angelina Frood never seen together
        correction: They are the same person using disguise and deception
        effect: Explains how the deception was maintained
        required_evidence:
          - Testimony of Dr. Strangeways and photographic evidence
          - Expert testimony on disguise and personation
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Dr. Thorndyke and Dr. Strangeways visited Angelina's house to powder and photograph
      fingerprints on objects she had touched, including a tumbler and water bottle. They compared
      these prints with those found on photographs of Mr. Bundy, revealing identity. Photographic
      composites were created to compare facial features of Bundy and Angelina, confirming they were
      the same person.
    knowledge_revealed: >-
      The test revealed that Mr. Bundy was actually Angelina Frood in disguise, proving the
      personation and faked death.
    pass_condition: >-
      Matching fingerprints and photographic facial features conclusively demonstrate the identity
      of Mr. Bundy as Angelina Frood.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is provided with detailed descriptions of the characters, their appearances, and
      behaviors, including the physical peculiarities of Mr. Bundy and Angelina Frood. The narrative
      includes detailed accounts of the photographic and fingerprint evidence, as well as the
      discovery of the skeleton and the key. The clues are all presented openly, allowing an
      attentive reader to deduce the deception and the true identity of Mr. Bundy before the final
      reveal.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
