      - Mr. Philip Baddock
      - Mr. Felkin
      - Lady Irene Culledon
      - Miss Cruikshank (Mrs. Thomas)
    rationale: >-
      All suspects had access, motive, and opportunity; the investigation focused on these
      individuals due to their relationships with victims and involvement in the events.
  constraint_space:
    time:
      anchors:
        - December 24th-25th, 1903 (Major Ceely murder)
        - February 5th, 1907 (Mary Nicholls body found)
        - April 1904 (Mr. Steadman murder)
        - January 23rd, 1907 (Mary Nicholls disappearance)
        - September 20th (Brittany will opening)
      windows:
        - Night of January 23rd for Mary Nicholls disappearance
        - Christmas Eve night for Major Ceely murder
        - Evening of April 1904 for Mr. Steadman murder
        - Afternoon of Mark Culledon murder
        - Early morning hours for Mrs. Dunstan murder
    access:
      actors:
        - House servants
        - Family members
        - Visitors
        - Detectives
      objects:
        - Elkhorn Woods
        - Ash Court grounds
        - Appledore Castle
        - Eaton Terrace house
        - Mathis’ café
    social:
      trust_channels:
        - Servants’ testimonies
        - Family confidences
        - Legal documents
        - Witness statements
      authority_sources:
        - Scotland Yard
        - Local police
        - Coroner
        - Medical officers
  inference_path:
    steps:
      - observation: >-
          Captain Hubert de Mazareen was last seen with Mr. Steadman and carried a stick found near
          the murder scene.
        correction: The stick was planted by Felkin, who also cut his own hand to stain it.
        effect: De Mazareen was framed for the murder.
        required_evidence:
          - Testimony of chauffeur George Taylor about car breakdown and walking through woods
          - >-
            Physical examination of the stick showing blood not matching the victim and presence of
            Felkin's fingerprints
        reader_observable: true
      - observation: >-
          Lady Irene Culledon wore a large hat similar to the one described by witnesses at Mathis’
          café.
        correction: The hat was specially ordered and worn only once on the day of the murder.
        effect: Identified Lady Irene as the woman in the big hat and murderer.
        required_evidence:
          - Testimony of maid about hat order and wearing
          - Waitresses’ identification and contradictory statements about the hat
        reader_observable: true
      - observation: Miss Cruikshank was a loyal servant and victim of circumstances.
        correction: She impersonated Mrs. Thomas and murdered Mrs. Dunstan using a bag of sand and gas.
        effect: Revealed Miss Cruikshank as the murderer.
        required_evidence:
          - Discovery of disguise clothes in coal cellar belonging to Mrs. Thomas
          - Bag of sand with traces matching those found at the murder scene
        reader_observable: true
      - observation: Mr. Philip Baddock was a wealthy relative with motive for murder.
        correction: He conspired with Felkin to forge a will and murder Mr. Steadman.
        effect: Exposed Baddock as mastermind behind Steadman’s murder.
        required_evidence:
          - Forged will and related documents found in Baddock's study
          - Handwriting analysis of the forged will compared to Baddock and Felkin
        reader_observable: true
      - observation: Mary Nicholls was murdered at Ash Court.
        correction: >-
          Her sister Susan was the actual victim, impersonating Mary to meet Lord Edbrooke, who
          murdered Susan.
        effect: Changed victim identity and revealed motive of blackmail and murder.
        required_evidence:
          - Identification records showing Susan's features and clothing at time of death
          - Letter from Susan to Mary arranging the meeting with Lord Edbrooke
        reader_observable: true
      - observation: Jane Turner was assaulted by an elderly woman and a man.
        correction: >-
          Jane Turner alone staged the assault and blackmail scheme to extort money from the
          Countess of Hohengebirg.
        effect: Revealed Jane Turner as sole perpetrator of the assault and blackmail.
        required_evidence:
          - Letter from Jane Turner to the Countess demanding money and threatening exposure
          - Medical examination report showing self-inflicted wounds inconsistent with her story
        reader_observable: true
      - observation: Leonard Marvell disappeared mysteriously.
        correction: >-
          Leonard disguised himself as his sister Olive and maid Rosie Campbell to commit robberies
          and evade capture.
        effect: Explained disappearance and criminal activities as a disguise scheme.
        required_evidence:
          - Witness statements about contradictory sightings of Olive and Rosie on the same day
          - Lady Molly’s undercover observation and note exchanges revealing Leonard's disguise
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Lady Molly arranged for the maids of Lady Irene Culledon to wear large hats, including the one
      worn on the murder day, and paraded them before the Mathis’ café waitress who identified the
      mysterious woman. This test aimed to confirm if the waitress could reliably identify the
      murderer by the hat and stature.
    knowledge_revealed: >-
      The waitress’s identification of the hat and wearer confirmed Lady Irene Culledon as the woman
      in the big hat and the murderer of Mark Culledon.
    pass_condition: >-
      The waitress consistently identifies the same hat and wearer among several candidates,
      eliminating doubt about the murderer’s identity.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of characters, their motives, and timelines. Lady
      Molly’s intuitive deductions are based on clues such as the unique large hat, forged
      documents, and contradictory witness statements, all presented in the narrative. The disguised
      identities and planted evidence are foreshadowed through inconsistencies and testimonies,
      allowing an attentive reader to piece together the true culprits and their methods.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
