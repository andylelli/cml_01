  culpability:
    culprit_count: 1
    culprits:
      - Sampson Longvale
  surface_model:
    narrative:
      summary: >-
        A series of gruesome murders involving decapitations are linked to a mysterious figure
        called the Head-Hunter. The investigation leads to a wealthy baronet, Sir Gregory Penne, and
        his trained orangutan Bhag, but the true culprit is a seemingly benign old gentleman,
        Sampson Longvale, who uses a hidden guillotine in caves beneath his house to execute
        victims.
    accepted_facts:
      - Victims are found decapitated with notes typed on an old typewriter
      - Sir Gregory Penne owns an orangutan named Bhag who is trained and dangerous
      - Lawley Foss was blackmailing the Head-Hunter and was murdered
      - Adele Leamington was abducted and held prisoner at Griff Towers
    inferred_conclusions:
      - Sir Gregory Penne is the Head-Hunter murderer
      - Bhag the orangutan is responsible for the killings
      - Stella Mendoza is involved in the murders
  hidden_model:
    mechanism:
      description: >-
        Sampson Longvale, inspired by his ancestor the executioner, is the Head-Hunter who murders
        victims using a guillotine hidden in caves beneath his house. He lures victims under various
        pretenses, restrains them with handcuffs, and executes them with the guillotine. The
        orangutan Bhag is used by Sir Gregory Penne for intimidation and kidnapping but is not the
        murderer. The murders are concealed by the remote location and the secret cave system.
      delivery_path:
        - step: Longvale receives letters from victims seeking help
        - step: Victims are brought to Dower House and restrained
        - step: Longvale uses the guillotine in the cave to execute victims
        - step: Heads are sent with typewritten notes from the Head-Hunter’s typewriter
        - step: Bhag and Penne are used as red herrings to mislead investigators
        - step: Adele Leamington is abducted but escapes into the caves
        - step: Michael Brixan uncovers the cave, guillotine, and Longvale’s identity
    outcome:
      result: >-
        Sampson Longvale is revealed as the Head-Hunter murderer and dies by his own guillotine,
        while Sir Gregory Penne is imprisoned for related crimes.
  false_assumption:
    statement: Sir Gregory Penne is the Head-Hunter murderer responsible for the decapitations.
    type: identity
    why_it_seems_reasonable: >-
      Penne’s suspicious behavior, possession of the orangutan Bhag, and his violent past make him a
      natural suspect. The victims and clues are often found on or near his estate, implicating him.
    what_it_hides: >-
      It conceals the true murderer, Sampson Longvale, who operates independently using a hidden
      guillotine and manipulates events to frame Penne.
  false_solution:
    accused_suspect: Sir Gregory Penne
    supporting_points:
      - He owns the dangerous orangutan Bhag involved in abductions
      - He has a violent and suspicious past including assault
      - Bloodstained sword and missing sword found in his house
      - He was present at Griff Towers during key events
    the_one_flaw: >-
      He lacks the direct evidence and means to perform the guillotine executions in the hidden
      caves
    refuted_in_chapter: 41
  red_herrings:
    - id: bhag_the_orangutan
      description: >-
        Bhag, the trained orangutan servant of Sir Gregory Penne, is suspected of involvement in the
        crimes due to his intelligence and violent behavior.
      points_at_suspect: Sir Gregory Penne
      innocent_explanation: >-
        Bhag is used by Penne for intimidation and kidnapping but is not capable of planning or
        committing the murders.
      resolved_in_chapter: 41
    - id: lawley_foss_blackmailer
      description: >-
        Lawley Foss, the scenario editor, is suspected due to his blackmail attempts against the
        Head-Hunter.
      points_at_suspect: Sampson Longvale
      innocent_explanation: Foss was a victim who was murdered to silence his blackmail, not the perpetrator.
      resolved_in_chapter: 23
  closed_circle:
    suspects:
      - Sir Gregory Penne
      - Sampson Longvale
      - Stella Mendoza
      - Lawley Foss
      - Michael Brixan
      - Adele Leamington
      - Reggie Connolly
    rationale: >-
      The suspects are limited to the film studio company, the wealthy baronet and his associates,
      and the old gentleman Longvale, all of whom have access to the locations and potential
      motives.
  constraint_space:
    time:
      anchors:
        - Between eleven o’clock and three in the morning for Foss’s murder
        - Night and early morning hours for abductions and attacks
        - Daytime scenes at Griff Towers and studio
      windows:
        - Foss last seen alive at eleven pm
        - Adele abducted at night and escapes next day
        - Letters sent and collected on specific days
    access:
      actors:
        - Sampson Longvale (Dower House and caves)
        - Sir Gregory Penne (Griff Towers and orangutan)
        - Michael Brixan (investigator)
        - Adele Leamington (studio and Griff Towers)
      objects:
