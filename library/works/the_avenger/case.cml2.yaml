        - Guillotine in cave
        - Handcuffs
        - Lanterns in cave
        - Motor cars and motorcycles
    social:
      trust_channels:
        - Letters sent to Benefactor box
        - Police and Foreign Office cooperation
        - Studio company members’ statements
      authority_sources:
        - Foreign Office Intelligence Department
        - Scotland Yard
        - Local police
        - Studio director Jack Knebworth
  inference_path:
    steps:
      - observation: >-
          Typewritten notes with peculiar alignment found at crime scenes, suggesting an arrangement
          unique to a specific machine.
        correction: Notes typed on an old Kost machine used only by the murderer.
        effect: Focus on finding the owner of the typewriter.
        required_evidence:
          - >-
            Typewritten sheet found among studio scripts with the same peculiar arrangement as the
            crime notes.
          - >-
            Expert testimony on typewriter peculiarities, including the alignment and arrangement of
            letters.
        reader_observable: true
      - observation: >-
          Bhag the orangutan attempts to abduct Adele, acting as a tool in a staged sting to
          frighten her.
        correction: Bhag is trained by Penne but acts under his orders, not independently.
        effect: Bhag is a tool, not the murderer.
        required_evidence:
          - Witness account of Bhag’s behavior during the staged sting at Griff Towers.
          - Penne’s admission of training Bhag to follow arranged commands.
        reader_observable: true
      - observation: Lawley Foss blackmailing the Head-Hunter using a dummy letter as leverage.
        correction: Foss is a victim eliminated to silence him.
        effect: Foss is not the murderer.
        required_evidence:
          - Foss’s head found on Chobham Common with a typewritten dummy letter.
          - Foss’s financial troubles and blackmail attempts documented in his correspondence.
        reader_observable: true
      - observation: >-
          Sir Gregory Penne’s suspicious behavior and bloodstained sword, as well as his involvement
          in arranging misleading evidence.
        correction: >-
          Penne killed a man in self-defense and concealed the body, but did not arrange the
          guillotine murders.
        effect: Penne is involved in crimes but not the Head-Hunter.
        required_evidence:
          - Bloodstained sword found in Penne’s house, arranged to mislead investigators.
          - >-
            Timeline of Penne’s movements and the arrangement of evidence showing he could not
            access the cave during the murders.
        reader_observable: true
      - observation: >-
          Old man Longvale’s eccentric behavior, knowledge of medicine, and arrangement of letters
          to lure victims.
        correction: Longvale is the Head-Hunter and murderer.
        effect: Focus shifts to Longvale as the true culprit.
        required_evidence:
          - Longvale’s possession of guillotine and secret cave, arranged for executions.
          - >-
            Letters sent to the Benefactor address, collected by Longvale or his agent, showing the
            arrangement and sting operation.
        reader_observable: true
      - observation: >-
          Adele’s escape into the caves and discovery of guillotine, dummy heads, and arrangement of
          bones.
        correction: The caves are the murder site and hiding place.
        effect: Confirms Longvale’s method and location.
        required_evidence:
          - Adele’s lantern and discovery of bones and dummy heads in caves.
          - Guillotine found in cave, arranged for executions.
        reader_observable: true
      - observation: >-
          Longvale restrains and prepares Michael for execution, using a trapdoor and pulley
          arrangement as part of a final sting.
        correction: Longvale’s capture and death by his own guillotine.
        effect: Resolution of the case.
        required_evidence:
          - Trapdoor and pulley mechanism in Dower House, arranged as part of the sting.
          - >-
            Execution scene witnessed by Michael, confirming the arrangement and use of the
            guillotine.
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      Michael Brixan arranges a sting by sending dummy letters to the Benefactor address and waits
      for the collection. He then uses the pulley trapdoor in Longvale’s house to capture him and
      observe his reaction and access to the guillotine. The test reveals Longvale’s guilt by his
      possession of the guillotine and his attempt to execute Michael.
    knowledge_revealed: >-
      The trap exposes Longvale as the Head-Hunter and murderer, confirming the guillotine as the
      murder weapon and the cave as the crime scene.
    pass_condition: >-
      Longvale’s capture in the trapdoor and his possession of the guillotine equipment conclusively
      prove his guilt.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given access to all key clues: the peculiar typewritten notes, the presence of
      the guillotine and caves, the suspicious behavior of suspects, and the discovery of the
      handcuff fragment and butyl chloride. The narrative provides detailed observations and witness
      statements that allow deduction of the true murderer. The false solution implicates Penne, but
      inconsistencies and the final confession reveal the truth, enabling a careful reader to solve
      the mystery.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
