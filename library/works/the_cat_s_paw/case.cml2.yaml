  culpability:
    culprit_count: 1
    culprits:
      - Charles Craige
  surface_model:
    narrative:
      summary: >-
        Miss Susan Baird is found dead in her locked library, apparently poisoned by prussic acid on
        a peach. Suspicion falls on various relatives and acquaintances, including Kitty Baird, her
        niece and heir, and Major Leigh Wallace, a suitor. The investigation uncovers family
        secrets, forged wills, and a complex web of motives.
    accepted_facts:
      - Miss Susan Baird died from prussic acid poisoning administered on a peach.
      - The house was locked from the outside with the key left in the front door.
      - Kitty Baird inherited a large fortune from her aunt, previously unknown to her.
      - Charles Craige had financial troubles and was close to Miss Susan Baird.
    inferred_conclusions:
      - Kitty Baird murdered her aunt to inherit the fortune.
      - Major Leigh Wallace was responsible due to jealousy and family disputes.
      - Mrs. Amos Parsons was involved in the murder to gain blackmail material.
  hidden_model:
    mechanism:
      description: >-
        Charles Craige, driven by financial desperation and to cover up his forgery, poisoned Miss
        Susan Baird by applying prussic acid to one side of a fruit knife used to cut a peach. He
        ensured only Miss Baird ate the poisoned half by eating the safe side himself. He attempted
        to frame others by planting evidence and manipulating servants. He later killed Mrs. Parsons
        to silence her when she threatened exposure.
      delivery_path:
        - step: Craige applies prussic acid to one side of the fruit knife blade.
        - step: Craige cuts the peach and places the poisoned half for Miss Baird.
        - step: Miss Baird eats the poisoned half and dies within minutes.
        - step: Craige plants forged papers and the revolver in Rodgers' car to frame others.
        - step: Mrs. Parsons attempts blackmail using stolen papers.
        - step: Craige kills Mrs. Parsons by spraying poison on the cat's paw to silence her.
        - step: Craige is caught and confesses after being confronted.
    outcome:
      result: Charles Craige is arrested and confesses to the murder of Miss Susan Baird and Mrs. Parsons.
  false_assumption:
    statement: Kitty Baird is the murderer who poisoned her aunt to inherit the fortune.
    type: identity
    why_it_seems_reasonable: >-
      Kitty had a quarrel with her aunt shortly before the death and stood to gain a large
      inheritance. The revolver with her initials was found in the victim's car, suggesting
      involvement.
    what_it_hides: >-
      The revolver was planted by the real culprit, Charles Craige, to frame Kitty. The quarrel was
      unrelated to the murder, and Kitty was innocent.
  false_solution:
    accused_suspect: Kitty Baird
    supporting_points:
      - Kitty quarreled with her aunt on the day of the murder.
      - Kitty inherited a large fortune from her aunt.
      - A revolver with Kitty's initials was found in the victim's car.
      - Kitty was seen entering the house with a package of peaches.
    the_one_flaw: The revolver was planted and the evidence was manipulated by Charles Craige.
    refuted_in_chapter: 21
  red_herrings:
    - id: major_leigh_wallace_suspicion
      description: >-
        Major Leigh Wallace was suspected due to his quarrel with Miss Susan Baird and his presence
        with peaches at the house.
      points_at_suspect: His agitation and presence at the house at the time of the murder.
      innocent_explanation: He brought peaches as a peace offering and was not involved in the murder.
      resolved_in_chapter: 21
    - id: mrs_amos_parsons_blackmail
      description: >-
        Mrs. Amos Parsons was suspected of blackmail and involvement in the murder due to her
        attempts to bribe Oscar and her suspicious behavior.
      points_at_suspect: Her bribery attempts and possession of incriminating papers.
      innocent_explanation: She was trying to gain leverage but was ultimately killed by Craige to silence her.
      resolved_in_chapter: 21
  closed_circle:
    suspects:
      - Kitty Baird
      - Major Leigh Wallace
      - Charles Craige
      - Mrs. Amos Parsons
      - Ben Potter
      - Edward Rodgers
    rationale: >-
      All had access to the house, motives related to inheritance or personal interests, and were
      involved in the social circle around Miss Susan Baird.
  constraint_space:
    time:
      anchors:
        - Sunday afternoon between 3 and 5 PM
        - Discovery of body Monday morning
        - Oscar's train departure at 3 PM Sunday
        - Shooting of Rodgers late Monday night
      windows:
        - Time between poisoning and death (2-5 minutes)
        - Oscar's presence in house until 2:30 PM Sunday
        - Craige's movements Monday morning
    access:
      actors:
        - Charles Craige
        - Kitty Baird
        - Major Leigh Wallace
        - Oscar
        - Mandy
      objects:
        - Side door with modern lock and key
        - Front door with old-fashioned lock and key
        - Library with Dutch door panel
        - Fruit knife used to cut peach
        - Ivory dice cup hiding poison bottle
    social:
      trust_channels:
        - Oscar's testimony
        - Mandy's statements
        - Mrs. Parsons' information
        - Craige's legal authority
      authority_sources:
        - Inspector Mitchell
        - Coroner Penfield
        - Dr. Leonard McLean
  inference_path:
    steps:
      - observation: Poison was found only on one side of the fruit knife blade.
        correction: The poison was deliberately applied to only one side to poison only Miss Baird.
        effect: Indicates a planned murder with knowledge of victim's eating habits.
        required_evidence:
          - Deputy Coroner Fisher's autopsy report
          - Inspection of the fruit knife with poison residue
        reader_observable: true
      - observation: The front door key was found in the lock on the outside.
        correction: The door was locked from outside to trap or exclude others.
        effect: Suggests the murderer locked the house to create a closed circle.
        required_evidence:
          - Inspector Mitchell's testimony about the key
          - Police report on door lock status
        reader_observable: true
      - observation: Oscar was reported to have left on the 3 PM train but was heard talking at 5 PM.
        correction: Oscar lied about his departure to conceal his presence.
        effect: Oscar's testimony about the household movements is unreliable.
        required_evidence:
          - Witness statement of Oscar's voice at 5 PM
          - Train records confirming Oscar's departure time
        reader_observable: true
      - observation: Kitty's red coat was found in a second-hand store and then burned.
        correction: The coat was sold and then forcibly reclaimed and destroyed to hide evidence.
        effect: Indicates attempts to conceal or manipulate evidence related to Kitty.
        required_evidence:
          - Proprietor's testimony about coat sale
          - Rodgers' recovery of coat and partial destruction
        reader_observable: true
      - observation: Mrs. Parsons was found dead with cat scratches and poison on the cat's paw.
        correction: Mrs. Parsons was murdered to silence her after she attempted blackmail.
        effect: Reveals the murderer is willing to kill to cover tracks.
        required_evidence:
          - Medical report on Mrs. Parsons' death
          - Observation of cat's injured paw and poison traces
        reader_observable: true
      - observation: Charles Craige had forged documents and financial troubles.
        correction: Craige had motive to kill to cover forgery and gain financially.
        effect: Identifies Craige as the murderer with strong motive and opportunity.
        required_evidence:
          - Forgery evidence from Holt will case
          - Financial records showing Craige's debts
        reader_observable: true
      - observation: The rubber bulb syringe with poison was found missing and then returned.
        correction: Craige used the syringe to apply poison and Mrs. Parsons returned it to frame others.
        effect: Shows the use of syringe as murder weapon and framing device.
        required_evidence:
          - Discovery of syringe in library
          - Mrs. Parsons' attempt to bribe Oscar for papers
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Reenact the poisoning by applying poison to one side of a fruit knife and cutting a peach,
      then observing that only the person eating the poisoned side is affected. Test the
      accessibility of the Dutch door panel and the worn floorboards to confirm secret entry or
      exit. Examine the timing of Oscar's presence and the location of the poison syringe to confirm
      the sequence of events.
    knowledge_revealed: >-
      This test reveals that the poison was deliberately applied to one side of the knife, that the
      Dutch door panel was used for secret access, and that Oscar's testimony about his whereabouts
      was false.
    pass_condition: >-
      The reenactment confirms that only the person eating the poisoned half is affected, the Dutch
      door panel moves silently and is well used, and Oscar's presence at the house at 5 PM is
      confirmed by witness statements.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is provided with detailed descriptions of the locked house, the poison application,
      and the movements of key characters. The discovery of the poison only on one side of the
      knife, the secret Dutch door panel, and the forged will papers are all clues available to the
      reader. The false suspicions cast on Kitty and Wallace are supported by evidence but
      ultimately refuted by the confession and final revelations. The reader could solve the case by
      carefully analyzing the timing, access, and motives presented.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
