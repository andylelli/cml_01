        - emerald cross and diamonds
        - white glove
        - safe cupboard
    social:
      trust_channels:
        - Mrs. Carnthwacke's testimony
        - Hopkins's loyalty
        - Brunton's overheard conversation
        - Inspector Furnival's investigation
      authority_sources:
        - Scotland Yard
        - medical examiner
        - court inquest
        - legal counsel John Steadman
  inference_path:
    steps:
      - observation: >-
          Mrs. Carnthwacke saw a man with distinctive hands and an unpleasant voice at the office,
          and noticed the location of his seat and the inner working of the office.
        correction: The man was not Luke Bechcombe but an impersonator, using disguise to conceal himself.
        effect: >-
          The murder occurred before her visit, contradicting her timeline and revealing the
          impersonation.
        required_evidence:
          - >-
            Mrs. Carnthwacke's detailed testimony about the man's hands, beard, and voice, including
            the location of the meeting in Bechcombe's office
          - >-
            Comparison of portraits of Luke Bechcombe and the man she saw, focusing on the
            distinctive hand and beard
        reader_observable: true
      - observation: >-
          White lady's glove found at the crime scene, but the glove's inner lining showed no trace
          of the victim's blood or chloroform, and the working of the glove suggested it was too
          small for the killer's hand.
        correction: >-
          The glove belonged to Mrs. Carnthwacke but the killer's fingers were too large for it,
          indicating it was planted or dropped to mislead.
        effect: >-
          The glove was planted or dropped by an accomplice or the killer to mislead investigators
          about identity.
        required_evidence:
          - >-
            Fingerprint expert report on glove and murderer's prints, showing no match to the victim
            or Mrs. Carnthwacke
          - Mrs. Carnthwacke's admission of glove ownership and description of its location
        reader_observable: true
      - observation: >-
          Amos Thompson disappeared after the murder and was suspected, but his location was traced
          to a different city and his beard was false.
        correction: >-
          Thompson was innocent of murder but guilty of embezzlement and fled; his beard was part of
          his disguise.
        effect: >-
          Focus shifts from murder to financial crime and imposture; Thompson's absence at the time
          of murder is confirmed.
        required_evidence:
          - >-
            Discovery of Thompson's multiple aliases and false identity, including a beard found
            among his possessions
          - >-
            Photograph of Cecily Hoyle found in Thompson's room, with a timestamp showing he left
            before the murder
        reader_observable: true
      - observation: >-
          Cecily Hoyle heard movement in the office after the estimated time of death, and noticed
          the location of the footsteps and the inner working of the office door.
        correction: The movement was of the murderer impersonating Bechcombe, not the victim himself.
        effect: >-
          Murder time adjusted earlier, and Cecily's testimony implicates the impersonator and the
          use of disguise.
        required_evidence:
          - >-
            Cecily Hoyle's testimony about sounds, timing, and the location of the footsteps in the
            office
          - >-
            Medical examiner's time of death estimate, showing the victim was already dead before
            the movement was heard
        reader_observable: true
      - observation: >-
          Aubrey Todmarsh was a conscientious objector and community leader, but his beard was false
          and he had access to chloroform and rubber gloves; he was seen near the location of the
          murder and had the means to incapacitate the victim.
        correction: >-
          Todmarsh was the murderer using disguise and chloroform to incapacitate the victim, then
          strangling him and impersonating him.
        effect: >-
          Motive and opportunity align with Todmarsh, overturning previous suspicions and revealing
          his working as the Yellow Dog.
        required_evidence:
          - >-
            Mrs. Carnthwacke's identification of distinctive hands and false beard, and her
            statement about the location of the meeting
          - >-
            Hopkins's testimony and arrest record, showing Todmarsh's possession of chloroform,
            rubber gloves, and a false beard
        reader_observable: true
      - observation: >-
          The Yellow Gang is involved in multiple jewel thefts, and their inner working is revealed
          through a police raid on their location; Todmarsh himself is identified as the leader.
        correction: >-
          Todmarsh is the Yellow Dog, the gang leader and murderer, using his position to
          orchestrate crimes.
        effect: >-
          The criminal network is exposed and linked to the murder, and Todmarsh's identity as the
          culprit is confirmed.
        required_evidence:
          - >-
            Police raid on Yellow Gang headquarters, revealing the location and inner working of the
            gang's operations
          - >-
            Inventory of disguises, chloroform, and rubber gloves found at the location, matching
            those used to incapacitate the victim
        reader_observable: true
      - observation: >-
          Inspector Furnival and Steadman were captured by the Yellow Gang, but escaped using a
          secret window and a knife with a note, revealing the working of the gang's hideout and the
          location of Todmarsh himself.
        correction: >-
          They escaped and led police to the gang's location, resulting in Todmarsh's arrest and the
          reveal of the gang's inner workings.
        effect: >-
          Police regain advantage and capture Todmarsh, confirming his guilt and the mechanism of
          the crime.
        required_evidence:
          - >-
            Note slipped under prison door with instructions for escape, describing the location and
            working of the secret window
          - >-
            Escape through barred window, with police patrol arrival after gunshots, and the arrest
            record showing Todmarsh at the location
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      Inspector Furnival and John Steadman infiltrate the Yellow Gang's headquarters disguised in
      yellow dominoes and masks. They are captured and restrained in a bare room with barred
      windows. A secret note with instructions and a knife is slipped under the door, enabling their
      escape through the barred window into the river where police patrols await. This trap tests
      the gang's security and confirms the identity of the Yellow Dog.
    knowledge_revealed: >-
      The test reveals the location and inner workings of the Yellow Gang's hideout and confirms the
      identity of its leader, Aubrey Todmarsh.
    pass_condition: >-
      Successful escape from captivity and subsequent police raid on the gang's headquarters leading
      to Todmarsh's arrest.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed testimonies from witnesses including Mrs. Carnthwacke and Cecily
      Hoyle, descriptions of the murder scene, and the distinctive physical trait of the murderer's
      hands. The false alibis and red herrings such as the missing clerk and Tony Collyer are
      clearly presented. Clues like the photograph in Thompson's room and the glove's fingerprint
      analysis are available for deduction. The final trap and confession confirm the solution,
      which the reader could have inferred by careful attention to timing, physical evidence, and
      character motives.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
