        - Heathermoor Gardens house
        - Stamford hotel rooms
        - Crystal Claw pendant
        - Letters and telegrams
    social:
      trust_channels:
        - Friendship between Rex and Thelma
        - Dr. Feng’s guidance
        - Hartley Humphreys’ false friendship
        - Letters and telegrams
      authority_sources:
