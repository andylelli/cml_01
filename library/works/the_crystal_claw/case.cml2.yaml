        - Dr. Feng’s knowledge of Thu-tseng
        - Hospital doctors
        - Police Prefect at Saumur
  inference_path:
    steps:
      - observation: >-
          Stanley Audley disappeared after receiving a telegram at Mürren, which seemed to reveal a
          threat and orchestrate his absence.
        correction: >-
          The telegram was a false warning to force Audley into hiding, entangling him further in
          the forgery gang's plot.
        effect: >-
          Audley’s disappearance was voluntary and coerced, not a death, and his involvement with
          the gang was confirmed.
        required_evidence:
          - >-
            Telegram received by Stanley Audley at Mürren, which revealed the threat and
            orchestrated his absence
          - >-
            Testimony of hotel staff about Audley’s sudden departure and the involvement of a
            mysterious visitor
        reader_observable: true
      - observation: >-
          A locked room at Lancaster Gate was found empty with signs of burning and forged notes,
          which seemed impregnable but actually posed a staged threat.
        correction: >-
          Audley escaped by unlocking the door with pliers and destroyed evidence, confirming the
          room was not truly impregnable.
        effect: >-
          The locked room was a staged disappearance, orchestrated to hide Audley's involvement and
          threat to the gang.
        required_evidence:
          - >-
            Key left inside locked door at Lancaster Gate, confirming the possibility of escape and
            the room's lack of impregnable security
          - >-
            Burned forged banknotes found in fireplace, revealing the entanglement with the forgery
            gang
        reader_observable: true
      - observation: >-
          Rex Yelverton was found unconscious with a forged suicide note and poison bottle, which
          seemed to confirm his involvement in a suicide but actually posed a threat to his life.
        correction: Rex was drugged and attacked by an unknown assailant, orchestrated by the criminal gang.
        effect: >-
          Attempted murder disguised as suicide, revealing the threat to Rex and confirming the
          gang's involvement.
        required_evidence:
          - Forged suicide note found in hotel room, revealing the orchestration of the attack
          - Medical report of poisoning and drugging, confirming the threat to Rex's life
        reader_observable: true
      - observation: >-
          Thelma Audley disappeared after receiving a telegram and burning it, which seemed to
          confirm her voluntary absence but actually revealed her entanglement in the plot.
        correction: >-
          She was lured away by a message from her husband and taken captive, orchestrated by the
          gang.
        effect: >-
          Her disappearance was forced and part of a murder plot, confirming the threat posed by the
          conspirators.
        required_evidence:
          - Telegram burned in Thelma’s fireplace, revealing the orchestration of her disappearance
          - Witness statement of Thelma’s secret meeting with Dr. Feng, confirming her entanglement
        reader_observable: true
      - observation: >-
          A fire at Heathermoor Gardens trapped Rex and Thelma with a petrol-filled balloon, which
          seemed accidental but was orchestrated as a threat.
        correction: >-
          The fire was an attempted murder by Humphreys to eliminate them, confirming his
          involvement.
        effect: The plot was to kill both and destroy evidence, revealing the orchestration of the threat.
        required_evidence:
          - >-
            Petrol-filled balloon found suspended over candle, confirming the orchestration of the
            fire and the posed threat
          - Police report of forced entry and rescue, revealing the involvement of Humphreys
        reader_observable: true
      - observation: >-
          Stanley Audley died in a motor accident in France with forged notes, which seemed to
          confirm his death and end his involvement.
        correction: >-
          The man who died was the false Audley; the real Audley died later from burns, revealing
          the entanglement and orchestration of identities.
        effect: >-
          The identity of the dead man was initially mistaken, confirming the involvement of the
          forgery gang.
        required_evidence:
          - Police report from Saumur hospital, confirming the mistaken identity and involvement
          - Photographs of dead man and accomplices, revealing the orchestration of the plot
        reader_observable: true
      - observation: >-
          Hartley Humphreys committed suicide when police came to arrest him, which seemed to
          confirm his guilt and reveal the end of the threat.
        correction: >-
          Humphreys was the mastermind behind the forgery and murder plots, orchestrating all events
          and entangling all parties.
        effect: >-
          The criminal conspiracy was ended with his death, confirming the full involvement and
          orchestration of the crimes.
        required_evidence:
          - Police arrest records, confirming the involvement and orchestration by Humphreys
          - >-
            Confiscated documents linking Humphreys to forgery gang, revealing the full extent of
            the threat
        reader_observable: true
  discriminating_test:
    method: constraint_proof
    design: >-
      Reenact the locked room escape by attempting to turn the key from outside with pliers, and
      test the timing of burning the coat and notes to confirm the possibility of escape before door
      forced open. Verify the presence of forged notes and the timeline of disappearance and
      reappearance of Stanley Audley.
    knowledge_revealed: >-
      This test reveals that the locked room was not impregnable and that the disappearance was
      staged. It also confirms the involvement of forged notes and the criminal gang.
    pass_condition: >-
      The key can be turned from outside with pliers and the coat can be burned within the time
      window before the door was forced open.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given all necessary clues: the forged notes, the locked room with the key
      inside, the threatening letters, the secret meetings, and the timeline of events. The false
      identities and the dual role of Stanley Audley are clearly presented. The clues about the
      crystal claw and the Thu-tseng society hint at protection and hidden alliances. The reader
      could deduce the true mechanism by careful attention to the locked room details and the forged
      notes.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
