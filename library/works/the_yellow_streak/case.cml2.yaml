  culpability:
    culprit_count: 1
    culprits:
      - Albert Edward Jeekes
  surface_model:
    narrative:
      summary: >-
        Hartley Parrish is found dead in his locked library with a pistol in hand, apparently a
        suicide. Voices were heard in the library shortly before the shot, and a mysterious letter
        from a Rotterdam firm suggests blackmail. Suspicion falls on Robin Greve, who denies
        visiting Parrish, but the truth is obscured by conflicting testimonies and missing evidence.
    accepted_facts:
      - Hartley Parrish was found dead with a pistol in his hand in a locked library.
      - A shot was heard by Mary Trevert at about 5:15 PM.
      - Bude the butler heard voices in the library shortly before the shot.
      - A letter on slatey-blue paper from Elias van der Spyck & Co. was found on Parrish’s desk.
    inferred_conclusions:
      - Robin Greve visited Parrish and had a heated argument with him.
      - Parrish committed suicide due to business worries and nervous condition.
      - The shot heard was the only shot fired and was self-inflicted.
  hidden_model:
    mechanism:
      description: >-
        Albert Edward Jeekes, acting under orders from Victor Marbran, confronted Hartley Parrish at
        the open library window with a pistol identical to Parrish’s. Parrish fired a silenced shot
        at Jeekes, who returned fire with a loud shot that killed Parrish. Jeekes then staged the
        scene as a suicide by placing Parrish’s pistol without the silencer in his hand and closing
        the window. He escaped through the window, taking care to avoid leaving marks, and later
        confessed before dying by suicide.
      delivery_path:
        - step: Jeekes approaches Parrish at the open library window with a Browning pistol.
        - step: Parrish fires a silenced shot at Jeekes, missing him.
        - step: Jeekes fires a loud shot that kills Parrish instantly.
        - step: Jeekes places Parrish’s pistol without the silencer in Parrish’s hand.
        - step: Jeekes closes the window to simulate a suicide scene.
        - step: Jeekes escapes through the window, avoiding leaving footprints or marks.
        - step: Jeekes later writes a confession and kills himself.
    outcome:
      result: >-
        Jeekes is revealed as the murderer acting under Marbran’s orders and confesses before dying
        by suicide.
  false_assumption:
    statement: The death of Hartley Parrish was a straightforward suicide caused by business worries.
    type: behavioral
    why_it_seems_reasonable: >-
      Parrish was found with a pistol in his hand and medical evidence indicated instantaneous death
      by a gunshot to the heart. The presence of a threatening letter and his nervous condition
      suggested a motive for suicide.
    what_it_hides: >-
      It conceals the fact that Parrish was murdered by Jeekes who used a silenced shot and staged
      the scene to look like suicide, misleading the police and witnesses.
  false_solution:
    accused_suspect: Robin Greve
    supporting_points:
      - Bude testified hearing voices in the library shortly after Greve passed him.
      - Greve had a known rivalry and confrontation with Parrish over Mary Trevert.
      - Greve was unaccounted for during the time of the murder and had opportunity.
      - Greve’s denial of visiting Parrish was contradicted by servants’ testimony.
    the_one_flaw: >-
      Greve had a solid alibi and no physical evidence linked him to the murder; the voices heard
      were misattributed and the real culprit was Jeekes.
    refuted_in_chapter: 28
  red_herrings:
    - id: robin_greve_suspected
      description: >-
        Robin Greve is suspected due to his argument with Parrish and the butler hearing voices
        after he passed.
      points_at_suspect: Robin Greve
      innocent_explanation: >-
        Greve did not enter the library and the voices were from Jeekes and Parrish during the
        murder.
      resolved_in_chapter: 28
    - id: mary_trevert_engagement
      description: >-
        Mary Trevert’s engagement to Parrish and her previous relationship with Greve create
        suspicion and emotional motives.
      points_at_suspect: Mary Trevert and Robin Greve
      innocent_explanation: >-
        Mary was a witness and had no motive or opportunity; Greve was innocent and wrongly
        suspected.
      resolved_in_chapter: 28
  closed_circle:
    suspects:
      - Robin Greve
      - Albert Edward Jeekes
      - Victor Marbran
      - Horace Trevert
      - Bude
      - Mary Trevert
    rationale: >-
      All had access to Harkings and potential motives or opportunity, but investigation and
      evidence narrowed the culprit to Jeekes acting under Marbran’s orders.
  constraint_space:
    time:
      anchors:
        - 5:00 PM tea gong
        - 5:10 PM Greve passes Bude
        - 5:12 PM Bude hears voices
        - 5:15 PM shot heard by Mary Trevert
        - 5:18 PM alarm raised
      windows:
        - Greve’s stroll 5:10-5:13
        - Voices heard 5:12
        - Shot fired 5:15
    access:
      actors:
        - Robin Greve
        - Albert Edward Jeekes
        - Horace Trevert
        - Bude
      objects:
        - library door (locked from inside)
        - library window (open)
        - garden door
        - pistol with and without silencer
    social:
      trust_channels:
        - Bude’s testimony
        - Mary Trevert’s hearing
        - Jeekes’s confession
        - Herr Schulz’s assistance
      authority_sources:
        - Inspector Humphries
        - Detective-Inspector Manderton
        - Dutch police Commissary Boomjes
        - Mr. Bardy solicitor
  inference_path:
    steps:
      - observation: Bude hears voices in the locked library shortly after Greve passes.
        correction: Voices were between Parrish and Jeekes, not Greve.
        effect: Greve’s presence in the library is disproved.
        required_evidence:
          - Bude’s witness statement about hearing voices
          - Horace Trevert’s testimony about entering through the window
        reader_observable: true
      - observation: Only one shot was heard by Mary Trevert.
        correction: Two shots were fired; one silenced, one loud.
        effect: Implies presence of two pistols and a struggle.
        required_evidence:
          - Mary Trevert’s testimony about hearing a hiss before the shot
          - Bullet mark on rosery tree indicating a shot fired from window
        reader_observable: true
      - observation: Parrish’s pistol found without silencer in his hand.
        correction: Silencer was removed by murderer to disguise the loud shot.
        effect: Murder staged as suicide using Parrish’s pistol.
        required_evidence:
          - Jay’s testimony about missing silencer
          - Silencer found in the shrubbery outside the library window
        reader_observable: true
      - observation: Jeekes was in London and then in Rotterdam following Mary.
        correction: Jeekes was spying and acting under Marbran’s orders.
        effect: Jeekes had motive and opportunity to murder Parrish.
        required_evidence:
          - Telegram from Rotterdam police confirming Jeekes’s presence at Villa Bergendal
          - Manderton’s investigation and telegram about pistol purchase
        reader_observable: true
      - observation: Letter from Elias van der Spyck & Co. found on Parrish’s desk.
        correction: Letter was coded blackmail threatening Parrish’s life.
        effect: Provides motive for murder.
        required_evidence:
          - Decoded letter using slotted sheet
          - Dulkinghorn’s expert analysis
        reader_observable: true
      - observation: Jeekes found dead by hanging at Villa Bergendal.
        correction: Jeekes committed suicide after confessing murder.
        effect: Confession confirms murder and clears others.
        required_evidence:
          - Jeekes’s last statement
          - Manderton’s and Dutch police’s discovery of body
        reader_observable: true
      - observation: Marbran fled the country after murder.
        correction: Marbran was the mastermind but escaped justice.
        effect: Only Jeekes was caught and confessed.
        required_evidence:
          - Manderton’s testimony about Marbran’s flight
          - Ticket stubs and passport records showing Marbran’s departure
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Reconstruct the murder scene at Harkings library with the window open and the silencer removed
      from the pistol. Test whether the sounds of two shots, one silenced and one loud, can be heard
      and whether the murderer could have escaped through the window without leaving marks. Confirm
      the presence of two pistols of identical caliber and the timing of voices and shots.
    knowledge_revealed: >-
      This test reveals that two shots were fired, the silenced shot first by Parrish, then the loud
      shot by the murderer, and that the murderer escaped through the open window, staging the scene
      as suicide.
    pass_condition: >-
      The test passes if the timing and acoustic conditions match witness testimonies and physical
      evidence, and if the escape through the window is plausible without leaving footprints or
      marks.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given all essential clues: the locked library door, the open window, the missing
      silencer, the coded letter, the testimony of Bude and Mary Trevert, and the discovery of the
      bullet mark on the rosery tree. The conflicting testimonies and the presence of two pistols
      are highlighted. The confession letter is foreshadowed and the decoding of the letter is
      explained. The reader can deduce the murder disguised as suicide by analyzing the timing of
      the shots and the physical evidence.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
