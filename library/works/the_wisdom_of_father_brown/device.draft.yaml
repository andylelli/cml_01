pattern_id: the_wisdom_of_father_brown
title: The Framed Suicide
family: spatial_routing
axes:
  - identity
principle: >-
  It hides the fact that the victim himself committed suicide in a staged manner to implicate
  Boulnois, who was elsewhere at the time.
principleType: cognitive_bias
surface_illusion_template: >-
  John Boulnois committed the murder out of jealousy.; The dramatic setting and sword indicate a
  crime of passion.; Sir Claude Champion's death was a homicide, not suicide.
underlying_reality_template: >-
  Sir Claude Champion committed suicide by stabbing himself with his own sword in a dramatic and
  symbolic manner to express his jealousy and despair. The sword was thrown to the ground after the
  act, and the scene was staged to implicate John Boulnois. Boulnois was innocent and was at
  Pendragon Park reading quietly at the time.
