pattern_id: the_loudwater_mystery
title: The Hidden Entry
family: timing
axes:
  - behavioral
principle: >-
  It obscures the fact that the real murderer was the culprit, who had a stronger financial motive
  and opportunity, and that Lady the victim and a suspect a suspect were protecting each other.
principleType: cognitive_bias
surface_illusion_template: >-
  Lady the victim and a suspect a suspect murdered Lord the victim out of passion; a suspect a
  suspect committed the murder out of revenge for dismissal; The mysterious woman was the murderer
underlying_reality_template: >-
  the culprit forged a letter from Lord the victim instructing the bank to pay a large sum to a
  suspect a suspect, securing her financial future. To prevent Lord the victim from revoking this
  and exposing the forgery, the culprit murdered him by stabbing him in the heart while he was
  asleep in his smoking-room. the culprit wore gloves to avoid leaving fingerprints and left the
  knife in the wound to avoid bloodstains.
