  culpability:
    culprit_count: 2
    culprits:
      - Dr. Mindrum W.C. Bliss
      - Anûpu Hani
  surface_model:
    narrative:
      summary: >-
        Benjamin H. Kyle was found murdered in the Bliss Museum with a heavy statue nearby and a
        rare scarab pin beside him, implicating Dr. Bliss. The evidence seemed to point to Bliss,
        who was arrested, but inconsistencies and a death trap suggested a more complex plot
        involving other household members.
    accepted_facts:
      - Benjamin H. Kyle was murdered by a blow to the head with a statue of Sakhmet
      - Dr. Bliss’s scarab pin and a financial report were found near the body
      - >-
        Bliss was found with his fingerprints on the statue and had bloody footprints leading to his
        study
      - An opium powder was found in Bliss’s coffee, suggesting he was drugged
    inferred_conclusions:
      - Dr. Bliss was the murderer acting alone
      - The bloody footprints and planted evidence conclusively prove Bliss’s guilt
      - The death trap was intended to kill Kyle and implicate Salveter
  hidden_model:
    mechanism:
      description: >-
        Dr. Bliss murdered Benjamin H. Kyle by striking him from behind with a heavy mace, then
        arranged the scene by placing the statue of Sakhmet as a death trap and planting his own
        scarab pin and financial report near the body to implicate himself. He drugged his coffee
        with opium to create an alibi. Later, Anûpu Hani killed Bliss to end the plot, carefully
        avoiding leaving evidence.
      delivery_path:
        - step: >-
            Bliss arranged an appointment with Kyle and ensured Kyle would come early to inspect new
            artifacts
        - step: Bliss drugged his own coffee with opium to simulate being asleep
        - step: >-
            Bliss killed Kyle by a blow from behind using a mace, then placed the statue of Sakhmet
            to simulate a death trap
        - step: >-
            Bliss planted his scarab pin and financial report near Kyle’s body and made bloody
            footprints with one tennis shoe
        - step: >-
            Bliss attempted to frame Salveter by planting forged letters and hiding the dagger
            sheath in Salveter’s room
        - step: Scarlett discovered the plot and was attacked and hidden in a sarcophagus by Bliss
        - step: >-
            Anûpu Hani, knowing the truth and to protect the innocent, killed Bliss by breaking the
            statue of Anûbis over his head
    outcome:
      result: >-
        Dr. Bliss was the murderer of Benjamin H. Kyle, and Anûpu Hani killed Bliss to end the plot;
        the case was solved by Philo Vance.
  false_assumption:
    statement: Dr. Bliss was the sole murderer and acted without any accomplices or interference.
    type: identity
    why_it_seems_reasonable: >-
      All direct evidence such as fingerprints, footprints, and planted items pointed to Bliss, and
      he was found with incriminating items and attempted escape. The opium in his coffee suggested
      he was drugged and innocent.
    what_it_hides: >-
      It conceals the involvement of Anûpu Hani who ultimately killed Bliss, and the fact that
      Bliss’s evidence was deliberately planted to implicate himself and frame Salveter.
  false_solution:
    accused_suspect: Robert Salveter
    supporting_points:
      - Salveter had a motive due to jealousy and inheritance
      - A forged hieroglyphic letter implicating Salveter was found
      - The dagger sheath was hidden in Salveter’s room
      - Salveter was evasive about his whereabouts during the murder
    the_one_flaw: >-
      The letter and dagger sheath were planted by Bliss to frame Salveter, and Salveter’s alibi was
      corroborated.
    refuted_in_chapter: 21
  red_herrings:
    - id: anupu_hani_superstition
      description: >-
        Hani’s talk of the vengeance of Sakhmet and mystical retribution suggested he might be
        involved in a supernatural killing or be the murderer.
      points_at_suspect: Anûpu Hani
      innocent_explanation: >-
        Hani used superstition as a cover to protect Salveter and Meryt-Amen and to mislead
        investigators.
      resolved_in_chapter: 21
    - id: robert_salveter_letter
      description: >-
        Salveter’s hieroglyphic letter containing ominous words suggested he had a motive and was
        involved in the murder.
      points_at_suspect: Robert Salveter
      innocent_explanation: >-
        The letter was a linguistic exercise and was forged and planted by Bliss to implicate
        Salveter.
      resolved_in_chapter: 21
  closed_circle:
    suspects:
      - Dr. Mindrum W.C. Bliss
      - Robert Salveter
      - Anûpu Hani
      - Meryt-Amen
      - Donald Scarlett
      - Brush
      - Dingle
    rationale: >-
      The suspects are limited to the household and close associates with access to the museum and
      house during the time of the murder; no outside intruders were possible due to locked doors
      and lack of evidence.
  constraint_space:
    time:
      anchors:
        - Friday, July 13; 10 a.m. to 11 a.m.
        - Friday, July 13; 11 a.m. to 12 p.m.
        - Friday, July 13; 12 p.m. to 2 p.m.
        - Saturday, July 14; 10 p.m. to 11 p.m.
      windows:
        - Kyle’s arrival and murder between 10:00 and 10:30 a.m.
        - Salveter’s absence from 9:30 p.m. Saturday to next morning
        - Scarlett’s attack between 8:00 and 8:30 p.m. Saturday
    access:
      actors:
        - Bliss
        - Salveter
        - Scarlett
        - Hani
        - Household servants
      objects:
        - Museum and study rooms
        - Cabinet with new shipment
        - Doctor Bliss’s study desk
        - Breakfast-room and coffee percolator
        - Sarcophagus in museum
    social:
      trust_channels:
        - Household relationships and loyalties
        - Communication via telephone
        - Servants’ reports
      authority_sources:
        - District Attorney Markham
        - Sergeant Heath and Homicide Bureau
        - Philo Vance’s detective insight
  inference_path:
    steps:
      - observation: Scarab pin of Bliss found beside Kyle’s body
        correction: Pin was planted to implicate Bliss
        effect: Bliss’s guilt is not proven by pin alone
        required_evidence:
          - Testimony of Scarlett about pin last seen in Bliss’s study
          - Location of pin on scene inconsistent with natural loss
        reader_observable: true
      - observation: Bliss’s fingerprints on statue of Sakhmet
        correction: Bliss handled statue earlier to straighten it, not to kill
        effect: Fingerprints do not prove murder
        required_evidence:
          - Bliss’s own admission of adjusting statue before bedtime
          - Scarlett’s testimony on Bliss’s habit of orderliness
        reader_observable: true
      - observation: Bloody footprints of tennis shoe leading to Bliss’s study
        correction: Only one tennis shoe found downstairs; other shoe hidden upstairs
        effect: Footprints were staged to mislead
        required_evidence:
          - Discovery of left tennis shoe in Bliss’s bedroom
          - Butler’s testimony on locked front door
        reader_observable: true
      - observation: Opium found in Bliss’s coffee
        correction: Bliss drugged his own coffee to fake alibi
        effect: Bliss was not narcotized, but feigning
        required_evidence:
          - Hani’s admission of opium tin location
          - Chemical analysis of coffee residue
        reader_observable: true
      - observation: Forged hieroglyphic letter implicating Salveter
        correction: Letter was planted by Bliss to frame Salveter
        effect: Salveter’s guilt is doubtful
        required_evidence:
          - Reconstruction of letter from waste-basket fragments
          - Salveter’s testimony about original letter
        reader_observable: true
      - observation: Scarlett found unconscious in sarcophagus
        correction: Bliss attacked Scarlett to prevent exposure
        effect: Scarlett was victim, not culprit
        required_evidence:
          - Medical report on Scarlett’s injury
          - Vance’s discovery of letter in Scarlett’s pocket
        reader_observable: true
      - observation: Bliss’s death by falling statue of Anûbis
        correction: Hani killed Bliss to end the murderous plot
        effect: Bliss’s death was murder by Hani
        required_evidence:
          - Vance’s conversation with Hani about legal impossibility of convicting Bliss
          - Physical evidence of statue’s broken ankles and position over Bliss
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      Vance reconstructed the death trap by placing the statue of Sakhmet precariously balanced on a
      pencil wedge on the cabinet edge with the curtain partially drawn and the loose brass ring
      under the statue’s base. Pulling the curtain caused the statue to topple exactly where Kyle’s
      head had been, demonstrating the plausibility of the staged death trap.
    knowledge_revealed: >-
      The test showed that the statue could fall and kill someone standing in front of the cabinet,
      supporting the theory that the trap was staged after the murder to mislead investigators.
    pass_condition: >-
      The statue must topple and land precisely on the spot corresponding to Kyle’s head position,
      confirming the trap’s feasibility.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the physical evidence, the timing of arrivals and
      departures, and the relationships and motives of the household members. The planted evidence
      and the forged letter are clearly presented, as are the inconsistencies in Bliss’s alibi and
      the presence of opium. The death trap experiment is described in detail, allowing the reader
      to question the obvious conclusions. The final confession and unmasking are foreshadowed,
      making the solution accessible to a careful and attentive reader.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
