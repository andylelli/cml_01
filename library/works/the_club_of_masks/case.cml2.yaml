  culpability:
    culprit_count: 1
    culprits:
      - Madame Bonnell (Leonie Marchand)
  surface_model:
    narrative:
      summary: >-
        Dr. Weathered, a West End physician and founder of the Domino Club, is found dead in a
        masked dance, apparently poisoned. Suspicion falls on several women connected to him,
        including Lady Violet Bredwardine and Sarah Neobard, amid a backdrop of blackmail and secret
        correspondence. The investigation reveals a rare poison and a complex web of motives and
        deceptions.
    accepted_facts:
      - Dr. Weathered was found dead at the Domino Club in a masked costume
      - He was poisoned by a substance causing symptoms unlike common poisons
      - Lady Violet Bredwardine had lent her costume to someone else on the night
      - Madame Bonnell was the proprietress of the Domino Club and had access to the victim
    inferred_conclusions:
      - Lady Violet was the murderer due to her presence at the club
      - Sarah Neobard poisoned Dr. Weathered out of jealousy
      - Dr. Cassilis was guilty of administering the fatal poison
  hidden_model:
    mechanism:
      description: >-
        Madame Bonnell, the proprietress of the Domino Club, murdered Dr. Weathered by poisoning him
        with upasine, a rare and deadly drug stolen from Mrs. Amelia Baker. She used her position to
        administer the poison during the masked dance, exploiting the victim's trust and the club's
        secrecy. She attempted to frame others and cover her tracks but was ultimately exposed by
        the investigation.
      delivery_path:
        - step: Madame Bonnell obtains upasine poison from Mrs. Amelia Baker’s stolen bottle
        - step: She bribes the waiter Gerard to watch Dr. Weathered’s drinks
        - step: During the masked dance, she administers the poison to Dr. Weathered’s coffee
        - step: Dr. Weathered consumes the poison and dies with symptoms of upasine poisoning
        - step: Madame Bonnell fabricates stories to mislead investigators and protect herself
        - step: Investigation uncovers the fake poison bottle and fingerprint evidence
        - step: Madame Bonnell is arrested and confesses to the murder
    outcome:
      result: Madame Bonnell is arrested and convicted for the murder of Dr. Weathered by poisoning.
  false_assumption:
    statement: >-
      Lady Violet Bredwardine was the murderer because she wore the Zenobia costume and was seen
      with Dr. Weathered.
    type: identity
    why_it_seems_reasonable: >-
      Lady Violet’s costume was traced to her and she was known to be a patient of Dr. Weathered,
      with motive suggested by jealousy and blackmail. Witnesses and the accuser Sarah Neobard
      implicated her.
    what_it_hides: >-
      The real murderer was Madame Bonnell who used the costume and impersonation to mislead, and
      Lady Violet had a solid alibi being out of London at the time.
  false_solution:
    accused_suspect: Lady Violet Bredwardine
    supporting_points:
      - Her name appeared in the club’s members list and appointment book
      - She was seen wearing the Zenobia costume at the club
      - Sarah Neobard accused her of poisoning Dr. Weathered
      - She had a motive due to her complicated relationship with Dr. Weathered
    the_one_flaw: She had a confirmed alibi being in Herefordshire at the time of the murder
    refuted_in_chapter: 20
  red_herrings:
    - id: sarah_neobard_accusation
      description: >-
        Sarah Neobard accuses Lady Violet of poisoning Dr. Weathered and claims to have witnessed
        it.
      points_at_suspect: Lady Violet Bredwardine
      innocent_explanation: >-
        Sarah was motivated by jealousy and personal animosity, and her accusations were
        uncorroborated and contradicted by Lady Violet’s alibi.
      resolved_in_chapter: 19
    - id: upasine_poison_bottle_theft
      description: >-
        The disappearance of the upasine poison bottle from Mrs. Amelia Baker’s house suggests a
        theft and implicates multiple suspects.
      points_at_suspect: Mrs. Amelia Baker and Madame Bonnell
      innocent_explanation: >-
        Mrs. Baker was unaware of the theft and Madame Bonnell obtained the poison through other
        means; the real murderer was Madame Bonnell who used the poison.
      resolved_in_chapter: 20
  closed_circle:
    suspects:
      - Madame Bonnell (Leonie Marchand)
      - Sarah Neobard
      - Lady Violet Bredwardine
      - Mrs. Amelia Baker
      - Dr. Cassilis
    rationale: >-
      All had opportunity and motives linked to Dr. Weathered’s death and the Domino Club;
      investigation narrowed to these key figures with no outsiders involved.
  constraint_space:
    time:
      anchors:
        - Night of the masked dance at the Domino Club
        - Discovery of Dr. Weathered’s body around 4:30 am
        - Lady Violet’s departure from London two days before the dance
        - Arrival of Sir Frank Tarleton at the club shortly after 5 am
      windows:
        - Duration of the masked dance
        - Interval between poisoning and death
        - Period of investigation before arrest
    access:
      actors:
        - Madame Bonnell (proprietress)
        - Gerard (waiter)
        - Dr. Cassilis (disguised visitor)
        - Sarah Neobard (step-daughter)
        - Lady Violet Bredwardine (costume owner)
      objects:
        - Upasine poison bottle
        - Dr. Weathered’s coffee cup
        - Domino Club costumes
        - Dr. Weathered’s safe and case-book
    social:
      trust_channels:
        - Madame Bonnell’s control over club records
        - Gerard’s testimony and bribery
        - Dr. Weathered’s patients’ letters
        - Dr. Cassilis’s relationship with Lady Violet
      authority_sources:
        - Sir Frank Tarleton (Home Office medical adviser)
        - Inspector Charles (Scotland Yard)
        - French police in Paris
        - Earl of Ledbury (family authority)
  inference_path:
    steps:
      - observation: Dr. Weathered’s body shows symptoms inconsistent with common poisons
        correction: Presence of a rare poison called upasine known only to few
        effect: Murder by exotic poison suspected
        required_evidence:
          - Autopsy report describing skin parchment-like and rapid death
          - Chemical analysis of upasine sample from Captain Armstrong’s collection
        reader_observable: true
      - observation: Zenobia costume worn by a dancer at the club traced to Lady Violet
        correction: Lady Violet was out of London at the time; costume lent to Dr. Cassilis
        effect: Disproves Lady Violet’s presence at the crime scene
        required_evidence:
          - Train records showing Lady Violet’s departure to Herefordshire
          - Testimony of maid retrieving costume from wardrobe
        reader_observable: true
      - observation: Madame Bonnell claims to have the poison bottle but presents a fake
        correction: Real poison was stolen and replaced with harmless powder
        effect: Madame Bonnell’s involvement in theft and murder suspected
        required_evidence:
          - Chemical analysis of powder in Madame Bonnell’s bottle
          - Gerard’s testimony about warnings and bribery
        reader_observable: true
      - observation: Letters of patients advertised for return by solicitors with false names
        correction: Blackmail scheme by unknown party using letters
        effect: Motive for murder linked to secret correspondence
        required_evidence:
          - Advertisement in newspaper by Messrs. James, Halliday & James
          - Mrs. Neobard’s and Mrs. Weathered’s testimony about letters
        reader_observable: true
      - observation: Mrs. Neobard and Mrs. Weathered flee to Paris
        correction: Police surveillance and French cooperation track them
        effect: Suspects under watch but not necessarily guilty
        required_evidence:
          - French police report of surveillance at Hotel Saint Catherine
          - Communication between Scotland Yard and French police
        reader_observable: true
      - observation: Madame Bonnell’s fingerprint matches a wanted criminal in France
        correction: She is a fugitive and likely the murderer
        effect: Strong evidence for Madame Bonnell’s guilt
        required_evidence:
          - Fingerprint photograph from Scotland Yard
          - French police identification and arrest report
        reader_observable: true
      - observation: Madame Bonnell’s behavior and testimony inconsistent and evasive
        correction: She fabricated stories to mislead investigators
        effect: Reveals her as the true culprit
        required_evidence:
          - Gerard’s testimony about bribery and warnings
          - Discovery of real poison missing from Madame Bonnell’s possession
        reader_observable: true
  discriminating_test:
    method: constraint_proof
    design: >-
      Investigators verify Lady Violet’s alibi by confirming her presence at Tyberton Castle during
      the murder night through train records and servant testimony about the costume’s location.
      Simultaneously, fingerprint comparison and chemical analysis of poison samples are conducted
      to link the real poison to Madame Bonnell. The test eliminates suspects who could not have
      been present or lacked access to the poison.
    knowledge_revealed: >-
      The test confirms Lady Violet’s absence from the crime scene and Madame Bonnell’s possession
      of the rare poison and her fingerprint match with a wanted criminal.
    pass_condition: >-
      Confirmed alibi for Lady Violet and positive fingerprint and poison evidence against Madame
      Bonnell.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is provided with detailed descriptions of the characters, their motives, and the
      timeline of events. Clues such as the rare poison upasine, the costume lending, the missing
      letters, and the fingerprint evidence are all presented before the solution. The false
      accusations against Lady Violet and Sarah Neobard are clearly laid out, allowing attentive
      readers to question their validity and consider alternative suspects. The detective’s
      reasoning is transparent, enabling readers to follow and solve the mystery alongside him.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
