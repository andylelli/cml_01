  culpability:
    culprit_count: 1
    culprits:
      - Ernest Shandon
  surface_model:
    narrative:
      summary: >-
        Two brothers, Neville and Roger Shandon, are found murdered in the complex Whistlefield
        Maze, killed by poisoned air-gun darts. The crime scene shows signs of premeditation with
        loopholes cut in the hedges and darts scattered about. Suspicion falls on various family
        members and associates, with a forged cheque and a burglary adding complexity.
    accepted_facts:
      - Both Neville and Roger Shandon were killed by poisoned air-gun darts in the Maze.
      - The murderer had intimate knowledge of the Maze and used loopholes cut in the hedges.
      - >-
        A burglary occurred at Neville Shandon’s room, searching for documents related to the
        Hackleton case.
      - >-
        Ernest Shandon was attacked later but survived and had a suspicious alibi involving a nail
        in his boot.
    inferred_conclusions:
      - The murders were committed by an outsider hired by Hackleton to stop Neville’s prosecution.
      - The double murder was a case of mistaken identity between the twin brothers.
      - >-
        Arthur Hawkhurst, due to his mental instability and access to air-guns, was the likely
        murderer.
  hidden_model:
    mechanism:
      description: >-
        Ernest Shandon, motivated by greed and to cover up his forgery of Roger’s cheques, used
        poisoned air-gun darts filled with curare to kill his brothers in the Maze. He prepared the
        scene by cutting loopholes in the hedges and staged attacks on himself to divert suspicion.
        After the murders, he fled using a hidden bicycle and eventually committed suicide when
        trapped by police.
      delivery_path:
        - step: Ernest hid a bicycle and air-gun near the East Gate plantation.
        - step: >-
            He entered the Maze via a loophole and shot Roger Shandon from behind, mistaking him
            initially.
        - step: He then shot Neville Shandon from the front, who cried out before dying.
        - step: Ernest fled the Maze, discarded the air-gun in the river, and hid the bicycle.
        - step: He staged an attack on himself to mislead investigators.
        - step: >-
            Police tracked Ernest down, sealed the Maze exits, and used burning sulphur fumes to
            force him out.
        - step: Ernest committed suicide in the Maze when cornered.
    outcome:
      result: >-
        Ernest Shandon is revealed as the murderer and dies by suicide in the Maze when surrounded
        by police.
  false_assumption:
    statement: The murders were committed by an outsider or a lunatic with no clear motive.
    type: identity
    why_it_seems_reasonable: >-
      The complexity of the Maze and the unusual method of murder suggest a stranger or a mentally
      unstable person. The presence of multiple suspects with questionable behavior supports this.
    what_it_hides: >-
      It conceals the fact that the murderer was a family member with intimate knowledge and a
      strong financial motive.
  false_solution:
    accused_suspect: Howard Torrance
    supporting_points:
      - He was in the Maze at the time of the murders.
      - He proposed the game in the Maze to Vera Forrest, giving him an excuse to be there.
      - He had access to the Maze and could have hidden the air-gun beforehand.
      - He was suspected due to the lack of an air-gun found on him.
    the_one_flaw: No motive was established for Torrance, and he was accounted for during later attacks.
    refuted_in_chapter: 18
  red_herrings:
    - id: arthur_hawkhurst_mental_instability
      description: >-
        Arthur Hawkhurst’s history of encephalitis lethargica and erratic behavior suggested he
        might be the murderer.
      points_at_suspect: Arthur Hawkhurst
      innocent_explanation: >-
        Arthur was moody and temperamental but had no motive and was accounted for during the
        attacks.
      resolved_in_chapter: 18
    - id: timothy_costock_blackmailer
      description: Timothy Costock, a known blackmailer with a pistol, was found lurking near the Maze.
      points_at_suspect: Timothy Costock
      innocent_explanation: >-
        Costock was in the area by coincidence and had no air-gun or curare; he was detained but not
        charged.
      resolved_in_chapter: 18
  closed_circle:
    suspects:
      - Ernest Shandon
      - Arthur Hawkhurst
      - Ivor Stenness
      - Howard Torrance
      - Sylvia Hawkhurst
      - Timothy Costock
    rationale: >-
      All suspects were accounted for in terms of presence and opportunity, except Ernest Shandon,
      whose alibi was weak and who had motive and access to the poison and weapon.
