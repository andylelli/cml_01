        - 3:42 pm earliest Roger could enter Maze
        - 3:52 to 4:00 pm murders occurred
    access:
      actors:
        - Ernest Shandon (bicycle, air-gun, Maze)
        - Arthur Hawkhurst (air-guns, Maze)
        - Ivor Stenness (house, safe, documents)
      objects:
        - Pot of curare in museum
        - Air-gun darts and air-guns
        - Safe and cheque-books
    social:
      trust_channels:
        - Stenness trusted with safe key
        - Ernest’s trust in bicycle and air-gun hiding places
      authority_sources:
        - Chief Constable Sir Clinton Driffield
        - Dr. Ardsley (toxicologist)
  inference_path:
    steps:
      - observation: Two brothers killed by poisoned air-gun darts in Maze centers
        correction: One was shot from behind, the other from front or side
        effect: Suggests murderer knew victims and made a mistake with first shot
        required_evidence:
          - Bodies of Roger and Neville Shandon with dart wounds
          - Positions of bodies in Maze centers
        reader_observable: true
      - observation: Box of darts found spilled near Roger’s shooting loophole
        correction: Murderer dropped darts in haste and intended to retrieve them
        effect: Indicates murderer was in a hurry and possibly disturbed
        required_evidence:
          - Tin box lid and darts found at hedge roots
          - Witness statements about sounds in Maze
        reader_observable: true
      - observation: Black silk thread found in Maze after hint about Ariadne’s clue
        correction: Thread was a deliberate false clue planted by murderer
        effect: Suggests murderer tried to mislead investigators to think outsider
        required_evidence:
          - Black thread specimen found tangled in hedge
          - Timing of thread appearance after suggestion
        reader_observable: true
      - observation: Ernest Shandon’s alibi involves nail in boot and being seen on road
        correction: Alibi only covers part of time; bicycle use explains presence in Maze
        effect: Ernest could have been in Maze at murder time despite alibi
        required_evidence:
          - Postman’s statement of seeing Ernest by roadside
          - Location of bicycle and air-gun hidden near East Gate
        reader_observable: true
      - observation: Forged cheque missing counterfoil found among Roger’s papers
        correction: Forgery motive links Ernest to financial gain and need to silence Roger
        effect: Provides strong motive for Ernest to commit murders
        required_evidence:
          - Cheque-book with missing counterfoil
          - Cheque with Roger Shandon's forged signature found in bank records
        reader_observable: true
      - observation: Ernest attacked in Maze but survived, claims attacker unknown
        correction: Attack was staged by Ernest to divert suspicion
        effect: Shows Ernest’s cunning and attempt to mislead investigation
        required_evidence:
          - Ernest’s inconsistent statements
          - No evidence of real attacker
        reader_observable: true
      - observation: Ernest trapped in Maze and refuses to surrender
        correction: Police use burning sulphur fumes to force him out
        effect: Leads to Ernest’s suicide, confirming guilt
        required_evidence:
          - Police reports of Maze siege
          - Ernest’s body found with self-inflicted gunshot
        reader_observable: true
  discriminating_test:
    method: constraint_proof
    design: >-
      Police sealed all Maze entrances after Ernest entered, preventing escape. They spread burning
      sulphur to suffocate him and forced him to surrender or perish. Armed men covered all exits
      and waited for any attempt to flee.
    knowledge_revealed: >-
      This test proved that the murderer was inside the Maze and could not escape, confirming Ernest
      Shandon’s presence and guilt.
    pass_condition: >-
      The suspect cannot leave the Maze without being captured or killed, proving his identity as
      the murderer.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the Maze, the timing of events, the location of
      the bodies, and the discovery of clues such as the black thread and the spilled darts. The
      alibis and motives of all suspects are explored, and the forged cheque is revealed. The final
      solution is logically deduced by elimination and timing, all information being available
      before the confession.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
