    social:
      trust_channels:
        - Studio staff cooperation
        - District attorney Mackay
        - Craig Kennedy's scientific authority
      authority_sources:
        - District Attorney's Office
        - Castleton Institute (scientific expertise)
        - Studio management
  inference_path:
    steps:
      - observation: Tiny scratch on Stella Lamar's arm with faint blood and poison stains on curtains
        correction: The scratch was caused by a needle hidden in the curtains, not a natural cause
        effect: Identifies method of poisoning
        required_evidence:
          - Piece of heavy silk cut from portieres with two microscopic holes and blood stains
          - Microscopic examination of the scratch on Stella's arm
        reader_observable: true
      - observation: Blood spots on towel found in studio washroom with antivenin traces
        correction: The towel was used to wipe a needle after inoculation with antivenin
        effect: Links suspect to needle and poison
        required_evidence:
          - Chemical analysis of towel spots showing antivenin
          - Blood smear matching suspect's blood
        reader_observable: true
      - observation: Werner died suddenly with symptoms of food poisoning
        correction: Werner was poisoned with botulin toxin in his wine glass
        effect: Second murder by poison
        required_evidence:
          - Broken stem of wine glass with toxin residue
          - Film footage of banquet scene showing Werner drinking wine
        reader_observable: true
      - observation: Fire destroyed film negatives in vault
        correction: Fire was incendiary, caused by phosphorus bomb to destroy evidence
        effect: Attempt to cover up murder evidence
        required_evidence:
          - Chemical analysis of fire cause and phosphorus residues
          - Recovered piece of negative film showing snake venom scenes
        reader_observable: true
      - observation: Shirley collapsed during ballroom scene after drinking poison
        correction: Attempted murder with belladonna to simulate suicide
        effect: Third attempt on life linked to murders
        required_evidence:
          - Film footage of Shirley drinking poison
          - Medical treatment with physostigmin antidote
        reader_observable: true
      - observation: Fibers of impregnated towel found on suspect's fingernail files and pocket knives
        correction: Suspect handled the towel impregnated with chemical and itching salve
        effect: Direct evidence linking suspect to towel and crime
        required_evidence:
          - Microscopic examination of fingernail files and knives
          - Chemical analysis of towel fibers
        reader_observable: true
      - observation: Blood samples from suspects show presence of antivenin in one individual
        correction: That individual inoculated himself against snake venom
        effect: Identifies the murderer
        required_evidence:
          - Blood smear analysis showing antivenin presence
          - Matching blood type to blood on portieres
        reader_observable: true
  discriminating_test:
    method: constraint_proof
    design: >-
      Analyze blood samples from all suspects for the presence of antivenin, matching it to the
      individual who handled the poisoned needle and towel. Correlate this scientific evidence with
      fiber traces found on fingernail files and pocket knives to confirm the culprit.
    knowledge_revealed: >-
      The test reveals the identity of the murderer through the presence of antivenin in their blood
      and direct fiber evidence linking them to the crime.
    pass_condition: >-
      Identification of the suspect whose blood contains antivenin and whose personal items have
      fibers matching the impregnated towel.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the crime scenes, the tiny scratch, the presence
      of the needle in the curtains, the chemical analysis of the towel and blood, and the motives
      and opportunities of all suspects. The scientific detective's reasoning is presented clearly,
      allowing the reader to deduce the murderer by connecting the clues about the needle, venom,
      antivenin, and the staged poisonings. The false suspicion of Werner is also clearly shown and
      refuted.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
