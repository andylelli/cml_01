  culpability:
    culprit_count: 1
    culprits:
      - Walter Hornby
  surface_model:
    narrative:
      summary: >-
        Reuben Hornby is accused of stealing diamonds from his uncle's safe, with a bloody
        thumbprint found inside identified as his. The evidence seems overwhelming, and the police
        and prosecution are confident of conviction. However, Thorndyke suspects the thumbprint is a
        forgery and investigates further.
    accepted_facts:
      - Diamonds were stolen from John Hornby's safe which was locked and undisturbed externally.
      - A bloody thumbprint was found on a paper inside the safe, identified as Reuben Hornby's.
      - >-
        The 'Thumbograph' book containing genuine thumbprints of the family was temporarily missing
        and then returned.
      - Walter Hornby recently acquired a typewriter and is skilled in photography and printing.
    inferred_conclusions:
      - Reuben Hornby committed the theft as indicated by the thumbprint evidence.
      - The thumbprint found in the safe was genuine and irrefutable proof of guilt.
      - No one else had access to the safe or the means to forge the thumbprint.
  hidden_model:
    mechanism:
      description: >-
        The crime was committed by forging the thumbprint found in the safe using a stamp made from
        the genuine thumbprint in the 'Thumbograph' book. The forged print was larger and included
        an accidental mark from a loose fibre on the original paper, proving it was a
        photo-mechanical reproduction designed to implicate Reuben falsely. Walter Hornby, skilled
        in photography and printing, had access to the 'Thumbograph' and typewriter, enabling him to
        create the forgery and frame Reuben.
      delivery_path:
        - step: Walter Hornby secretly obtained the 'Thumbograph' book containing genuine thumbprints.
        - step: He made a photographic negative of Reuben's thumbprint from the book.
        - step: >-
            Using chromicized gelatine and photographic techniques, he created a stamp replicating
            the thumbprint.
        - step: >-
            He used defibrinated blood to make a clear forged thumbprint impression on a piece of
            paper.
        - step: The forged paper was placed inside the safe after the diamonds were stolen.
        - step: >-
            The forged thumbprint included an accidental mark from a loose fibre on the original
            paper.
        - step: >-
            The forged print was larger than the genuine print, detectable by microscopic
            measurement.
    outcome:
      result: >-
        Reuben Hornby was acquitted after Thorndyke proved the thumbprint was a forgery implicating
        him falsely.
  false_assumption:
    statement: The thumbprint found in the safe was genuine and conclusively proved Reuben's guilt.
    type: identity
    why_it_seems_reasonable: >-
      Fingerprint experts from Scotland Yard identified the print as Reuben's with absolute
      certainty, supported by the presence of a distinctive scar. The paper was found inside the
      locked safe with no signs of forced entry.
    what_it_hides: >-
      It hides the possibility that the thumbprint was a carefully crafted forgery made using
      photographic and stamping techniques, exploiting the genuine thumbprint from the 'Thumbograph'
      and using defibrinated blood to simulate a fresh print.
  false_solution:
    accused_suspect: Reuben Hornby
    supporting_points:
      - The thumbprint found in the safe matched Reuben's left thumb exactly.
      - No forced entry was detected, implying the thief had a key or access.
      - Reuben had custody of the keys at times and was present at the premises.
      - Police and fingerprint experts testified to the print's authenticity.
    the_one_flaw: >-
      The thumbprint was a photo-mechanical forgery made from the genuine print in the 'Thumbograph'
      book, not a real print made by Reuben.
    refuted_in_chapter: 16
  red_herrings:
    - id: john_hornby_financial_troubles
      description: John Hornby's financial difficulties and possible motive to steal the diamonds.
      points_at_suspect: John Hornby
      innocent_explanation: >-
