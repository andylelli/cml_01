  inference_path:
    steps:
      - observation: >-
          The thumbprint found in the safe was identified as Reuben Hornby's by Scotland Yard
          experts.
        correction: >-
          Thorndyke observed the print was larger than genuine prints and had an accidental mark
          from a loose fibre.
        effect: This suggested the print was a photo-mechanical forgery, not a genuine fingerprint.
        required_evidence:
          - Photograph of the thumbprint with micrometer scale
          - Examination of the 'Thumbograph' book containing genuine thumbprints
        reader_observable: true
      - observation: The blood on the paper was fresh and liquid, producing a clear print.
        correction: >-
          Medical expert Dr. Rowe testified that fresh blood cannot produce such a clear print
          without artificial treatment.
        effect: >-
          The blood was likely defibrinated or chemically treated, indicating artificial preparation
          for forgery.
        required_evidence:
          - Medical testimony on blood clotting and fingerprint clarity
          - Microscopic examination of blood smears on the paper
        reader_observable: true
      - observation: The 'Thumbograph' book had disappeared and reappeared mysteriously.
        correction: >-
          Mrs. Hornby confirmed the book was taken from her writing table and returned during her
          absence.
        effect: Someone had access to the book and could have used it to create the forged print.
        required_evidence:
          - Mrs. Hornby's testimony about the disappearance and return of the 'Thumbograph'
          - Physical custody records of the book
        reader_observable: true
      - observation: Walter Hornby recently purchased a typewriter and is skilled in photography.
        correction: >-
          The typewriter used to type a suspicious label was a rare literary model with a unique
          worn letter 'e' matching Walter's machine.
        effect: Walter had the means and skills to produce the forged fingerprint and tampered documents.
        required_evidence:
          - Typewritten label with unique typewriter characteristics
          - Testimony about Walter's typewriter purchase and photographic skills
        reader_observable: true
      - observation: Fingerprint experts confidently identified the print as genuine.
        correction: >-
          Thorndyke demonstrated that the experts could not distinguish the forged prints from
          genuine ones in a controlled test.
        effect: Fingerprint evidence alone is insufficient and can be fabricated to mislead experts.
        required_evidence:
          - Thorndyke's demonstration with forged and genuine prints
          - Expert witness testimony during trial
        reader_observable: true
      - observation: The forged prints were made with a single stamp, expected to be identical.
        correction: Thorndyke used multiple stamps from different impressions to avoid detection by experts.
        effect: >-
          The forgery was sophisticated enough to evade expert detection by mimicking natural
          variations.
        required_evidence:
          - Thorndyke's multiple stamp preparation
          - Expert witness confusion during trial
        reader_observable: true
      - observation: Walter Hornby was suspected due to his skills and suspicious behavior.
        correction: >-
          Walter's motive and opportunity aligned with the forgery and theft, implicating him as the
          true culprit.
        effect: Walter Hornby was identified as the actual thief and forger, framing Reuben.
        required_evidence:
          - Walter's access to 'Thumbograph' and typewriter
          - Discrepancies in Walter's statements and behavior
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      Thorndyke prepared a sheet with twenty thumbprint squares, ten genuine and ten forged using
      multiple stamps from different impressions. The sheet was presented to fingerprint experts to
      identify genuine versus forged prints without prior knowledge of the distribution.
    knowledge_revealed: >-
      The experts failed to correctly distinguish forged prints from genuine ones, proving that the
      forged prints were indistinguishable and that fingerprint evidence alone is unreliable.
    pass_condition: >-
      Experts must fail to correctly identify all forged prints, demonstrating the possibility of
      undetectable fingerprint forgery.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the 'Thumbograph' book, the fingerprint evidence,
      the photographic and microscopic techniques used, and the suspicious behavior of Walter
      Hornby. The clues about the forgery, the accidental mark on the print, and the typewriter's
      unique characteristics are all presented before the solution. The demonstration of the forgery
      and the experts' failure to detect it is described in court, allowing attentive readers to
      deduce the true mechanism.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
