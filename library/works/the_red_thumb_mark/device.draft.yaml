pattern_id: the_red_thumb_mark
title: The Stamped Print
family: timing
axes:
  - identity
principle: >-
  It hides the possibility that the thumbprint was a carefully crafted forgery made using
  photographic and stamping techniques, exploiting the genuine thumbprint from the 'Thumbograph' and
  using defibrinated blood to simulate a fresh print.
principleType: physical_law
surface_illusion_template: >-
  the victim committed the theft as indicated by the thumbprint evidence.; The thumbprint found in
  the safe was genuine and irrefutable proof of guilt.; No one else had access to the safe or the
  means to forge the thumbprint.
underlying_reality_template: >-
  The crime was committed by forging the thumbprint found in the safe using a stamp made from the
  genuine thumbprint in the 'Thumbograph' book. The forged print was larger and included an
  accidental mark from a loose fibre on the original paper, proving it was a photo-mechanical
  reproduction designed to implicate the victim falsely. a suspect the victim, skilled in
  photography and printing, had access to the 'Thumbograph' and typewriter, enabling him to create
  the forgery and frame the victim.
feasibility:
  eras:
    - 1850
    - 1860
    - 1870
    - 1880
    - 1890
    - 1900
    - 1910
    - 1920
    - 1930
    - 1940
    - 1950
  requires:
    - photographic_reproduction
    - blood_simulation
    - fingerprint_sample
  forbids:
    - automated_fingerprint_search
    - forensic_document_dating
clue_archetypes:
  - photograph_of_the_thumbprint
  - examination_of_the_thumbograph
  - medical_testimony_on_blood
  - microscopic_examination_of_blood
  - mrs_hornby_s_testimony
  - physical_custody_records_of
sources:
