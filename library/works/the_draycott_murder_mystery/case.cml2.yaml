CML_VERSION: 2
CASE:
  meta:
    title: The Draycott murder mystery
    author: Molly Thynne
    license: Public domain (first published 1928; author died 1950). Project Gutenberg ebook 75222.
    era:
      decade: 1920s
      realism_constraints:
        - No forensic DNA or advanced ballistics analysis available
        - Telephones and automobiles exist but are not ubiquitous
        - Travel by train and car is common but slower than modern times
    setting:
      location: North of England, village of Keys and surrounding countryside
      institution: >-
        Local police (Sergeant Brace and Constable Gunnet), legal system with barrister Sir Edward
        Kean
    crime_class:
      category: murder
      subtype: blackmail murder disguised as a frame-up
  cast:
