pattern_id: the_big_bow_mystery
title: The Timed Entry
family: timing
axes:
  - spatial
principle: >-
  It hides the fact that the murder was committed inside the room at the moment the door was broken
  down, with the victim still alive and then killed instantly, and that the lock was tampered with
  to create the illusion of an impossible crime.
principleType: physical_law
surface_illusion_template: >-
  The victim committed suicide despite medical evidence to the contrary; The murderer entered and
  exited the locked room by climbing through a window or chimney; a suspect a suspect was guilty of
  the murder motivated by jealousy and revenge
underlying_reality_template: >-
  the culprit, the retired detective, drugged the victim with sulfonal to induce deep sleep. Then,
  while the victim was asleep, the culprit entered the locked room, cut his throat swiftly and
  silently, and staged the scene to appear as a locked-room mystery. He pocketed the weapon and
  manipulated the lock by removing the bolt staple so the door could be forced open, creating the
  illusion it was locked and bolted from inside.
