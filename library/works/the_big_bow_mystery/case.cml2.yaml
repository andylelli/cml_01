  culpability:
    culprit_count: 1
    culprits:
      - George Grodman
  surface_model:
    narrative:
      summary: >-
        Arthur Constant is found dead in a locked and bolted room with his throat cut, with no
        apparent way for the murderer to enter or exit. Tom Mortlake, a labor leader and friend, is
        arrested based on circumstantial evidence and jealousy motives. The case appears impossible,
        with no weapon found and no clear suspect able to commit the crime.
    accepted_facts:
      - Arthur Constant was found dead with a deep cut across his throat in a locked and bolted room
      - No weapon was found in the room or on the victim
      - Tom Mortlake was arrested and tried for the murder based on circumstantial evidence
      - The door was forcibly broken open by George Grodman who discovered the body
    inferred_conclusions:
      - The victim committed suicide despite medical evidence to the contrary
      - The murderer entered and exited the locked room by climbing through a window or chimney
      - Tom Mortlake was guilty of the murder motivated by jealousy and revenge
  hidden_model:
    mechanism:
      description: >-
        George Grodman, the retired detective, drugged Arthur Constant with sulfonal to induce deep
        sleep. Then, while Constant was asleep, Grodman entered the locked room, cut his throat
        swiftly and silently, and staged the scene to appear as a locked-room mystery. He pocketed
        the weapon and manipulated the lock by removing the bolt staple so the door could be forced
        open, creating the illusion it was locked and bolted from inside.
      delivery_path:
        - step: Grodman gave Arthur Constant a sleeping draught (sulfonal) to ensure deep sleep
        - step: Constant locked and bolted his bedroom door as instructed
        - step: Grodman waited for Mrs. Drabdump to knock and call him
        - step: Grodman broke open the door and found Constant asleep
        - step: He swiftly cut Constant's throat, causing instantaneous death
        - step: Grodman pocketed the razor and covered the face with a handkerchief
        - step: He manipulated the bolt staple to make the door appear locked and bolted from inside
    outcome:
      result: >-
        Tom Mortlake is reprieved after Grodman's confession reveals the true murderer and the
        crime's mechanism.
  false_assumption:
    statement: >-
      The victim's death was either suicide or murder by someone who entered and exited the locked
      room.
    type: spatial
    why_it_seems_reasonable: >-
      The room was found locked and bolted from inside with no apparent access, so the only options
      seemed to be suicide or a miraculous entry and exit by a murderer. The absence of a weapon and
      signs of struggle supported this belief.
    what_it_hides: >-
      It hides the fact that the murder was committed inside the room at the moment the door was
      broken down, with the victim still alive and then killed instantly, and that the lock was
      tampered with to create the illusion of an impossible crime.
  false_solution:
    accused_suspect: Tom Mortlake
    supporting_points:
      - Jealousy motive due to rivalry with Arthur Constant
      - Suspicious movements and failure to attend a meeting
      - Possession of a key to the victim's room
      - Denunciations of Constant shortly before death
    the_one_flaw: >-
      The alibi placing Mortlake at Euston Station at the time of the murder and the impossibility
      of entering and exiting the locked room undetected
    refuted_in_chapter: 12
  red_herrings:
    - id: monkey_chimney_entry
      description: Theory that a monkey climbed down the chimney and committed the murder
      points_at_suspect: an unknown animal or intruder
      innocent_explanation: The chimney was too narrow and no soot or blood traces were found to support this
      resolved_in_chapter: 4
    - id: magnet_lock_manipulation
      description: Theory that powerful magnets were used to lock and bolt the door from outside
      points_at_suspect: an unknown external manipulator
      innocent_explanation: >-
        Physically impossible to operate the lock with magnets as the mechanism could not be turned
        remotely
      resolved_in_chapter: 4
  closed_circle:
    suspects:
      - Tom Mortlake
      - George Grodman
      - Mrs. Drabdump
      - Denzil Cantercot
      - Edward Wimp
      - Peter Crowl
    rationale: >-
      The suspects are limited to the occupants and immediate associates of 11 Glover Street, with
      no evidence of external access or involvement.
  constraint_space:
    time:
      anchors:
        - Half-past six a.m. on December 4th
        - Mrs. Drabdump's attempts to wake Constant at quarter to seven
        - Grodman breaking open the door shortly after
        - Mortlake's presence at Euston Station at 5:25 a.m.
        - Mortlake's departure on the 7:15 a.m. train
      windows:
        - Time of death estimated between 6:00 and 8:00 a.m.
        - Mrs. Drabdump overslept until half-past six
        - Murder occurred shortly after Mrs. Drabdump's knocking
    access:
      actors:
        - George Grodman
        - Mrs. Drabdump
        - Tom Mortlake (latch-key access to street door)
      objects:
        - Locked and bolted bedroom door
        - Street door with latch-key lock
        - Windows bolted and chimney too narrow
    social:
      trust_channels:
        - Mrs. Drabdump's testimony
        - Grodman's observations
        - Medical evidence from Dr. Robinson
        - Witness statements at inquest and trial
      authority_sources:
        - Coroner's inquest
        - Scotland Yard Detective Department
        - Trial court and judge's summing up
  inference_path:
    steps:
      - observation: The door was locked and bolted from inside when Grodman broke it open
        correction: >-
          The bolt staple was torn off beforehand, allowing the door to be forced open while
          appearing bolted
        effect: The locked room was not impregnable; the murderer could have manipulated the lock
        required_evidence:
          - Testimony of Inspector Howlett and Sergeant Runnymede about lock condition
          - Grodman's explanation of the bolt staple being torn off
        reader_observable: true
      - observation: No weapon was found in the room or on the victim
        correction: The murderer pocketed the razor after killing Constant
        effect: Absence of weapon does not imply suicide or supernatural cause
        required_evidence:
          - Search records showing no weapon found in the room or on the body
          - Inventory of Grodman's possessions immediately after the murder
        reader_observable: true
      - observation: Death was recent and instantaneous
        correction: Murder was committed at the moment Grodman broke the door open
        effect: Victim was alive when door was forced and killed immediately thereafter
        required_evidence:
          - Medical testimony of Dr. Robinson on time of death and wound freshness
          - Mrs. Drabdump's statement about hearing nothing unusual before the door was broken
        reader_observable: true
      - observation: Mrs. Drabdump could not wake Constant despite repeated knocking
        correction: Constant was drugged with sulfonal to induce deep sleep
        effect: Victim was incapacitated and unaware of attempts to wake him
        required_evidence:
          - Grodman's testimony about administering sulfonal
          - Mrs. Drabdump's account of knocking and failing to wake Constant
        reader_observable: true
      - observation: Tom Mortlake was arrested based on jealousy and suspicious behavior
        correction: Mortlake had a valid alibi and no physical evidence linked him to the murder
        effect: Suspicion on Mortlake was misplaced and circumstantial
        required_evidence:
          - Testimony of cabman 2,138 about Mortlake's presence at Euston
          - Witnesses confirming Mortlake's departure on 7:15 train
        reader_observable: true
      - observation: Jessie Dymond disappeared before the murder
        correction: Jessie was found alive and her letter explained her departure
        effect: No evidence of her involvement or death; undermines prosecution's motive theory
        required_evidence:
          - Letter from Jessie Dymond to Mortlake
          - Cablegram from Melbourne police about Jessie's arrival
        reader_observable: true
      - observation: The victim's room was sealed with no apparent access
        correction: The murderer exploited the timing of the door breaking and lock manipulation
        effect: The locked room mystery is a constructed illusion
        required_evidence:
          - Physical evidence of lock and bolt condition after the door was forced
          - >-
            Statement from Mrs. Drabdump about the sequence of knocking, calling Grodman, and the
            door being broken
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Reenact the sequence of events on the morning of the murder, including the administration of
      sulfonal, the locking and bolting of the door, the knocking by Mrs. Drabdump, and the breaking
      open of the door by Grodman. Observe the state of the lock and bolt, and the timing of the
      victim's death relative to the door being forced.
    knowledge_revealed: >-
      This reenactment reveals that the victim was alive and drugged when the door was broken open,
      that the bolt staple could be removed to allow forced entry while appearing locked, and that
      the murder was committed at that moment, not earlier or by another means.
    pass_condition: >-
      The reenactment must demonstrate that the door can be forced open with the bolt staple
      removed, that the victim can be drugged to deep sleep, and that the murder can be committed
      inside the locked room without external entry or exit.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given all the physical evidence, witness statements, and detailed descriptions
      of the locked room and its condition. The key to the solution lies in understanding the
      manipulation of the lock and the timing of the murder, which are hinted at through Grodman's
      observations and the inconsistencies in the lock's condition. The presence of sulfonal and the
      possibility of instantaneous murder at the moment of door breaking are also disclosed,
      allowing attentive readers to deduce the true mechanism.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
