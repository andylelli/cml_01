  culpability:
    culprit_count: 1
    culprits:
      - Mr. Ooma
  surface_model:
    narrative:
      summary: >-
        Sir Alan Hume-Frazer is found murdered at Beechcroft Hall, with suspicion falling on his
        cousin David Hume-Frazer, who is tried and acquitted. A complex web of family secrets,
        blackmail, and multiple suspects including an Italian husband and a mysterious Japanese man
        complicate the case.
    accepted_facts:
      - Sir Alan Hume-Frazer was murdered with a Japanese Ko-Katana sword
      - David Hume-Frazer was found asleep in the library at the time of the murder
      - A drawer in Sir Alan's writing desk was forcibly opened and documents stolen
      - A mysterious Japanese man named Ooma was seen near Beechcroft and is linked to the crime
    inferred_conclusions:
      - David Hume-Frazer was the murderer due to opportunity and motive
      - Giovanni Capella killed Sir Alan out of jealousy and financial gain
      - Numagawa Jiro was complicit in the murder as an accomplice
  hidden_model:
    mechanism:
      description: >-
        Mr. Ooma, a Japanese descendant of the original David Hume, committed the murder of Sir Alan
        Hume-Frazer to obtain incriminating family documents that could be used for blackmail. He
        used the Ko-Katana sword to kill Sir Alan after forcing open the drawer to steal the papers.
        Later, Ooma also killed Giovanni Capella to prevent interference. Ooma was ultimately
        confronted and died after injecting himself with snake poison during his arrest.
      delivery_path:
        - step: Ooma arrives at Beechcroft and observes the household
        - step: He forces open the writing-desk drawer to steal documents
        - step: Sir Alan confronts Ooma, who kills him with the Ko-Katana
        - step: Ooma attempts to kill David and Robert Hume-Frazer to cover his tracks
        - step: Ooma kills Giovanni Capella during a train journey
        - step: Ooma is tracked and confronted at Beechcroft by Brett and allies
        - step: Ooma injects himself with snake poison and dies after confession
    outcome:
      result: >-
        Mr. Ooma is identified as the murderer and dies from self-administered poison after being
        captured.
  false_assumption:
    statement: David Hume-Frazer was guilty of murdering his cousin Sir Alan.
    type: identity
    why_it_seems_reasonable: >-
      David was found asleep in the library at the time of the murder and had a known family dispute
      with Sir Alan. Witnesses and circumstantial evidence pointed to him.
    what_it_hides: >-
      The existence of a third man, Ooma, who resembled David and committed the murder while David
      was asleep.
  false_solution:
    accused_suspect: David Hume-Frazer
    supporting_points:
      - David was found asleep in the library at the time of the murder
      - The stolen documents were missing while David was alone in the room
      - Witnesses saw a man resembling David near the crime scene
      - David had a motive related to family disputes and inheritance
    the_one_flaw: David had a solid alibi of being asleep and was unaware of the murder until after it happened
    refuted_in_chapter: 27
  red_herrings:
    - id: giovanni_capella_suspicion
      description: >-
        Giovanni Capella, the Italian husband of Margaret, is suspected due to his hostile behavior
        and possible financial motives.
      points_at_suspect: Giovanni's quarrel with Margaret and his passion for Helen Layton
      innocent_explanation: He was away in Naples at the time of the murder and later killed by Ooma.
      resolved_in_chapter: 30
    - id: numagawa_jiro_involvement
      description: >-
        Numagawa Jiro, a Japanese man, is suspected due to his connection with the Ko-Katana and
        involvement in typewritten letters.
      points_at_suspect: His knowledge of the sword and suspicious behavior with his wife
      innocent_explanation: He was an unwitting tool of Ooma and acted under duress.
      resolved_in_chapter: 28
  closed_circle:
    suspects:
      - David Hume-Frazer
      - Robert Hume-Frazer
      - Margaret Hume-Frazer (Mrs. Capella)
      - Giovanni Capella
      - Numagawa Jiro
      - Mr. Ooma
    rationale: >-
      All key suspects are family members or closely connected persons present in the locality with
      access to the crime scene and motive, forming a closed circle.
  constraint_space:
    time:
      anchors:
        - New Year's Eve night of the murder
        - 1 a.m. to 1:30 a.m. time window of murder and discovery
        - Arrival and departure times of trains at Stowmarket station
      windows:
        - David asleep in library from 1 a.m.
        - Capella traveling to Naples after murder
        - Ooma's movements in London and Beechcroft
    access:
      actors:
        - David Hume-Frazer
        - Robert Hume-Frazer
        - Giovanni Capella
        - Mr. Ooma
        - Numagawa Jiro
      objects:
        - Beechcroft library
        - writing-desk drawer
        - Ko-Katana sword
        - typewriter
    social:
      trust_channels:
        - Servants' testimonies
        - Letters and telegrams
        - Family confidences
      authority_sources:
        - Scotland Yard
        - Local police
        - Coroner's inquest
  inference_path:
    steps:
      - observation: David Hume-Frazer was found asleep in the library at 1 a.m.
        correction: A man resembling David was seen near the house at the same time
        effect: David's alibi is not absolute; a double may exist
        required_evidence:
          - Footman's testimony of David asleep in library
          - Poacher 'Rabbit Jack's' witness statement of a man like David
        reader_observable: true
      - observation: The drawer in Sir Alan's desk was forcibly opened and documents stolen
        correction: The documents were used for blackmail and motive for murder
        effect: Murder was motivated by theft of incriminating papers
        required_evidence:
          - Physical evidence of broken drawer
          - Family documents found with Ooma
        reader_observable: true
      - observation: Giovanni Capella was hostile and had motive
        correction: Capella was in Naples at time of murder and later killed by Ooma
        effect: Capella is innocent of Sir Alan's murder
        required_evidence:
          - Travel records of Capella to Naples
          - Holden's report of Capella's death
        reader_observable: true
      - observation: >-
          Numagawa Jiro had knowledge of the Ko-Katana and wrote letters; he was involved in the
          arrangement and securing of the typewriter used for anonymous letters.
        correction: >-
          Jiro was an unwitting accomplice manipulated by Ooma, who arranged for Jiro to dispose of
          the typewriter and secure the weapon for Ooma's use.
        effect: >-
          Jiro is innocent but involved in the arrangement and securing of key objects used in the
          crime.
        required_evidence:
          - >-
            Jiro's testimony and letters describing the arrangement and disposal of the typewriter
            and the securing of the Ko-Katana for Ooma's possession
          - Receipt for the sale of the typewriter and physical trace of the Ko-Katana's transfer
        reader_observable: true
      - observation: >-
          Ooma resembles the Hume-Frazer family and was seen near Beechcroft; he challenged the
          household by entering the library and was cornered by Brett's team.
        correction: >-
          Ooma is the true murderer using resemblance to confuse witnesses and challenging the
          household by arranging to be present in the library, where he was cornered and secured.
        effect: Ooma is the culprit, revealed by his identity and possession of the murder weapon.
        required_evidence:
          - >-
            Physical resemblance noted by witnesses and arrangement of the confrontation in the
            library
          - >-
            Inventory of Ooma's possessions at the time of being cornered, including the Ko-Katana
            sword and hypodermic syringe
        reader_observable: true
      - observation: >-
          Two attacks on David and Robert Hume-Frazer were made by a man like them; the attacks were
          arranged to challenge their safety and secure Ooma's escape.
        correction: >-
          Ooma attempted to kill them to cover his crime, arranging the attacks as a challenge to
          the investigation and to secure his own position.
        effect: >-
          Ooma is dangerous and must be apprehended; his possession of the weapon and arrangement of
          the attacks are key evidence.
        required_evidence:
          - >-
            Witness statements of attacks describing the arrangement and challenge posed by the
            assailant
          - Injuries and syringe found at the scene, confirming Ooma's possession of the weapon
        reader_observable: true
      - observation: >-
          Ooma injected himself with snake poison during arrest, revealing his identity and intent
          to avoid capture.
        correction: >-
          Ooma intended suicide to avoid capture, revealing his guilt and confirming his possession
          of the murder weapon and poison.
        effect: >-
          Ooma dies before trial but confesses; the challenge of securing him and the arrangement of
          the confrontation are confirmed.
        required_evidence:
          - Hypodermic syringe found at scene, confirming Ooma's possession of the weapon and poison
          - >-
            Doctor's report of cause of death, revealing the identity of the poison and confirming
            the arrangement of Ooma's suicide
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      A controlled confrontation at Beechcroft is arranged where Ooma is cornered in the library.
      The room is secured, and Ooma is challenged to surrender. The presence of the hypodermic
      syringe and the Ko-Katana sword are confirmed. The suspects are observed for reactions and
      attempts to escape or attack.
    knowledge_revealed: >-
      This test reveals Ooma's identity as the murderer through his possession of the murder weapon
      and his violent reaction. It also confirms his intent to kill the cousins and his use of
      poison.
    pass_condition: >-
      The suspect is caught in possession of the murder weapon and cannot escape or resist arrest
      without revealing guilt.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of all key characters, their movements, and the
      timeline of events. Witness statements, physical evidence like the broken drawer and the
      Ko-Katana sword, and the anonymous typewritten letters are presented. The presence of a third
      man resembling the accused is hinted at early, and the significance of the Japanese motto and
      cultural details is explained. Careful attention to alibis and contradictions allows the
      reader to deduce the existence of Ooma as the true culprit.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
