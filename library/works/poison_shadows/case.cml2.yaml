        - Fountain pen
        - Mahogany banister
        - Guest House rooms
        - Auctioned furniture
    social:
      trust_channels:
        - Sibell's trust in Otway
        - Etta's influence over Sibell and Gussie
        - Ashe's role as butler and conspirator
        - Police trust in Charlesworth and Budd
      authority_sources:
        - Scotland Yard CID
        - Paris Sûreté
        - Home Office pathologist
        - Coroner's inquest
  inference_path:
    steps:
      - observation: Several men suffered sudden heart attacks after visiting the Guest House.
        correction: These were not natural or coincidental but caused by a hidden agent.
        effect: Focus shifts to a deliberate cause of death.
        required_evidence:
          - Medical reports of heart attacks with no prior symptoms
          - Witness statements of men visiting the Guest House before illness
        reader_observable: true
      - observation: No woman visiting the house suffered illness.
        correction: The poison or mechanism selectively affected men.
        effect: Suggests a contact or behavioral difference in exposure.
        required_evidence:
          - Records of visitors and their health outcomes
          - Analysis of contact points like furniture and objects
        reader_observable: true
      - observation: A mysterious old man named Bettinson was seen uttering incantations in the house.
        correction: He was the criminal lunatic John Dare using disguises.
        effect: Identifies the suspect and his modus operandi.
        required_evidence:
          - Witness statement of Farmer describing Bettinson's behavior
          - Police identification of Dare as Bettinson
        reader_observable: true
      - observation: A fountain pen and mahogany splinters were found contaminated with poison.
        correction: These were the delivery mechanisms for the secret poison.
        effect: Reveals the method of poisoning.
        required_evidence:
          - Home Office pathologist's analysis of pen and splinters
          - Forensic examination of the banister and pen
        reader_observable: true
      - observation: John Dare had a secret cellar exit to the house.
        correction: He used this to enter and exit undetected at night.
        effect: Explains how the culprit accessed the house despite security.
        required_evidence:
          - Discovery of cellar exit behind wine bins
          - Surveillance and police reports of Dare's movements
        reader_observable: true
      - observation: >-
          Charlesworth and Budd, aided by Sibell's servants, kept a night vigil in the Guest House
          to catch the intruder.
        correction: >-
          The vigil revealed the intruder was John Dare, who was caught contaminating the pen and
          banister while wearing gloves and slippers.
        effect: >-
          The method and identity of the intruder were exposed by the servants' and police's
          vigilance.
        required_evidence:
          - Servants' and police statements describing the vigil and the intruder's actions
          - Physical evidence of gloves, slippers, and green light found during the catch
        reader_observable: true
      - observation: John Dare dies after stabbing himself during arrest.
        correction: His death ends the series of poisonings and reveals the truth.
        effect: Case closure and resolution.
        required_evidence:
          - Police arrest report
          - Autopsy and toxicology reports
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      The police and Sibell's servants keep a night vigil in the Guest House to catch the intruder.
      They observe the green light and the intruder's use of gloves and slippers, and catch him
      contaminating the fountain pen and banister with poison. The test replicates the conditions
      under which the poison is delivered.
    knowledge_revealed: >-
      This reveals the identity of the intruder, his method of poisoning, and the secret cellar exit
      he uses to enter the house.
    pass_condition: The intruder is caught in the act of contaminating objects with poison and cannot escape.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the mysterious green light, the strange
      illnesses, the presence of the old man Bettinson, and the poisoned pen and mahogany splinters.
      The clues about the secret cellar exit and the selective effect on men are present. The social
      conspiracies and suspicious characters are fully described. The reader could deduce the use of
      a secret poison and the identity of the culprit by careful attention to these details.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
