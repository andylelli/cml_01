  inference_path:
    steps:
      - observation: >-
          Medhurst provides detailed reports and photographs of suspects, but the underlying intent
          of his behavior is to mislead by manipulating common facial features in the evidence.
        correction: Medhurst is actually Clay in disguise.
        effect: Reinterpretation of Medhurst's information as self-serving deception.
        required_evidence:
          - >-
            Note from landlord about Medhurst's departure to arrest Madame Picardet, showing the
            underlying plan to mislead
          - >-
            Letter from Colonel Clay explaining his impersonation of Medhurst and how he used common
            facial features to avoid suspicion
        reader_observable: true
      - observation: >-
          Photographs of various disguises are inconsistent and taken from different people, but
          analysis reveals underlying facial features in common among the images.
        correction: >-
          No genuine photographs of Clay in disguise exist; only composite images from Dolly
          Lingfield's kodak.
        effect: Identification relies on composite and texture-revealing photographs.
        required_evidence:
          - >-
            Dolly Lingfield's kodak photographs developed by Bertie Winslow, showing underlying
            facial features
          - >-
            Dr. Beddersley's analysis of photographs using texture differences to reveal common
            features
        reader_observable: true
      - observation: >-
          The real Reverend Richard Brabazon and Count von Lebenstein appear in court, undermining
          the assumption that the facial features in the photographs are unique.
        correction: These are the originals impersonated by Clay; the prisoner is not these men.
        effect: Weakens prosecution's identification evidence.
        required_evidence:
          - >-
            Testimony of Reverend Septimus Porkington in court about the underlying differences in
            facial features
          - >-
            Testimony of Dr. Julius Keppel, the real Count von Lebenstein, confirming the common
            features were imitated
        reader_observable: true
      - observation: >-
          Charles Vandrift admits to shady financial dealings during cross-examination, which
          underlies the jury's doubts about the common narrative.
        correction: His credibility as a witness is undermined.
        effect: Jury doubts the prosecution's case.
        required_evidence:
          - Court transcript of Charles's cross-examination, highlighting underlying inconsistencies
          - Judge's summing up emphasizing Charles's dishonesty and the common suspicion
        reader_observable: true
      - observation: >-
          Cesarine is seen frequently with Paul Finglemore and shows hostility to Medhurst,
          suggesting an underlying connection and common purpose.
        correction: Cesarine is an accomplice to Clay/Finglemore.
        effect: Identifies internal betrayal and complicity.
        required_evidence:
          - >-
            Dudley's testimony about Paul Finglemore's visits to Cesarine, showing underlying
            relationship
          - Arrest of Paul Finglemore with Cesarine present, confirming their common involvement
        reader_observable: true
      - observation: >-
          The dispatch-box disappears and reappears mysteriously, but the underlying mechanism is
          revealed by a note explaining the common trick.
        correction: Mrs. Quackenboss (Madame Picardet) orchestrated the theft and return.
        effect: Confirms her role as accomplice.
        required_evidence:
          - Letter from Colonel Clay explaining the dispatch-box incident and the underlying plan
          - Witness accounts of Mrs. Quackenboss's movements, showing common patterns
        reader_observable: true
      - observation: >-
          The ring with a tiny mirror and the note found in the poker game coat point to the
          underlying method of cheating, a common trick among impostors.
        correction: Identifies the impostor poet as Paul Finglemore (Clay).
        effect: Provides a clue to the real identity behind the poet disguise.
        required_evidence:
          - Note found in the coat pocket describing the underlying trick
          - Description of the ring and its use in cheating, a common impostor feature
        reader_observable: true
  discriminating_test:
    method: constraint_proof
    design: >-
      Dr. Beddersley analyzes photographs taken by Dolly Lingfield using Winslow's texture-revealing
      method to distinguish real human features from artificial disguises. By comparing textures and
      identifying artificial additions like gutta-percha and india-rubber, he reconstructs a
      composite face of the culprit. This test relies on physical photographic evidence and expert
      analysis.
    knowledge_revealed: >-
      The test reveals the underlying true facial features common to all disguises, proving the
      multiple identities belong to one man.
    pass_condition: >-
      The composite reconstruction matches the known natural face of Paul Finglemore, confirming his
      identity as Colonel Clay.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the various disguises and the methods used by
      Colonel Clay, including the use of wigs, makeup, and physical alterations. Photographic
      evidence and witness statements are presented, along with the detective's observations and
      suspicions. The key to the solution lies in recognizing the polymorphic nature of the culprit
      and the significance of the photographs taken by Dolly Lingfield, which reveal the texture
      differences that betray the disguises. The final identification through composite
      reconstruction is foreshadowed by expert testimony, allowing an attentive reader to deduce the
      true identity.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
