pattern_id: an_african_millionaire
title: The Borrowed Face
family: identity
axes:
  - identity
principle: >-
  the culprit is actually Colonel the culprit himself, using the detective role to monitor and
  mislead Sir the victim and his household, preventing his own capture.
principleType: physical_law
surface_illusion_template: >-
  the culprit is a trustworthy detective; The photographs of disguises prove the identity beyond
  doubt; the culprit is innocent and not involved in the crimes
underlying_reality_template: >-
  The crime was perpetrated by the culprit, who used his skill in disguise and impersonation to
  assume various identities, including a seer, clergyman, count, professor, and detective. He
  manipulated social situations, forged documents, and exploited personal relationships to defraud
  Sir the victim of money and valuables. His accomplices, including the culprit and the culprit,
  aided him by providing inside access and facilitating his schemes. The detective the culprit was
  in fact the culprit himself, infiltrating Sir the victim household to monitor and mislead
  investigations. The final capture was achieved by identifying the true identity of the culprit,
  who was the culprit in his natural form.
