pattern_id: the_silent_bullet
title: The Silent Coat
family: behavioral
axes:
  - behavioral
principle: >-
  The use of a silencer and the concealment of the weapon in a coat allowed the shot to be fired
  silently and unseen within the office.
principleType: physical_law
surface_illusion_template: >-
  The murderer fired the shot from outside the office; Mrs. the victim was involved in the murder
  due to her emotional reaction; The shot was fired without any silencer or special device
underlying_reality_template: >-
  the culprit concealed a silenced thirty-two-calibre revolver in Mrs. the victim pongee
  automobile-coat. He fired the shot unseen and unheard within the office, using the coat to deaden
  the flash. The bullet passed through the coat, leaving fabric impressions matching the coat found.
  The silencer prevented noise and smoke, explaining the witnesses' lack of detection.
