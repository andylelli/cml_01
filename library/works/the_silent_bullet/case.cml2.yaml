  inference_path:
    steps:
      - observation: A thirty-two-calibre bullet was found in the victim's neck with fabric impressions.
        correction: The bullet must have passed through a fabric matching the impressions.
        effect: Identifies the coat as the fabric through which the bullet was fired.
        required_evidence:
          - Thirty-two-calibre bullet with fabric impressions recovered from Kerr Parker's neck
          - Pongee silk from Mrs. Parker's automobile-coat with a bullet hole
        reader_observable: true
      - observation: No noise or smoke was reported by witnesses during the shooting.
        correction: A silencer was used to muffle the gunshot and prevent smoke.
        effect: Explains the silent nature of the shooting despite many witnesses.
        required_evidence:
          - Purchase records of silencer for thirty-two-calibre revolver by James Bruce
          - Demonstration of silenced revolver firing in laboratory
        reader_observable: true
      - observation: Mrs. Parker showed great emotion during the demonstration of the coat and bullet.
        correction: Emotional reaction due to grief, not guilt.
        effect: Removes suspicion from Mrs. Parker as the shooter.
        required_evidence:
          - Emotional response curves recorded during the demonstration
          - Witness testimony of Mrs. Parker's behavior after the murder
        reader_observable: true
      - observation: James Bruce was agitated during the demonstration and had access to the coat.
        correction: His agitation indicates guilt and opportunity.
        effect: Focuses suspicion on James Bruce as the murderer.
        required_evidence:
          - Emotional response curves showing agitation of James Bruce
          - Tracing of messenger calls leading to Bruce's apartment
        reader_observable: true
      - observation: No weapon was found at the scene.
        correction: The weapon was concealed and removed after the shooting.
        effect: Explains absence of weapon and supports theory of concealed silenced revolver.
        required_evidence:
          - Absence of revolver at the office
          - Purchase and tracing of silencer and revolver by police
        reader_observable: true
      - observation: A wet, pulp-like mass of paper was found in the wastebasket.
        correction: It was the remains of the note read by the victim.
        effect: Links the note to the murder context and suspects.
        required_evidence:
          - Microphotographs of fibers in the wet paper matching suspect's notepaper
          - Witness testimony about the note's existence and timing
        reader_observable: true
      - observation: The bullet hole in the coat was scorched and burned.
        correction: The bullet was fired through the coat, causing the hole.
        effect: Confirms the coat was used to conceal the weapon during shooting.
        required_evidence:
          - Physical examination of the coat showing bullet hole and scorch marks
          - Laboratory demonstration firing bullet through pongee coat
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Kennedy fired a thirty-two-calibre revolver through a piece of pongee silk matching the
      victim's coat, using a silencer device to demonstrate the absence of noise and smoke. The
      bullet was then compared microscopically to the bullet recovered from the victim's neck to
      confirm matching fabric impressions.
    knowledge_revealed: >-
      This test revealed that the shot was fired silently through the coat, explaining the
      witnesses' failure to hear or see the weapon, and linking the bullet to the coat belonging to
      Mrs. Parker.
    pass_condition: >-
      The bullet fired through the silenced revolver and pongee coat must bear identical fabric
      impressions to the bullet recovered from the victim.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the bullet with fabric impressions, the silencer
      device, the coat with the bullet hole, and the tracing of messenger calls. The emotional
      reactions of suspects and the laboratory demonstrations provide concrete clues. The presence
      of a silenced revolver and its concealment in the coat are explicitly shown, allowing an
      attentive reader to deduce the murderer's identity.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
