  inference_path:
    steps:
      - observation: No secret passage found in house despite thorough search
        correction: Secret passage is a natural tunnel through cave and well outside house structure
        effect: Explains how intruder entered and exited undetected
        required_evidence:
          - Old contractor’s plans of the house
          - Carpenters’ demolition and search reports
        reader_observable: true
      - observation: Green stain on Martha’s hand and on Zizi’s frock
        correction: Stain matches mossy stones in the well and tunnel
        effect: Links Martha’s murder and intruder’s use of secret passage
        required_evidence:
          - Green smear on Martha’s left palm
          - Green stain on Zizi’s frock after cellar exploration
        reader_observable: true
      - observation: Yellow satin pillow found in kitchen floor
        correction: Pillow dropped during struggle when Betty was abducted
        effect: Confirms Betty was carried through kitchen and cellar
        required_evidence:
          - Yellow pillow embroidery and hairpin found
          - Witness testimony about pillow’s usual location
        reader_observable: true
      - observation: String of yellow beads broken and scattered in kitchen
        correction: Beads broke during Betty’s abduction struggle
        effect: Physical evidence of struggle and abduction route
        required_evidence:
          - Yellow beads found under furniture in kitchen
          - Testimony of servants and investigators
        reader_observable: true
      - observation: Lawrence North’s room shows signs of struggle but no forced exit
        correction: North staged his own disappearance to mislead investigators
        effect: North is suspect, not victim
        required_evidence:
          - Overturned chair and scratches in North’s room
          - 'Note left by North: ''They’ve got me. L. N.'''
        reader_observable: true
      - observation: Ransom letters and telegrams received by Minna Varian
        correction: Letters are from Lawrence North, the kidnapper and blackmailer
        effect: Identifies the criminal and motive
        required_evidence:
          - Typed ransom letters signed 'Step'
          - Blackmail letter signed 'Step'
        reader_observable: true
      - observation: Discovery of secret tunnel connecting well and cave to ocean
        correction: Tunnel used by criminal for secret ingress and egress
        effect: Explains how intruder avoided detection
        required_evidence:
          - Pennington Wise’s exploration and clearance of tunnel
          - Carpenters’ report on no secret passage in house
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      Pennington Wise sets a shotgun trap triggered by the opening of the cellar door in the
      kitchen, the known exit point of the secret passage. The trap is concealed and tested to
      ensure it fires only when the door is opened, allowing the capture of the intruder without
      alerting others prematurely.
    knowledge_revealed: >-
      The trap confirms the intruder’s use of the secret passage and identifies Lawrence North as
      the criminal when he triggers the trap and is wounded.
    pass_condition: >-
      The trap is triggered by the opening of the cellar door, firing the shotgun and incapacitating
      the intruder.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is provided with detailed descriptions of the house layout, the discovery of the
      yellow pillow and beads, the green stain clues, and the existence of the secret tunnel through
      the cave and well. The suspicious behavior and disappearance of Lawrence North are documented,
      as well as the ransom letters and blackmail notes signed 'Step'. The detective’s reasoning and
      the trap setup are explained, allowing an attentive reader to deduce the use of the secret
      passage and the identity of the culprit.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
