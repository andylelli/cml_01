  culpability:
    culprit_count: 2
    culprits:
      - Mrs. Sylvie Walsingham (Mrs. Werrick)
      - John Carsdale
  surface_model:
    narrative:
      summary: >-
        A wealthy young heir, Richard Shrewsbury, is deceived by his financial agent Carsdale and
        Mrs. Walsingham, who steal a valuable diamond necklace by substituting a paste duplicate.
        The real necklace is pawned, and suspicions arise when the explorer Burgoyne discovers the
        fraud. The situation escalates to murder when Sydney Werrick, Mrs. Walsingham's legal
        husband, is shot dead, and she flees disguised as a nun.
    accepted_facts:
      - Richard Shrewsbury inherited a large fortune and entrusted it to Carsdale.
      - A diamond necklace was pawned and a paste duplicate was given to Burgoyne.
      - Sydney Werrick was found shot dead in Mrs. Walsingham's flat.
      - Mrs. Walsingham fled the scene disguised as a nun and later hid in Shrewsbury's flat.
    inferred_conclusions:
      - Carsdale killed Sydney Werrick to cover up the theft.
      - Mrs. Walsingham acted alone in the necklace substitution and murder.
      - Richard Shrewsbury was complicit in the theft and deception.
  hidden_model:
    mechanism:
      description: >-
        Mrs. Walsingham stole the genuine diamond necklace from Barclay Leverton’s safe and
        substituted a perfect paste duplicate. She pawned the real necklace to secure a loan. She
        and Carsdale conspired to defraud Richard Shrewsbury by controlling his investments and
        deceiving him about the necklace. Sydney Werrick was shot by Mrs. Walsingham in self-defense
        during a confrontation, after which she fled disguised. William Kedgin, Shrewsbury’s valet,
        aided her escape and stole valuables from Shrewsbury’s flat before killing Mrs. Walsingham
        to cover his tracks.
      delivery_path:
        - step: Mrs. Walsingham accesses Leverton’s private safe and steals the real necklace.
        - step: She commissions a perfect paste duplicate and places it in the safe.
        - step: The real necklace is pawned to Mr. Wiertz for a loan.
        - step: Mrs. Walsingham and Carsdale manipulate Richard Shrewsbury’s finances and social life.
        - step: Sydney Werrick confronts Mrs. Walsingham and is shot by her in self-defense.
        - step: Mrs. Walsingham flees disguised as a nun and hides in Shrewsbury’s flat.
        - step: William Kedgin assists her escape, steals valuables, and murders Mrs. Walsingham.
    outcome:
      result: >-
        The theft and fraud are uncovered, Mrs. Walsingham is killed by Kedgin, who is then pursued,
        and Carsdale is arrested but later released; Shrewsbury recovers his fortune with the help
        of Burgoyne and Frances Leverton.
  false_assumption:
    statement: John Carsdale killed Sydney Werrick during a confrontation at Mrs. Walsingham’s flat.
    type: identity
    why_it_seems_reasonable: >-
      Sophie Guyner, the maid, accuses Carsdale of shooting Werrick, and he is found standing over
      the body with a revolver. The police initially detain Carsdale based on this testimony and the
      suspicious circumstances.
    what_it_hides: >-
      The actual shooter was Mrs. Walsingham acting in self-defense, and Carsdale arrived after the
      shooting. The maid’s accusation is driven by fear and confusion, and the revolver had been
      discharged earlier.
  false_solution:
    accused_suspect: Captain Ralph Burgoyne
    supporting_points:
      - He was present at key moments and had access to the necklace.
      - He was the first to raise suspicions about the necklace's authenticity.
      - He had a close relationship with Frances Leverton, who was investigating the fraud.
      - He was seen near the scene of the murder and was questioned by police.
    the_one_flaw: >-
      Burgoyne's actions were motivated by investigation, not concealment, and he had no opportunity
      to commit the theft or murder.
    refuted_in_chapter: 32
  red_herrings:
    - id: sandy_kinahan_death
      description: >-
        Sandy Kinahan was reported dead in Nevada, which was used to mislead Mrs. Walsingham and
        Carsdale.
      points_at_suspect: Mrs. Walsingham and Carsdale, as they believed the threat was gone.
      innocent_explanation: >-
        Kinahan was alive and returned to London, complicating the situation but not directly
        involved in the theft or murder.
      resolved_in_chapter: 22
    - id: frances_leverton_suspicion
      description: >-
        Frances Leverton’s stern attitude and investigation suggested she might be involved in the
        theft or fraud.
      points_at_suspect: John Carsdale and Mrs. Walsingham, as Frances was hostile to them and had motive.
      innocent_explanation: >-
        Frances was acting to protect her father’s estate and uncover the truth, not to commit any
        crime.
      resolved_in_chapter: 38
  closed_circle:
    suspects:
      - John Carsdale
      - Mrs. Sylvie Walsingham (Mrs. Werrick)
      - William Kedgin
    rationale: >-
      Only these three had access to the safe, opportunity to manipulate Shrewsbury’s fortune, and
      motive to commit theft and related crimes. Others were either innocent or lacked opportunity.
  constraint_space:
    time:
      anchors:
        - Leverton’s death morning
        - Evening of Sydney Werrick’s murder
        - Richard Shrewsbury’s trip to Paris
      windows:
        - Mrs. Walsingham’s presence in flat before and after murder
        - Carsdale’s office hours and outings
        - Kedgin’s presence at Shrewsbury’s flat
    access:
      actors:
        - Mrs. Walsingham
        - John Carsdale
        - William Kedgin
        - Frances Leverton
        - Mr. Septimus Winch
      objects:
        - Leverton’s private safe
        - Pawnshop
        - Shrewsbury’s flat
        - Marengo Mansions flat
        - Jewelry cases
    social:
      trust_channels:
        - Richard’s trust in Carsdale
        - Mrs. Walsingham’s influence over Richard
        - Frances Leverton’s legal authority
        - Captain Burgoyne’s friendship
      authority_sources:
        - Mr. Septimus Winch (solicitor and executor)
        - Inspector Skarratt (police)
        - Frances Leverton (estate representative)
  inference_path:
    steps:
      - observation: Burgoyne’s necklace was valued as paste by jeweller Levanter.
        correction: The necklace given to Burgoyne was a perfect paste duplicate.
        effect: Suspected theft and substitution of the real necklace.
        required_evidence:
          - Mr. Levanter’s valuation report of the necklace
          - Captain Burgoyne’s testimony of the necklace’s authenticity
        reader_observable: true
      - observation: Mrs. Walsingham pawned a diamond necklace for a small loan.
        correction: The pawned necklace was the real one stolen from Leverton’s safe.
        effect: Mrs. Walsingham is implicated in the theft.
        required_evidence:
          - Pawnshop records of the necklace
          - Mrs. Walsingham’s admission of possession
        reader_observable: true
      - observation: Sydney Werrick was found shot dead in Mrs. Walsingham’s flat.
        correction: Mrs. Walsingham shot Werrick in self-defense during a confrontation.
        effect: Murder was not premeditated by Carsdale or others.
        required_evidence:
          - Police surgeon’s report on time of death
          - Carsdale’s testimony of arrival after shooting
        reader_observable: true
      - observation: Mrs. Walsingham fled disguised as a nun and hid in Shrewsbury’s flat.
        correction: She attempted to escape detection but was aided by Kedgin.
        effect: Kedgin’s involvement in aiding escape and theft is suspected.
        required_evidence:
          - Witness reports of nun disguise
          - Inventory of missing items from Shrewsbury's flat
        reader_observable: true
      - observation: Valuables and jewelry disappeared from Shrewsbury’s flat.
        correction: Kedgin stole valuables to finance escape and cover tracks.
        effect: Kedgin is a secondary culprit and murderer of Mrs. Walsingham.
        required_evidence:
          - Inventory of missing items
          - Discovery of Mrs. Walsingham’s body in empty house
        reader_observable: true
      - observation: Carsdale possessed securities and tickets for flight.
        correction: Carsdale planned to flee with Mrs. Walsingham but was detained.
        effect: Carsdale’s fraud and flight plans are confirmed.
        required_evidence:
          - Bank records of securities withdrawal
          - Tickets for Southampton steamer found on Carsdale
        reader_observable: true
      - observation: Frances Leverton holds proof of Carsdale’s fraud.
        correction: Legal pressure from Winch and Leverton’s estate forces Carsdale’s surrender.
        effect: Carsdale loses control over Shrewsbury’s fortune.
        required_evidence:
          - Legal documents proving fraud
          - Mr. Winch’s confrontation with Carsdale
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      A private supper-party is arranged where Mrs. Walsingham is persuaded to wear the real diamond
      necklace while Burgoyne and Blair observe. Blair, an expert in precious stones, examines the
      necklace to confirm its authenticity. The necklace is then secretly swapped with the paste
      duplicate held by Mrs. Walsingham, exposing her possession of the real necklace.
    knowledge_revealed: >-
      This test reveals that Mrs. Walsingham possesses the genuine necklace, confirming her guilt in
      the theft and substitution.
    pass_condition: >-
      Mrs. Walsingham is found wearing the real necklace during the supper, which is then swapped
      with the fake, proving her possession of the stolen item.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given access to all key facts: the letter from Shrewsbury, the pawnshop
      transactions, the jeweller’s valuation, the testimonies of Burgoyne and Frances Leverton, and
      the movements of Carsdale and Mrs. Walsingham. The substitution of the necklace and the
      financial manipulations are clearly described. The murder and escape are witnessed and
      reported. The reader can deduce the involvement of Mrs. Walsingham and Carsdale by connecting
      these clues. The false accusation against Carsdale is presented and later refuted, guiding the
      reader to the true solution.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
