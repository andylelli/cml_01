CASE:
  meta:
    title: "The Case of Oscar Brodski"
    author: "R. Austin Freeman"
    license: "Public domain (first published 1912 in The Singing Bone; author died 1943). Project Gutenberg ebook 59478."
    era:
      decade: "1900s"
      realism_constraints:
        - "Medico-legal science exists but is not routinely available to county police; a divisional surgeon, not a laboratory"
        - "A portable microscope, reagents and a spirit lamp are the whole of the forensic apparatus, carried by hand"
        - "Goods trains run to timetable past unfenced waste land; a body on the line reads as accident or suicide"
        - "Diamonds are carried on the person to Amsterdam by merchants travelling alone on the boat train"
    setting:
      location: "An isolated cottage on an unmade road three hundred yards from a railway curve, near Badsham Junction"
      institution: "A county police inquiry into a death on the railway line"
    crime_class:
