      existing 14-value enum, against 2 that were not (the_invisible_man, a_jury_of_her_peers).
  - id: axis_is_arguable
    severity: note
    detail: >
      Encoded `spatial`: the whole solution is the relocation of the scene of death from the railway
      to a carpeted room three hundred yards away, and every clue chain (boot soles, fibres, glass)
      serves that relocation. A `temporal` reading exists — the blood-direction argument is about the
      ORDER of wound and decapitation — but the temporal reasoning is the instrument, not the deception.
