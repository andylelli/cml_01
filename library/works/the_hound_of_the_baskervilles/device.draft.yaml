pattern_id: the_hound_of_the_baskervilles
title: The Phosphor Hound
family: behavioral
axes:
  - behavioral
principle: >-
  The hound is a real dog trained and artificially enhanced by the culprit to frighten victims,
  masking a human murderer's actions.
principleType: cognitive_bias
surface_illusion_template: >-
  The hound is a supernatural creature causing deaths; a suspect and his wife are involved in the
  murders; The escaped convict a bystander is the murderer
underlying_reality_template: >-
  the culprit, the true heir to the the victim estate, trained a large black hound and coated it
  with phosphorus to appear supernatural. He used the hound to frighten Sir Charles to death and
  later to attack Sir the victim. the culprit manipulated others and used disguises to conceal his
  identity and motives.
