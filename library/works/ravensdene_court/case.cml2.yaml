  culpability:
    culprit_count: 2
    culprits:
      - Netherfield Baxter
      - Frenchman (Vicomte)
  surface_model:
    narrative:
      summary: >-
        Two brothers, Salter and Noah Quick, are found murdered hundreds of miles apart, each
        carrying money and valuables untouched but having been searched. A mysterious tobacco-box
        with cryptic scratches and a blood-stained handkerchief are key clues. The investigation
        uncovers a stolen monastic treasure hidden on the Northumbrian coast and a gang including
        Netherfield Baxter, a Frenchman, and Chinese accomplices seeking to recover it.
    accepted_facts:
      - Salter and Noah Quick were murdered on the same night at distant locations
      - Both men carried money and valuables that were not stolen
      - A tobacco-box with cryptic scratches was found on Salter Quick
      - Netherfield Baxter and accomplices bought a yacht and sought the treasure
    inferred_conclusions:
      - The murders were committed by the same individual
      - The tobacco-box scratches directly reveal the treasure's exact location
      - The murderer was not among the known conspirators
  hidden_model:
    mechanism:
      description: >-
        The murders were committed by members of a criminal gang seeking stolen monastic treasure
        hidden near the graves of the de Knaythevilles on the Northumbrian coast. The Quicks were
        killed because they possessed rubies and pearls from the treasure. The gang included
        Netherfield Baxter, a Frenchman, and Chinese accomplices. Internal betrayal among the
        Chinese crew led to a deadly fight aboard their yacht, resulting in multiple deaths and the
        escape of Wing, who helped the captives.
      delivery_path:
        - step: >-
            Netherfield Baxter and accomplices steal monastic treasure and hide it near de
            Knaytheville graves
        - step: Noah and Salter Quick come into possession of rubies and pearls from the treasure
        - step: The gang tracks and murders the Quicks to obtain the jewels
        - step: >-
            Mr. Cazalette discovers clues including the tobacco-box scratches and blood-stained
            handkerchief
        - step: The gang steals the tobacco-box and pocket-book to conceal evidence
        - step: Wing infiltrates the gang to protect captives and gather intelligence
        - step: A mutiny among the Chinese crew leads to a deadly fight and the destruction of the yacht
    outcome:
      result: >-
        The gang is destroyed in a fight aboard their yacht, the treasure is recovered, and the
        surviving conspirator Wing is found wounded but alive.
  false_assumption:
    statement: >-
      The murders were committed by a single unknown man who followed Salter Quick to the
      Northumbrian coast.
    type: identity
    why_it_seems_reasonable: >-
      The simultaneous murders and the presence of two sets of footprints at Salter Quick's murder
      scene suggest a single assailant. The initial suspicion falls on a mysterious man seen asking
      about Netherfield graves.
    what_it_hides: >-
      It obscures the fact that multiple conspirators from a gang were involved, and that the
      murders were coordinated but carried out by different individuals with different motives.
  false_solution:
    accused_suspect: The man who met Salter Quick at the inn (James Beeman's stranger)
    supporting_points:
      - He was seen asking about Netherfield graves near the time of the murder
      - He was a stranger to the area and seemed suspicious
      - The footprints suggested a light-footed person, possibly a woman or this man
    the_one_flaw: He was not seen again and had no motive or opportunity to commit the murders
    refuted_in_chapter: 11
  red_herrings:
    - id: woman_as_murderer
      description: >-
        Locals believed the light footprints at Salter Quick's murder scene were made by a woman,
        suggesting a female murderer.
      points_at_suspect: A woman with light footsteps
      innocent_explanation: >-
        The light footprints were actually made by one of the male conspirators wearing light-soled
        boots.
      resolved_in_chapter: 7
    - id: mr_cazalette_suspicion
      description: >-
        Mr. Cazalette's secretive behavior with the blood-stained handkerchief and tobacco-box led
        to suspicion he might be involved.
      points_at_suspect: Mr. Cazalette's odd actions and possession of clues
      innocent_explanation: >-
        He was investigating the case out of curiosity and lost his pocket-book to thieves; he was
        not involved in the murders.
      resolved_in_chapter: 9
  closed_circle:
    suspects:
      - Netherfield Baxter
      - Frenchman (Vicomte)
      - Lo Chuh Fen
      - Wing
    rationale: >-
      The suspects are limited to the known conspirators who bought the yacht, had access to the
      treasure, and were present at the crime scenes; no other plausible suspects appear.
  constraint_space:
    time:
      anchors:
        - March 8, 1912 - Leonard Middlebrook arrives at Ravensdene Court
        - March 9, 1912 - Salter Quick murdered
        - March 10, 1912 - Noah Quick murdered
        - April 23, 1912 - Scarterfield writes from Blyth
      windows:
        - Night of March 9-10 for Salter Quick's murder
        - Night of March 9-10 for Noah Quick's murder
        - Three weeks before arrival at Hull for yacht purchase
    access:
      actors:
