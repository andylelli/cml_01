        - Police inspector and detective Scarterfield
        - Dr. Lorrimore and his servant Wing
      authority_sources:
        - Local police
        - Devonport police
        - Detective Scarterfield
        - Coroner's inquest
  inference_path:
    steps:
      - observation: Salter Quick was murdered but his money and valuables were untouched.
        correction: The motive was not robbery but possession of a secret or treasure.
        effect: Focus shifts to secret or hidden valuables as motive.
        required_evidence:
          - Police report on Salter Quick's body showing money and valuables present
          - Inspection of Salter Quick's clothing showing pockets turned out
        reader_observable: true
      - observation: Tobacco-box lid had cryptic scratches.
        correction: The scratches represent a map or plan related to the treasure.
        effect: Leads to investigation of monastic treasure and its location.
        required_evidence:
          - Photograph of tobacco-box lid with scratches
          - Mr. Cazalette's notes and enlargements of the photograph
        reader_observable: true
      - observation: No Netherfield graves exist near Ravensdene Court.
        correction: The name Netherfield was confused with de Knaythville, the actual ancestral name.
        effect: Search focuses on ruins and graves of de Knaythville family.
        required_evidence:
          - Local parish records and history books
          - Inscription on tombstone of Humphrey de Knaythville
        reader_observable: true
      - observation: Two men, Baxter and Frenchman, bought a yacht and sailed north.
        correction: They intended to recover the hidden treasure near Ravensdene Court.
        effect: Yacht and crew become suspects and focus of police search.
        required_evidence:
          - Ship broker Jallanby's testimony about yacht purchase
          - Yacht Blanchflower found at Northumbrian coast
        reader_observable: true
      - observation: A fight and multiple deaths occurred aboard the yacht.
        correction: Internal betrayal among conspirators led to deadly mutiny.
        effect: Identifies multiple culprits and explains deaths aboard yacht.
        required_evidence:
          - Eyewitness accounts of fight and deaths on yacht
          - Bodies found aboard yacht including Baxter and Chinese crew
        reader_observable: true
      - observation: Wing, Dr. Lorrimore's servant, was missing from the yacht.
        correction: Wing escaped wounded and sought help, acting against conspirators.
        effect: Wing is revealed as a double agent aiding captives.
        required_evidence:
          - Silk cap identified as Wing's
          - Wing found wounded at Dr. Lorrimore's house
        reader_observable: true
      - observation: Rubies and pearls were found with Wing after escape.
        correction: These jewels were the motive for the murders of the Quicks.
        effect: Confirms treasure as central to the murders and conspiracy.
        required_evidence:
          - Statement of diamond merchant Baubenheimer
          - Jewels recovered from Wing after rescue
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      Wing is allowed to escape from the yacht and is tracked to Dr. Lorrimore's house where he is
      found wounded but alive. The presence of the silk cap and recovered jewels confirm his
      identity and role. The test reveals whether Wing is a conspirator or a double agent.
    knowledge_revealed: >-
      Wing was the fourth Chinaman on the yacht, escaped after a mutiny, and acted to protect the
      captives and expose the conspirators.
    pass_condition: Wing is found alive with the silk cap and jewels, confirming his identity and innocence.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given all essential clues: the tobacco-box with scratches, the blood-stained
      handkerchief, the inventories of the monastic treasure, the testimonies of witnesses like
      Solomon Fish and James Beeman, and the detective's investigations. The presence of the yacht,
      the crew, and the mutiny are all described. The reader can deduce the motive, the
      conspirators, and the sequence of events leading to the murders and the final confrontation.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
