  culpability:
    culprit_count: 2
    culprits:
      - Alvord Hendricks
      - Willy Hanlon
  surface_model:
    narrative:
      summary: >-
        Sanford Embury is found mysteriously dead in his locked bedroom with no apparent cause.
        Suspicion falls on his wife Eunice due to marital tensions and the presence of a poison
        dropper in her bathroom. The case involves a locked-room mystery with multiple suspects and
        conflicting alibis.
    accepted_facts:
      - Sanford Embury died suddenly in his locked bedroom
      - No external signs of violence or forced entry were found
      - A medicine dropper containing henbane poison was found in the bathroom
      - Only Eunice Embury and Aunt Abby Ames had access to the locked suite
    inferred_conclusions:
      - Eunice Embury poisoned her husband out of financial frustration
      - Aunt Abby Ames was hypnotized and accidentally administered the poison
      - Alvord Hendricks had a perfect alibi and could not have been involved
  hidden_model:
    mechanism:
      description: >-
        The murderer hired Willy Hanlon, a performer training as a human fly, to climb the exterior
        of the apartment building and enter through Aunt Abby Ames' window. Hanlon silently
        traversed the locked suite, administered henbane poison into Sanford Embury's ear while he
        slept, and exited the same way. The poison caused sudden death with no external signs, and
        the medicine dropper was accidentally dropped near Aunt Abby's bed during the escape.
      delivery_path:
        - step: Alvord Hendricks hires Willy Hanlon to kill Sanford Embury
        - step: Hanlon climbs the exterior of the apartment building as a human fly
        - step: Hanlon enters through Aunt Abby Ames' window into the locked suite
        - step: Hanlon administers henbane poison into Embury's ear while he sleeps
        - step: Hanlon accidentally drops the poison dropper near Aunt Abby's bed
        - step: Hanlon exits the suite the same way he entered
        - step: Embury dies suddenly from the poison with no external marks
    outcome:
      result: >-
        Alvord Hendricks is arrested and convicted for orchestrating Sanford Embury's murder through
        Willy Hanlon.
  false_assumption:
    statement: Eunice Embury, the wife, is the murderer due to motive and opportunity.
    type: behavioral
    why_it_seems_reasonable: >-
      Eunice had frequent quarrels with her husband and lacked personal cash, providing a plausible
      motive. The locked room and presence of the poison dropper in her bathroom suggest
      opportunity.
    what_it_hides: >-
      The real murderer used an external agent to bypass the locked doors, and the poison dropper
      was accidentally left behind by the killer, not Eunice.
  false_solution:
    accused_suspect: Eunice Embury
    supporting_points:
      - She had a motive due to financial frustrations and quarrels
      - The poison dropper was found in her bathroom
      - She was present in the locked suite with the victim
      - Her behavior was defensive and angry when accused
    the_one_flaw: >-
      The locked doors and windows made it impossible for her to have administered the poison
      without detection, and the real killer had an external means of entry.
    refuted_in_chapter: 18
  red_herrings:
    - id: aunt_abby_ames_hypnotized_confession
      description: >-
        Aunt Abby Ames confesses to the murder under supposed hypnotism, suggesting she was the
        killer.
      points_at_suspect: Aunt Abby Ames
      innocent_explanation: >-
        Her confession was false, made to protect Eunice, and she was not responsible for the
        murder.
      resolved_in_chapter: 18
    - id: mason_elliott_motive_jealousy
      description: Mason Elliott is suspected due to his secret love for Eunice and possible jealousy.
      points_at_suspect: Mason Elliott
      innocent_explanation: He had a strong alibi and no opportunity to commit the crime.
      resolved_in_chapter: 18
  closed_circle:
    suspects:
      - Eunice Embury
      - Aunt Abby Ames
      - Mason Elliott
      - Alvord Hendricks
      - Ferdinand
      - Willy Hanlon
    rationale: >-
      The locked bedroom suite was accessible only to these individuals, and no external entry was
      possible through windows or doors.
  constraint_space:
    time:
      anchors:
        - night of Sanford Embury's death
        - daybreak when body was found
      windows:
        - time between midnight and early morning
        - bridge party duration for Eunice's alibi
    access:
      actors:
        - Eunice Embury
        - Aunt Abby Ames
        - Ferdinand
        - Willy Hanlon
      objects:
        - locked bedroom doors with snap-locks
        - windows without balconies
    social:
      trust_channels:
        - Mason Elliott's testimony
        - Ferdinand's statements
        - Aunt Abby's vision
      authority_sources:
        - Medical Examiner Dr. Crowell
        - Detectives Shane and Driscoll
        - Detective Fleming Stone
  inference_path:
    steps:
      - observation: Poison dropper containing henbane found in Miss Ames' bathroom medicine chest
        correction: The dropper was dropped accidentally by the killer during escape
        effect: Shifts suspicion away from Eunice and Aunt Abby as intentional poisoners
        required_evidence:
          - Maggie's maid testimony about finding the dropper beside Miss Ames' bed
          - Medicine dropper found in bathroom with henbane residue
        reader_observable: true
      - observation: Alvord Hendricks had a perfect alibi in Boston during the murder
        correction: Hendricks arranged a trumped-up trip to Boston to create an alibi
        effect: Reopens suspicion on Hendricks despite alibi
        required_evidence:
          - Travel records confirming Hendricks' presence in Boston
          - Fibsy's surveillance of Hanlon and Hendricks' meeting
        reader_observable: true
      - observation: Locked bedroom doors with snap-locks prevent entry or exit
        correction: Entry was made through Aunt Abby's window by a skilled climber
        effect: Explains how the murderer accessed the victim despite locked doors
        required_evidence:
          - Window inspection showing no forced entry but accessible by climbing
          - Hanlon's human fly performance and training
        reader_observable: true
      - observation: Aunt Abby claims to have seen victim's spirit with raspberry jam taste and gasoline smell
        correction: The vision was a real person (Hanlon) passing by, leaving physical traces
        effect: Supports the theory that the killer was physically present and left clues
        required_evidence:
          - Aunt Abby's detailed account of the vision
          - Presence of raspberry jam jar on nearby apartment window sill
        reader_observable: true
      - observation: Eunice Embury had motive and opportunity due to quarrels and financial issues
        correction: Eunice was at a bridge party during the murder and had no access
        effect: Weakens case against Eunice and points to external perpetrator
        required_evidence:
          - Bridge party witness statements
          - Locked suite doors confirmed by butler Ferdinand
        reader_observable: true
      - observation: Willy Hanlon was a performer with skills in climbing and deception
        correction: Hanlon was hired by Hendricks to commit the murder using his climbing skills
        effect: Identifies the actual murderer and method of entry
        required_evidence:
          - Hanlon's human fly performance and training
          - Fibsy's surveillance and investigation linking Hanlon and Hendricks
        reader_observable: true
      - observation: Henbane poison was administered through the victim's ear
        correction: The poison was delivered using a medicine dropper during sleep
        effect: Explains cause of death and method of murder
        required_evidence:
          - Medical Examiner's report on cause of death
          - Medicine dropper found in bathroom with henbane residue
        reader_observable: true
  discriminating_test:
    method: constraint_proof
    design: >-
      Reenact the locked-room conditions by securing the bedroom doors with the same snap-locks and
      observing if any person can enter or exit without unlocking. Additionally, test the
      possibility of entry through the window by a skilled climber simulating Hanlon's human fly
      technique. Observe if any physical traces such as raspberry jam or gasoline odor can be
      replicated during the entry and exit.
    knowledge_revealed: >-
      This test reveals that no one inside the locked doors could have administered the poison, and
      that entry through the window by a climber is feasible and explains the physical evidence.
    pass_condition: >-
      Successful demonstration that the window entry is possible and that the locked doors prevent
      any other access or egress.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is provided with all necessary clues including the locked doors, the poison
      dropper, the presence of raspberry jam and gasoline odor, and the knowledge of Hanlon's
      climbing skills. The alibis and motives of suspects are clearly stated, and the suspicious
      perfect alibi is highlighted. The confession of Hanlon and the connection to Hendricks are
      foreshadowed. The reader could deduce the true mechanism by questioning the locked-room
      impossibility and considering an external entry via the window.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
