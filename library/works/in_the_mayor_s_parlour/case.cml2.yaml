  culpability:
    culprit_count: 2
    culprits:
      - Krevin Crood
      - Simon Crood
  surface_model:
    narrative:
      summary: >-
        Mayor John Wallingford is found murdered in his Parlour with a rapier wound. The crime
        appears to be politically motivated, with suspicion falling on the Town Trustees and their
        associates. A secret passage and a blood-stained handkerchief add mystery to the case.
    accepted_facts:
      - Wallingford was murdered in the Mayor's Parlour late evening
      - Access to the Parlour was possible via a secret passage from St. Lawrence tower
      - >-
        A blood-stained, partially burnt cambric handkerchief belonging to Dr. Wellesley was found
        at the scene
      - >-
        Krevin Crood was arrested with incriminating papers and a memorandum book belonging to
        Wallingford
    inferred_conclusions:
      - Dr. Wellesley was the murderer due to jealousy over Mrs. Saumarez
      - Krevin Crood acted alone in the murder
      - Mrs. Mallett was involved in the murder conspiracy
  hidden_model:
    mechanism:
      description: >-
        Krevin Crood, acting on behalf of the Town Trustees, used his knowledge of the secret
        passage between St. Lawrence tower and the Moot Hall to enter the Mayor's Parlour
        undetected. During a quarrel between Wallingford and Mrs. Saumarez, she fatally stabbed him
        with a rapier. Krevin then attempted to cover up the crime by burning a blood-stained
        handkerchief and removing incriminating papers, but was ultimately caught.
      delivery_path:
        - step: Krevin obtains keys to St. Lawrence church and locks himself inside the tower
        - step: He uses the secret passage through the connecting wall to reach the Mayor's Parlour
        - step: Overhears a quarrel between Wallingford and Mrs. Saumarez
        - step: Mrs. Saumarez fatally stabs Wallingford with a rapier during the quarrel
        - step: Krevin enters the Parlour, wipes blood with a handkerchief, and burns it partially
        - step: Krevin takes Wallingford's papers and memorandum book
        - step: Krevin leaves the Parlour via the secret passage
    outcome:
      result: >-
        Krevin Crood confesses the truth, revealing Mrs. Saumarez as the actual murderer, leading to
        the collapse of the corrupt Town Trustees' regime.
  false_assumption:
    statement: Dr. Wellesley was the murderer motivated by jealousy over Mrs. Saumarez.
    type: identity
    why_it_seems_reasonable: >-
      Dr. Wellesley was absent from his surgery during the murder time, had a known rivalry with
      Wallingford over Mrs. Saumarez, and a blood-stained handkerchief of his was found at the
      scene. Witness testimony suggested jealousy and secret meetings.
    what_it_hides: >-
      It conceals the actual use of the secret passage by Krevin Crood and the involvement of Mrs.
      Saumarez in the murder, misleading investigators to focus on Wellesley.
  false_solution:
    accused_suspect: Dr. Wellesley
    supporting_points:
      - Absence from surgery during the nineteen-minute interval
      - Jealousy over Mrs. Saumarez testified by witnesses
      - Blood-stained handkerchief belonging to him found at the scene
      - Secret meetings with Mrs. Saumarez and Mrs. Mallett
    the_one_flaw: >-
      Lack of direct evidence placing him at the murder scene and the existence of a secret passage
      used by the real murderer
    refuted_in_chapter: 24
  red_herrings:
    - id: dr_wellesley_jealousy
      description: >-
        Dr. Wellesley was suspected due to his jealousy over Mrs. Saumarez and his unexplained
        absence during the murder time.
      points_at_suspect: Dr. Wellesley
      innocent_explanation: >-
        He was with his assistant and patients during the absence, and the handkerchief was
        mistakenly mixed in laundry.
      resolved_in_chapter: 24
    - id: mrs_mallett_secret_visits
      description: >-
        Mrs. Mallett's secret visits to Dr. Wellesley and the Mayor suggested involvement in the
        murder plot.
      points_at_suspect: Mrs. Mallett
      innocent_explanation: >-
        Her visits were for private reasons unrelated to the murder, and she fled town due to
        personal reasons.
      resolved_in_chapter: 19
  closed_circle:
    suspects:
      - Krevin Crood
      - Simon Crood
      - Stephen Mallett
      - James Coppinger
      - Mrs. Saumarez
    rationale: >-
      All had motive to prevent Wallingford's reforms, access via secret passage, and were connected
      by conspiracy; no outsiders had plausible access.
  constraint_space:
    time:
      anchors:
        - Wallingford entered Mayor's Parlour about 7:25 pm
        - Murder occurred between 7:30 and 7:49 pm
        - Mrs. Bunning absent from 7:30 to nearly 8:00 pm
        - Krevin Crood arrested at 6:30 pm previous evening
      windows:
        - 19-minute absence of Dr. Wellesley from surgery
        - Half-hour window of unguarded back door access
    access:
      actors:
        - Krevin Crood
        - Mrs. Saumarez
        - Mrs. Bunning
        - Simon Crood
        - Stephen Mallett
        - James Coppinger
      objects:
        - Secret passage between St. Lawrence tower and Moot Hall
        - Back door via Bunning's rooms
        - Mayor's Parlour door
        - Typewriter used by Simon Crood
    social:
      trust_channels:
        - Police Superintendent Hawthwaite
        - Coroner Seagrave
        - Solicitor Tansley
        - Editor Peppermore
      authority_sources:
        - Town Trustees (Simon Crood, Mallett, Coppinger)
        - Local Government Board Inspector
        - Coroner's Court
  inference_path:
    steps:
      - observation: Blood-stained, partially burnt cambric handkerchief found at murder scene
        correction: Handkerchief belongs to Dr. Wellesley but was mistakenly mixed in laundry
        effect: Dr. Wellesley is suspected but alibi and laundry records needed
        required_evidence:
          - Mrs. Marriner's testimony about laundry handkerchiefs
          - Laundry books and customer records
        reader_observable: true
      - observation: Dr. Wellesley absent from surgery for nineteen minutes around murder time
        correction: He was in his drawing-room with a secret caller
        effect: Raises suspicion of involvement
        required_evidence:
          - Testimony of Dr. Carstairs about surgery hours
          - Testimony of Mrs. Mallett about secret visit
        reader_observable: true
      - observation: Secret passage between St. Lawrence tower and Moot Hall discovered
        correction: Passage used by Krevin Crood to enter Mayor's Parlour
        effect: Explains how murderer accessed and escaped
        required_evidence:
          - Dr. Pellery's expert testimony on secret passage
          - Spizey and Mrs. Spizey's testimony about keys and access
        reader_observable: true
      - observation: Krevin Crood arrested with Mayor's papers and memorandum book
        correction: Krevin was intermediary for Town Trustees and present at murder scene
        effect: Links Krevin to conspiracy and cover-up
        required_evidence:
          - Detective-Sergeant Welton's search reports
          - Louisa Speck's testimony about handkerchief and linen
        reader_observable: true
      - observation: Typewritten threatening letter sent to Mayor from Simon Crood's typewriter
        correction: Simon Crood and associates conspired to bribe and silence Mayor
        effect: Establishes motive and conspiracy
        required_evidence:
          - Samuel Owthwaite's expert testimony on typewriter
          - Queenie Crood's demonstration of typewriter defects
        reader_observable: true
      - observation: Mrs. Saumarez's letters destroyed secretly
        correction: She was desperate to hide correspondence revealing her involvement
        effect: Suggests her guilt and motive
        required_evidence:
          - Brent's observation of burnt letters in fire
          - Mrs. Saumarez's nervous behavior and desire for secrecy
        reader_observable: true
      - observation: Krevin Crood's confession naming Mrs. Saumarez as murderer
        correction: Mrs. Saumarez stabbed Wallingford during quarrel in Mayor's Parlour
        effect: Reveals true murderer and clears Krevin
        required_evidence:
          - Krevin Crood's sworn statement in court
          - Physical evidence of rapier and blood-stained handkerchief
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Reenact the timeline and movements on the evening of the murder, focusing on the secret
      passage usage and the presence of Mrs. Saumarez in the Mayor's Parlour. Verify the timing of
      Mrs. Bunning's absence and the accessibility of the back door and passage. Observe the
      possibility of a rapid murder and escape via the secret passage.
    knowledge_revealed: >-
      Confirms that the murderer used the secret passage to enter and exit, and that Mrs. Saumarez
      was present and responsible for the stabbing.
    pass_condition: >-
      Demonstration that the secret passage allows access within the murder time window and that
      Mrs. Saumarez's presence and actions are consistent with the murder timeline.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is provided with detailed descriptions of the secret passage, the timing of key
      events, the discovery of the handkerchief, and the relationships between characters. Clues
      such as the typewritten letter, the laundry mix-up, and Krevin's knowledge of the passage are
      all presented. The final confession by Krevin and the physical evidence are foreshadowed,
      allowing an attentive reader to deduce the true mechanism and culprit.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
