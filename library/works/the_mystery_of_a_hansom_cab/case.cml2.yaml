  culpability:
    culprit_count: 2
    culprits:
      - Mark Frettlby
      - Roger Moreland
  surface_model:
    narrative:
      summary: >-
        A man named Oliver Whyte is found murdered in a hansom cab in Melbourne. Brian Fitzgerald,
        engaged to Madge Frettlby, is arrested based on circumstantial evidence but is later
        acquitted when a key witness, Sal Rawlins, appears and provides an alibi. The true murderer
        remains at large, and the mystery deepens.
    accepted_facts:
      - Oliver Whyte was murdered by chloroform in a hansom cab
      - Brian Fitzgerald was arrested and tried for the murder
      - Sal Rawlins provided an alibi for Brian Fitzgerald
      - Mark Frettlby had a secret marriage to Rosanna Moore
    inferred_conclusions:
      - Brian Fitzgerald was the murderer
      - The man in the light coat was Brian Fitzgerald
      - Roger Moreland was innocent
  hidden_model:
    mechanism:
      description: >-
        Mark Frettlby, to protect his secret marriage and prevent Oliver Whyte from marrying his
        daughter Madge, murdered Whyte by administering chloroform in a hansom cab. Roger Moreland,
        an accomplice, impersonated Brian Fitzgerald to mislead witnesses and escape detection. The
        murder was committed quietly without struggle, and the stolen marriage certificate was taken
        from Whyte's secret pocket.
      delivery_path:
        - step: Frettlby follows Whyte to town after a quarrel
        - step: Moreland impersonates Fitzgerald and gets into the cab with Whyte
        - step: Moreland uses chloroform-soaked handkerchief to kill Whyte
        - step: Moreland takes the marriage certificate from Whyte's secret pocket
        - step: Moreland leaves the cab at Powlett Street and hides Whyte's coat in Fitzroy Gardens
        - step: Moreland demands hush-money from Frettlby
        - step: Moreland is arrested and confesses the murder
    outcome:
      result: >-
        Roger Moreland is arrested and confesses to the murder, while Mark Frettlby's secret and
        guilt are revealed posthumously.
  false_assumption:
    statement: Brian Fitzgerald was the man who got into the cab with Oliver Whyte and murdered him.
    type: identity
    why_it_seems_reasonable: >-
      The cabman Royston swore that the man who got into the cab resembled Fitzgerald and spoke as
      if he knew Whyte. Fitzgerald was known to have threatened Whyte and was found with Whyte's
      glove in his coat pocket.
    what_it_hides: >-
      It hides the fact that the man who got into the cab was actually Roger Moreland impersonating
      Fitzgerald, and that Fitzgerald had a solid alibi supported by Sal Rawlins.
  false_solution:
    accused_suspect: Brian Fitzgerald
    supporting_points:
      - Cabman Royston identified him as the man who entered the cab
      - Fitzgerald had threatened Whyte previously
      - Fitzgerald was found with Whyte's glove in his coat pocket
      - Fitzgerald could not initially provide an alibi
    the_one_flaw: >-
      The alibi provided by Sal Rawlins and the discovery of the real murderer Moreland disproved
      Fitzgerald's guilt.
    refuted_in_chapter: 33
  red_herrings:
    - id: roger_moreland_suspicion
      description: Roger Moreland was suspected due to his suspicious behavior and possession of Whyte's coat.
      points_at_suspect: Roger Moreland
      innocent_explanation: >-
        Moreland was actually the murderer, so suspicion was correct but incomplete without
        Frettlby's involvement.
      resolved_in_chapter: 33
    - id: moreland_as_barman
      description: >-
        Moreland claimed to be a barman and very drunk on the night of the murder to deflect
        suspicion.
      points_at_suspect: Roger Moreland
      innocent_explanation: Moreland was feigning drunkenness to cover his crime.
      resolved_in_chapter: 33
  closed_circle:
    suspects:
      - Brian Fitzgerald
      - Mark Frettlby
      - Roger Moreland
    rationale: >-
      The investigation focused on these three men due to their close relationships with the victim,
      their presence or actions on the night of the murder, and the evidence linking them to the
      crime scene and motive.
  constraint_space:
    time:
      anchors:
        - between 1 and 2 am on the night of the murder
        - arrival of the cab at St. Kilda Police Station at about 2 am
        - Moreland's bank visit at 2 pm the day after receiving hush-money cheque
      windows:
        - Fitzgerald's alibi at the slum between 1 and 2 am
        - Moreland's movements from cab to hiding coat and walking home
    access:
      actors:
        - Mark Frettlby
        - Roger Moreland
        - Brian Fitzgerald
        - Oliver Whyte
      objects:
        - hansom cab
        - chloroform bottle
        - marriage certificate
        - Whyte's coat
    social:
      trust_channels:
        - testimony of cabmen Royston and Rankin
        - testimony of Sal Rawlins
        - confession manuscript of Mark Frettlby
      authority_sources:
        - Melbourne Police
        - Court of Law
        - Medical testimony of Dr. Chinston
  inference_path:
    steps:
      - observation: Cabman Royston identified the man in the light coat as Brian Fitzgerald.
        correction: >-
          Royston was intoxicated and only saw partial features; the man was actually Roger Moreland
          impersonating Fitzgerald.
        effect: Initial suspicion on Fitzgerald was misplaced.
        required_evidence:
          - Testimony of Sal Rawlins about meeting Fitzgerald at the slum
          - Appearance and behavior of the man in the cab as described by multiple witnesses
        reader_observable: true
      - observation: Fitzgerald was seen entering his lodgings at Powlett Street shortly before 2 am.
        correction: >-
          The kitchen clock was 10 minutes fast; corrected time shows Fitzgerald was home before the
          murder occurred.
        effect: Fitzgerald's alibi is confirmed.
        required_evidence:
          - Testimony of Mrs. Sampson about the kitchen clock
          - Watchmaker Dendy's testimony about correcting the clock
        reader_observable: true
      - observation: A diamond ring was seen on the man who left the cab at Powlett Street.
        correction: Fitzgerald never wore rings; Moreland wore a ring on the forefinger of the right hand.
        effect: Evidence points away from Fitzgerald and towards Moreland.
        required_evidence:
          - Testimony of cabman Rankin about the ring
          - Testimony of Felix Rolleston about Fitzgerald's dislike of rings
        reader_observable: true
      - observation: Whyte was murdered for valuable papers he carried.
        correction: The papers were the secret marriage certificate of Frettlby and Rosanna Moore.
        effect: Motive for murder is to protect Frettlby's secret.
        required_evidence:
          - Marriage certificate found in Whyte's secret pocket
          - Testimony of Sal Rawlins about the papers
        reader_observable: true
      - observation: Mother Guttersnipe claimed to be Rosanna Moore's mother and Sal Rawlins' grandmother.
        correction: Her testimony is partially unreliable due to drunkenness and malice.
        effect: Some details need corroboration.
        required_evidence:
          - Testimony of Sal Rawlins
          - Medical testimony about Mother Guttersnipe's condition
        reader_observable: true
      - observation: Moreland claimed innocence and gave conflicting stories.
        correction: Moreland confessed to the murder after arrest.
        effect: True murderer identified.
        required_evidence:
          - Discovery of Whyte's coat in Fitzroy Gardens
          - Purchase record of chloroform by Whyte
        reader_observable: true
      - observation: Frettby died suddenly after a mysterious visit from Moreland.
        correction: >-
          Frettby's death was caused by heart disease exacerbated by shock from exposure of his
          secret.
        effect: Frettby's guilt and secret marriage revealed posthumously.
        required_evidence:
          - Medical testimony of Dr. Chinston
          - Marriage certificate found in Whyte's secret pocket
        reader_observable: true
  discriminating_test:
    method: constraint_proof
    design: >-
      Investigators compared the timeline of Brian Fitzgerald's alibi with the time the murder
      occurred, using testimonies about the kitchen clock corrected by a watchmaker and the witness
      Sal Rawlins' account of Fitzgerald's presence at the slum. They also examined the presence of
      a diamond ring on the man who left the cab, which Fitzgerald never wore but Moreland did. The
      discovery of Whyte's coat in the Fitzroy Gardens further constrained the possible movements of
      suspects.
    knowledge_revealed: >-
      The test revealed that Fitzgerald could not have been the murderer as he was accounted for
      during the murder time, and that Moreland's movements and possessions matched those of the
      murderer.
    pass_condition: >-
      The suspect must have been physically present at the murder scene during the time of the crime
      and possess the distinctive items (ring, coat) linked to the murder.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed witness testimonies, timelines, and descriptions of clothing and
      possessions. The alibi of Brian Fitzgerald is supported by multiple witnesses and physical
      evidence such as the corrected kitchen clock and Sal Rawlins' testimony. The presence of a
      diamond ring on the murderer and the discovery of Whyte's coat provide tangible clues. The
      confession manuscript and the final revelation are foreshadowed through scattered hints,
      allowing attentive readers to piece together the true culprit and motive.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
