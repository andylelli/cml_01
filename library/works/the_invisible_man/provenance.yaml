open_issues:
  - id: mechanism_family_vocabulary
    severity: finding
    detail: >
      `mechanism_family` was forced to `impersonation`, and that is not what happens in this story.
      Welkin impersonates nobody; he occupies a ROLE whose occupant is not perceived as a person.
      The 14-value enum in schema/novelty_fingerprint.schema.yaml has no member for functional or
      occupational invisibility — so the vocabulary cannot express the best behavioral case in the
      genre. Proposed addition: `role_invisibility`.
  - id: axis_is_arguable
    severity: note
    detail: >
      Encoded `behavioral` (the deception exploits how a role is habitually perceived). There is a
      defensible reading as `authority` — four uniformed witnesses believed because of their standing.
      Recorded here rather than hidden, because §4.3's drift began as exactly this kind of unrecorded
      judgement call.
