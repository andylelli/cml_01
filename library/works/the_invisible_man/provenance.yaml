  spans_checked: 20
  spans_passed: 20
  negative_control:
    span: "Ralph Hewitt"
    expected: fail
    result: fail
    note: >
      The fabricated name from the existing the_clue_of_the_twisted_candle encoding (§3.2), checked
      against a source that cannot contain it. It fails, which is the whole point: an invented claim
      cannot produce a passing span.
  claims:
    - claim: "victim is Isidore Smythe, body recovered from the canal"
      span: "they’ve just found poor Mr. Smythe’s body in the canal down below"
    - claim: "cause of death is a stab wound over the heart, not drowning"
      span: "he wasn’t drowned either, for he died of a great stab over the heart"
    - claim: "James Welkin is the squinting man"
      span: "James Welkin (that was the squinting man’s name)"
    - claim: "the culprit is the passing postman"
      span: "put his hand on the shoulder of an ordinary passing postman who had bustled by them unnoticed"
    - claim: "the squint identifies the postman as Welkin"
      span: "all three men were fixed with an almost fiendish squint"
    - claim: "the postbag is the means of body removal"
      span: "even carry large bags where a small corpse can be stowed quite easily"
    - claim: "false assumption: the witnesses' 'nobody' is narrower than it sounds"
      span: "When those four quite honest men said that no man had gone into the Mansions, they did not really mean that no man had gone into them."
    - claim: "governing principle of the deception"
      span: "people never answer what you say? They answer what you mean"
    - claim: "a man did enter and leave, unnoticed"
      span: "A man did go into the house, and did come out of it, but they never noticed him."
    - claim: "the killer is 'mentally invisible', not physically so"
      span: "A mentally invisible man"
    - claim: "clue: grey footprints in the snow at the guarded entrance"
      span: "ran a stringy pattern of grey footprints stamped upon the white snow"
    - claim: "clue: stamp paper gummed to the shop window in public"
      span: "there was the vast lot of stamp paper on the window"
    - claim: "clue: Welkin took long solitary walks"
      span: "there was the fact that this Welkin went for long walks"
    - claim: "clue: someone must have carried the letters to Laura Hope"
      span: "barring carrier-pigeons, somebody must have brought her the letter"
    - claim: "discriminating test: was a light brown sack found with the body"
      span: "I wonder if they found a light brown sack"
    - claim: "blood on the floor but no corpse in the flat"
      span: "Isidore Smythe was not in the place, either dead or alive"
    - claim: "the threat gummed to the shop window"
      span: "If you marry Smythe, he will die"
    - claim: "motive: Smythe and Welkin were rival suitors"
      span: "when they both offered to marry me in the same week"
    - claim: "constraint: the building has no back door"
      span: "there was no back door"
    - claim: "witness testimony that seals the apparent impossibility"
      span: "I’ll swear there’s been nobody to ask since this gentleman went away"

