pattern_id: the_valley_of_fear
title: The Borrowed Corpse
family: identity
axes:
  - spatial
principle: >-
  The bloodstain was deliberately made by a suspect to mislead investigators. The murderer never
  escaped through the window but was killed inside.
principleType: cognitive_bias
surface_illusion_template: >-
  The murderer was an outsider who hid in the house before killing the victim.; The bloodstain on
  the window sill was made by the murderer escaping through the window.; Mrs. the victim and a
  suspect a suspect conspired to conceal their guilt.
underlying_reality_template: >-
  The man found dead was not a witness the victim but the assassin, Ted Baldwin, dressed in the
  victim clothes to fake the victim death. The real the victim was hidden in a secret room within
  the manor. a suspect and Mrs. the victim conspired to protect the victim and staged the scene to
  mislead the police. The murderer was killed in a struggle with the victim, and the body was
  disposed of to fake the victim death.
