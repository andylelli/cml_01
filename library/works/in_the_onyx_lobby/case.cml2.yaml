  inference_path:
    steps:
      - observation: Dying message reads 'women did this'
        correction: Part of the message was written on the wall; initial letter 'T' missing from paper
        effect: Message actually reads 'Two men did this'
        required_evidence:
          - The paper left by Sir Herbert Binney with the message 'women did this'
          - Pencil mark 'T' on the onyx wall matching the start of the message
        reader_observable: true
      - observation: Bob Moore took Mr Vail up in the elevator at time of murder
        correction: Vail’s presence in elevator provides him with an alibi
        effect: Vail cannot be the murderer alone
        required_evidence:
          - Bob Moore’s witness statement about taking Vail up in elevator
          - Vail’s own confirmation of his whereabouts
        reader_observable: true
      - observation: Paper-cutter missing from Letitia Prall’s library set found at crime scene
        correction: Sir Herbert had the paper-cutter for repair and carried it with him
        effect: Ownership of weapon does not implicate Letitia Prall
        required_evidence:
          - Testimony from Letitia Prall about giving paper-cutter to Sir Herbert for mending
          - Discovery of paper-cutter with blood near crime scene
        reader_observable: true
      - observation: Molly claims she was married to shield a man
        correction: Molly was married by Vail to silence her about his involvement
        effect: Vail is implicated as one of the murderers
        required_evidence:
          - Molly’s statement about marriage under duress
          - Zizi and Wise’s interrogation of Molly
        reader_observable: true
      - observation: Mrs Everett and Kate Holland suspected due to presence and motive
        correction: >-
          Mrs Everett’s presence in hall at time claimed was earlier than murder; Kate Holland’s
          nursing skill not definitive
        effect: Mrs Everett and Kate Holland are innocent
        required_evidence:
          - Dorcas Everett’s testimony about presence in hall at midnight
          - Dr Pagett’s medical opinion on wound and nursing skill
        reader_observable: true
      - observation: Letitia Prall and Mrs Everett accused based on feud and motives
        correction: No direct evidence links them to murder; dying message points to two men
        effect: Both women are innocent of the murder
        required_evidence:
          - Interviews and alibis of Letitia Prall and Mrs Everett
          - Timeline of elevator ride and murder showing Vail's alibi
        reader_observable: true
      - observation: Secret recipe hidden behind wallpaper
        correction: Vail searched for and found the recipe after murder
        effect: Motive for murder linked to recipe theft
        required_evidence:
          - Discovery of hidden space behind mirror and wallpaper
          - Testimony about Vail’s searching behavior
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Reenact the timeline of the murder night focusing on the elevator ride with Vail and Bob
      Moore, the presence of Sir Herbert in the lobby, and the timing of the stabbing. Confirm the
      impossibility of Vail being the murderer due to his elevator alibi and the presence of the
      doctor with him. Verify the location and timing of all suspects and witnesses to exclude or
      implicate them.
    knowledge_revealed: >-
      This test reveals that Vail’s alibi is solid and that the murder required a skilled hand,
      implicating the doctor. It also clarifies the timing and opportunity of the murder, excluding
      the women suspects.
    pass_condition: >-
      The alibi of Vail being in the elevator with Moore at the time of the murder is confirmed, and
      the doctor’s presence with Vail is established, eliminating women suspects.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given the dying message and the details of the crime scene, including the
      missing initial letter on the wall, which is a subtle but crucial clue. The alibis and
      testimonies of key characters are presented, allowing the reader to question the literal
      interpretation of the message. The presence of the paper-cutter and its ownership are
      explained, and the suspicious behaviors of various characters are detailed. The final
      confession and unmasking are foreshadowed by inconsistencies and the discovery of the hidden
      recipe, enabling a careful reader to deduce the true culprits.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
