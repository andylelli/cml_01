  culpability:
    culprit_count: 2
    culprits:
      - George Vail
      - Doctor Weldon
  surface_model:
    narrative:
      summary: >-
        Sir Herbert Binney is found stabbed to death in the onyx lobby of The Campanile. A dying
        message seemingly accuses women of the murder, leading to suspicion of two feuding women and
        their households. The investigation uncovers a complex web of motives involving family
        feuds, business deals, and secret recipes.
    accepted_facts:
      - Sir Herbert Binney was stabbed to death in the onyx lobby
      - A dying message was found stating 'women did this'
      - Two men, including a doctor, conspired to murder Sir Herbert Binney
      - The secret recipe for Binney’s Buns was hidden behind wallpaper in his apartment
    inferred_conclusions:
      - The murder was committed by women involved in the family feud
      - Letitia Prall and Mrs Everett acted together to kill Sir Herbert
      - The dying message clearly meant 'women did this' and not 'two men did this'
  hidden_model:
    mechanism:
      description: >-
        Sir Herbert Binney was murdered by two men, George Vail and Doctor Weldon, who conspired to
        kill him to gain control of the valuable secret recipe. The doctor, skilled in surgery,
        stabbed Binney with a paper-cutter while Vail created an alibi by riding the elevator with
        the night porter. Binney, in his dying moments, attempted to write a message but began on
        the wall, causing the first letter 'T' to be missed, leading to the misinterpretation of
        'women' instead of 'two men'.
      delivery_path:
        - step: Vail and Doctor Weldon planned the murder to obtain the secret recipe
        - step: Binney was invited to Dr Weldon's home and refused to agree to Vail's terms
        - step: >-
            On returning to The Campanile, Vail entered the elevator with the night porter to
            establish an alibi
        - step: Doctor Weldon stabbed Binney with the paper-cutter in the onyx lobby
        - step: Binney, dying, tried to write a message on a piece of paper held against the wall
        - step: The missing initial 'T' on the wall caused the message to be read as 'women did this'
        - step: Vail searched for the hidden recipe and married Molly to silence her
    outcome:
      result: >-
        The true murderers, two men including a doctor, are exposed, clearing the women and
        resolving the case.
  false_assumption:
    statement: The dying message 'women did this' was taken literally to mean female perpetrators.
    type: identity
    why_it_seems_reasonable: >-
      The message was clearly written by the dying victim and explicitly states 'women did this'.
      The victim was known to have many female acquaintances, making the accusation plausible.
    what_it_hides: >-
      The initial letter 'T' was written on the wall, not the paper, making the message actually
      read 'Two men did this', thus hiding the true identity of the culprits.
  false_solution:
    accused_suspect: Letitia Prall
    supporting_points:
      - She had a strong motive to remove Sir Herbert to secure her nephew's inheritance
      - The paper-cutter missing from her library set was found at the crime scene
      - She expressed willingness to kill Sir Herbert if sure not caught
      - She had opportunity to access the lobby via servants’ stairs
    the_one_flaw: >-
      The dying message was misread; the actual killers were two men, not women, and Letitia had an
      alibi.
    refuted_in_chapter: 18
  red_herrings:
    - id: chorus_girls
      description: >-
        Four chorus girls who dined with Sir Herbert and had quarrels over gifts were suspected due
        to their jealousy and threats.
      points_at_suspect: Viola Mersereau and Babe Russell were suspected due to their temper and threats.
      innocent_explanation: >-
        They were too young and lacked the skill or opportunity to commit the murder; their alibis
        and behavior exonerated them.
      resolved_in_chapter: 7
    - id: house_girls
      description: >-
        Elevator girls, telephone operators, and chambermaids in the building were suspected because
        of their grievances against Sir Herbert.
      points_at_suspect: Daisy Lee and Julie Baxter were suspected due to their animosity and secretive behavior.
      innocent_explanation: >-
        They lacked motive and opportunity; Julie Baxter’s secret trip was unrelated, and the
        chambermaids had alibis.
      resolved_in_chapter: 10
