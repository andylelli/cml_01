  inference_path:
    steps:
      - observation: >-
          Two hats and two pairs of gloves found at the crime scene, matching the description of two
          women in the advertisements.
        correction: >-
          Presence of two women involved, not just the victim, as supported by the advertisement for
          a woman matching Olive's description.
        effect: Suggests disguise or identity swap and the attempt to mislead investigators.
        required_evidence:
          - >-
            Hat found in dining-room closet with a label matching the advertisement for a missing
            woman
          - Gloves found with the hats, matching the description in the advertisement
        reader_observable: true
      - observation: >-
          Victim's body found with feet towards door, not wall, and the arrangement matches the
          description in witness statements.
        correction: Not an accident by pulling cabinet over herself; the position matches a staged scene.
        effect: Supports murder theory and the attempt to incriminate another.
        required_evidence:
          - Body position at discovery as described by Amelia Butterworth
          - Arrangement of clothing about feet, matching witness description
        reader_observable: true
      - observation: >-
          Hat-pin found broken in victim's neck wound, matching the description of the murder weapon
          in the advertisements.
        correction: >-
          Murder weapon identified as hat-pin, as described in the police advertisement for
          information.
        effect: Indicates deliberate stabbing and attempt to conceal the true assailant.
        required_evidence:
          - Broken hat-pin retrieved from register, matching the advertisement's description
          - Autopsy report of wound, confirming the match to the hat-pin
        reader_observable: true
      - observation: >-
          Clock stopped at five, but murder occurred earlier; the timeline contradicts the
          description in the advertisement for witnesses.
        correction: >-
          Clock was wound after murder to create false alibi, as revealed by the testimony matching
          the advertisement's request for information.
        effect: Implies premeditation, alibi fabrication, and attempt to mislead investigators.
        required_evidence:
          - Clock found running after cabinet fell, as described in the police advertisement
          - Testimony of Mrs. Boppert about winding clock, matching the advertisement's request
        reader_observable: true
      - observation: >-
          Rings found in Franklin Van Burnam's desk, matching the description of missing items in
          the advertisement.
        correction: >-
          Rings planted to implicate Franklin, as revealed by the advertisement for information
          about the rings' possession.
        effect: Suggests framing or deception and an attempt to incriminate another.
        required_evidence:
          - Testimony of maid placing rings, matching the advertisement's description
          - Discovery of rings on desk hook, as described in the advertisement
        reader_observable: true
      - observation: >-
          Olive Randolph's presence and feverish state, as matched by the advertisement for a woman
          fitting her description, and her attempt to avoid detection.
        correction: >-
          She is the rival and murderer, as revealed by her possession of incriminating items and
          her attempt to conceal her identity.
        effect: Shifts suspicion from brothers to Olive and reveals her attempt to avoid incrimination.
        required_evidence:
          - >-
            Identification by Chinaman and Mrs. Desberger, matching the advertisement's description
            of the woman
          - >-
            Possession of the victim's rings and clothing by Olive, as revealed by the advertisement
            and police search
        reader_observable: true
      - observation: >-
          Randolph Stone's (John Randolph) involvement is revealed by the advertisement for a man
          matching his description and his attempt to conceal evidence.
        correction: >-
          Mastermind behind murder and deception, as revealed by his possession of incriminating
          items and attempt to mislead investigators.
        effect: Completes the criminal conspiracy and reveals the attempt to conceal the true culprits.
        required_evidence:
          - >-
            Possession of incriminating letters and items by Randolph Stone, matching the
            advertisement's description
          - Testimony of Randolph Stone regarding his attempt to mislead investigators
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      Amelia Butterworth advertises for a woman matching Olive Randolph's description without
      mentioning personal details, to lure her out. Upon contact, she is observed and questioned
      about possession of the victim's rings and clothing. The test confirms Olive's identity and
      her connection to the crime by matching her to the advertisement and observing her attempt to
      conceal incriminating items.
    knowledge_revealed: >-
      This test reveals Olive Randolph's presence, her possession of incriminating items, and her
      attempt to conceal her identity, as matched to the advertisement and witness description.
    pass_condition: >-
      The suspect responds to the advertisement and is found in possession of the victim's rings and
      clothing, confirming her involvement by matching the description and revealing incriminating
      evidence.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed observations from Amelia Butterworth, testimony from witnesses,
      and clues such as the broken hat-pin, the clock's timing, and the discovery of two hats and
      gloves. The advertisements and letters provide leads to Olive Randolph. The narrative includes
      red herrings and false accusations, but all clues needed to deduce the true culprits are
      presented fairly.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
