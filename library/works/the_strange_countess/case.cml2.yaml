  culpability:
    culprit_count: 2
    culprits:
      - Leonora, Countess of Moron
      - Chesney Praye
  surface_model:
    narrative:
      summary: >-
        Lois Reddle, secretary to the Countess of Moron, discovers her mother was wrongfully
        imprisoned for murder. After a sequence of accidents and attempts on her life, Lois is
        abducted and detained in a remote farm under the care of a dubious doctor. Michael Dorn, a
        detective, investigates the case, uncovering a conspiracy involving the Countess and her
        associates to secure the Moron estate by eliminating Mary Pinder and her daughter.
    accepted_facts:
      - Mary Pinder was convicted of murder and imprisoned for life.
      - Lois Margeritta Reddle is Mary Pinder’s daughter and has a distinctive star-shaped scar.
      - >-
        The Countess of Moron employed Lois as her secretary and is involved in suspicious
        activities.
      - Michael Dorn is a detective investigating the case and protecting Lois.
    inferred_conclusions:
      - Mary Pinder was guilty of murder and deserved her sentence.
      - The accidents and attempts on Lois’s life were unrelated incidents.
      - Chesney Praye and Dr. Tappatt were innocent or merely minor accomplices.
  hidden_model:
    mechanism:
      description: >-
        The Countess of Moron orchestrated the wrongful imprisonment of Mary Pinder by planting
        evidence and manipulating the trial. To prevent Lois from uncovering the truth and claiming
        the estate, the Countess and her accomplices Chesney Praye and Dr. Tappatt arranged for Lois
        to be abducted and detained in a remote farm disguised as a mental home. Attempts on Lois’s
        life included poisoned chocolates and dangerous accidents, all intended to eliminate her as
        a threat. Michael Dorn’s investigation exposed the conspiracy and led to the rescue of Lois
        and Mary.
      delivery_path:
        - step: Countess arranges for Mary Pinder’s conviction by planting cyanide and jewels.
        - step: Mary Pinder is imprisoned; her baby Lois is taken away and raised by a neighbor.
        - step: Lois discovers her true identity and is employed by the Countess as secretary.
        - step: Countess attempts to eliminate Lois through accidents and poisoned gifts.
        - step: Lois is abducted and detained at Gallows Farm under Dr. Tappatt’s care.
        - step: Michael Dorn investigates, discovers the conspiracy, and locates Gallows Farm.
        - step: Dorn rescues Lois and Mary; Countess’s plot is exposed and foiled.
    outcome:
      result: >-
        The conspiracy is uncovered, Lois and Mary are freed, and the Countess’s schemes are
        defeated.
  false_assumption:
    statement: Mary Pinder was guilty of murder and the evidence against her was conclusive.
    type: identity
    why_it_seems_reasonable: >-
      The trial record and discovery of cyanide and jewels in her possession strongly suggested
      guilt. The refusal to provide information and lack of marriage certificate reinforced
      suspicion.
    what_it_hides: >-
      The evidence was planted by the Countess to frame Mary Pinder and remove her as a claimant to
      the estate. The true murderer was never identified, and Mary was innocent.
  false_solution:
    accused_suspect: Lois Margeritta Reddle
    supporting_points:
      - Lois was arrested for attempted murder of John Braime.
      - She was found near the scene of the butler’s injury.
      - Her presence at suspicious locations and association with the Countess.
      - Her erratic behavior and supposed delusions.
    the_one_flaw: >-
      Lois was manipulated and framed by the Countess and her accomplices; she was innocent of any
      crime.
    refuted_in_chapter: 34
  red_herrings:
    - id: michael_dorn_suspected_stalking
      description: >-
        Michael Dorn’s persistent following of Lois and his intrusion into her room suggested he
        might be a threat or culprit.
      points_at_suspect: Michael Dorn
      innocent_explanation: >-
        Dorn was protecting Lois and investigating the conspiracy; his actions were motivated by
        concern and duty.
      resolved_in_chapter: 15
    - id: selwyn_moron_rebellion
      description: >-
        Selwyn Moron’s childish outbursts and opposition to his mother suggested he might be
        involved in the plot or acting suspiciously.
      points_at_suspect: Selwyn Moron
      innocent_explanation: Selwyn was mentally weak and manipulated by his mother; he had no involvement in the crimes.
      resolved_in_chapter: 36
  closed_circle:
    suspects:
      - Leonora, Countess of Moron
      - Chesney Praye
      - Dr. Tappatt
      - Selwyn Moron
    rationale: >-
      These individuals had access, motive, and opportunity to orchestrate the wrongful imprisonment
      and attempts on Lois’s life, while others were either victims or uninvolved.
  constraint_space:
    time:
      anchors:
        - Mary Pinder’s trial and imprisonment over 20 years ago
