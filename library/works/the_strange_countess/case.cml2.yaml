        - Countess’s social and legal influence
        - Doctor’s professional status
  inference_path:
    steps:
      - observation: Lois has a star-shaped scar matching Mary Pinder’s baby scar
        correction: Lois is Mary Pinder’s daughter, not a random coincidence
        effect: Establishes familial link and motive to prove innocence
        required_evidence:
          - >-
            Description of scar on Lois’s arm and prison doctor’s account, including the sequence of
            events leading to the identification of the scar
          - >-
            Lois’s visit to Telsbury Prison and reading of Mary Pinder’s case, as documented in the
            event records
        reader_observable: true
      - observation: Countess of Moron has a hidden safe disguised as a book with electric shock
        correction: Countess uses extreme measures to protect secrets and intimidate
        effect: Indicates Countess’s willingness to harm servants or intruders
        required_evidence:
          - >-
            Michael Dorn’s discovery of the electrified book safe and the sequence of his
            investigation into the safe’s mechanism
          - Countess’s refusal to reveal contents and reaction, as recorded in the event transcript
        reader_observable: true
      - observation: Poisoned chocolates sent to Lois and her near-fatal car accidents
        correction: Attempts on Lois’s life are deliberate and connected to Countess’s plot
        effect: Confirms active efforts to eliminate Lois
        required_evidence:
          - >-
            Michael Dorn’s investigation and removal of chocolates, including the sequence of events
            and physical trace of hydrocyanic acid
          - Witness accounts of car collisions and injuries, as documented in the event records
        reader_observable: true
      - observation: >-
          Lois and Mary Pinder are detained at Gallows Farm under Dr. Tappatt, in an event involving
          abduction and detention
        correction: >-
          They are held against their will in a disguised mental home, and the sequence of their
          abduction and detention is orchestrated by the Countess and her accomplices
        effect: Reveals the physical captivity and abuse, and the wrongful imprisonment of both women
        required_evidence:
          - >-
            Descriptions of Gallows Farm and locked rooms, including physical traces of detention
            and imprisonment
          - >-
            Michael Dorn’s search and confrontation with Dr. Tappatt, as documented in the event
            sequence
        reader_observable: true
      - observation: >-
          Chesney Praye demands Lois marry him to secure her and her mother’s release, as part of
          the orchestrated conspiracy
        correction: >-
          Praye uses coercion and blackmail as part of the conspiracy, and his actions are part of
          the event sequence leading to the exposure of the plot
        effect: >-
          Exposes Praye’s opportunistic and villainous role in the wrongful imprisonment and
          abduction
        required_evidence:
          - Lois’s refusal and Praye’s threats, as documented in the event transcript and sequence
          - >-
            Special marriage licence and telegram to vicar, as physical evidence of the orchestrated
            plan
        reader_observable: true
      - observation: >-
          Countess offers to pay Mary Pinder to leave and keep silent, attempting to plant the idea
          of escape and silence
        correction: >-
          Countess seeks to buy silence and secure her position, furthering the wrongful
          imprisonment and abduction
        effect: >-
          Shows Countess’s manipulative and controlling nature, and her orchestration of the event
          sequence
        required_evidence:
          - Countess’s conversation with Mary Pinder, as recorded in the event transcript
          - Mary Pinder’s refusal and recounting of truth, as documented in the event sequence
        reader_observable: true
      - observation: >-
          Michael Dorn rescues Lois and Mary after fire and confrontation, ending the sequence of
          abduction and detention
        correction: >-
          Dorn’s persistence leads to exposure and collapse of conspiracy, and the wrongful
          imprisonment is ended
        effect: Resolution of the case and liberation of victims, and the event sequence is completed
        required_evidence:
          - >-
            Fire at Gallows Farm and escape, as documented in the event records and physical traces
            of detention
          - >-
            Confrontation with Chesney Praye and Countess, as recorded in the event transcript and
            sequence
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Michael Dorn reenacts the sequence of events leading to the abduction and detention of Lois
      and Mary, including the discovery of the electrified book safe and the timing of the poisoned
      chocolates. He verifies the presence and movements of the Countess, Chesney Praye, and Dr.
      Tappatt at critical times and locations. The test includes checking the physical evidence such
      as the scar, the locked rooms, and the intercepted letters.
    knowledge_revealed: >-
      This reenactment confirms the Countess’s orchestration of the wrongful imprisonment and
      attempts on Lois’s life, and the complicity of Chesney Praye and Dr. Tappatt in detaining the
      victims.
    pass_condition: >-
      The reenactment must demonstrate that only the Countess and her accomplices had the
      opportunity and means to carry out the conspiracy, and that the physical evidence aligns with
      their involvement.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is provided with detailed accounts of the key characters’ movements, the discovery
      of the scar, the poisoned chocolates, and the locked safe disguised as a book. The testimony
      of witnesses, the timeline of letters and telegrams, and the detective’s observations are all
      presented transparently. The false solution accusing Lois is clearly refuted by evidence
      accessible to the reader. The clues about the Countess’s motives and the roles of Chesney
      Praye and Dr. Tappatt are embedded in dialogue and narrative, allowing an attentive reader to
      deduce the true conspiracy.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
