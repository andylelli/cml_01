  culpability:
    culprit_count: 1
    culprits:
      - Victoria Ashcroft Corbin
  surface_model:
    narrative:
      summary: >-
        The Corbin family is thrown into turmoil when the famous family necklace is reported stolen
        from a supposedly locked safe. An imitation necklace is returned mysteriously, and
        suspicions arise among family members and guests, with accusations flying and a secret
        elopement complicating matters.
    accepted_facts:
      - The necklace was stolen from the safe at The Oaks
      - An imitation necklace was returned to the grandmother's room
      - Punch Corbin saw a man in pajamas moving in the house at night
      - Judy Corbin eloped with Bill Grant and planned to marry him secretly
    inferred_conclusions:
      - Victoria Ashcroft Corbin was innocent and only worried about the family
      - Bill Grant was the thief who stole the necklace
      - Bruce Applebury was unaware of the necklace's true status and innocent
  hidden_model:
    mechanism:
      description: >-
        Victoria Ashcroft Corbin, facing financial difficulties, had the real necklace pawned and
        secretly replaced it with a perfect imitation. The thief, Raglan, hired as a window shade
        hanger, hid in the house in pajamas and stole the imitation necklace from the safe during a
        moment when the house was distracted. Upon discovering it was a fake, he returned it to the
        grandmother's room to mislead the family and avoid suspicion. The real necklace was kept by
        Bruce Applebury, who was unaware of the substitution.
      delivery_path:
        - step: Victoria arranges for an imitation necklace to be made and pawns the real one
        - step: Raglan is hired to work in the house and conceals himself in a trunk room
        - step: During a lunch break, Raglan steals the imitation necklace from the unlocked safe
        - step: Raglan discovers the necklace is fake and returns it to the grandmother's room
        - step: Bruce Applebury retrieves the real necklace from the bank and keeps it
        - step: Judy and Bill Grant elope and plan to marry secretly to avoid scandal
        - step: The family confronts the situation leading to the exposure of Raglan and resolution
    outcome:
      result: >-
        The real necklace is recovered, the thief Raglan is caught, and Judy marries Bill Grant with
        the family's reluctant blessing.
  false_assumption:
    statement: The necklace was stolen by an insider during the wedding preparations.
    type: identity
    why_it_seems_reasonable: >-
      Multiple family members had access and motives, and the safe was found unlocked. Suspicious
      behavior by family members and guests suggested an inside job.
    what_it_hides: >-
      The actual thief was an outsider hiding in the house, and the real necklace had been pawned
      and replaced with an imitation.
  false_solution:
    accused_suspect: Bill Grant
    supporting_points:
      - Bill was seen entering Bruce's room at night
      - He eloped with Judy unexpectedly
      - He avoided discussing the necklace openly
      - He was in a hurry to get a marriage license
    the_one_flaw: Bill had no motive to steal and was trusted by Judy; the real thief was an outsider
    refuted_in_chapter: 16
  red_herrings:
    - id: bill_grant_suspicion
      description: >-
        Bill Grant's secretive behavior and elopement with Judy suggested he might have stolen the
        necklace.
      points_at_suspect: Bill Grant
      innocent_explanation: >-
        Bill was protecting Judy and had no motive to steal; he was helping her escape an unwanted
        marriage.
      resolved_in_chapter: 16
    - id: bruce_applebury_accusation
      description: Bruce Applebury accused his cousin Bill Grant of stealing the necklace, fueling suspicion.
      points_at_suspect: Bill Grant
      innocent_explanation: >-
        Bruce's accusation was driven by anger and misunderstanding; the necklace was stolen by
        Raglan.
      resolved_in_chapter: 16
  closed_circle:
    suspects:
      - Victoria Ashcroft Corbin
      - Bruce Applebury
      - Bill Grant
      - Alexander Corbin (Uncle Alec)
      - Miss Digby
      - Raglan
    rationale: >-
      All these individuals had access to the house and the necklace during the relevant times, and
      the mystery was confined to the household and its immediate guests.
  constraint_space:
    time:
      anchors:
        - Wednesday afternoon when Mrs. Corbin showed the necklace
        - Thursday afternoon when the imitation necklace was stolen
        - Night of the theft and return of the imitation necklace
        - Early morning when Judy and Bill eloped
        - Morning of the wedding day when the real necklace was stolen from Bruce
      windows:
        - Lunch hour Thursday when servants were away
        - Night hours when guests were asleep
        - Morning before dawn when Judy and Bill left
    access:
      actors:
        - Victoria Ashcroft Corbin
        - Raglan
        - Bruce Applebury
        - Bill Grant
        - Punch Corbin
        - Miss Digby
      objects:
        - The safe in grandmother's sitting room
        - Grandmother's room
        - Bruce Applebury's room
        - Trunk closet on the top floor
        - The imitation necklace
        - The real necklace
    social:
      trust_channels:
        - Victoria's authority over the necklace
        - Punch's trustworthiness as guardian
        - Mr. Smith's expert opinion
        - Family relations and social expectations
      authority_sources:
        - Mrs. Corbin as family matriarch
        - Victoria as mother and daughter-in-law
        - Alexander Corbin as family elder
        - Mr. Smith as expert jeweler
  inference_path:
    steps:
      - observation: The safe was found unlocked when Punch opened it.
        correction: Mrs. Corbin had forgotten to lock the safe.
        effect: The necklace could have been taken without forced entry.
        required_evidence:
          - Punch's observation of the unlocked safe door
          - Mrs. Corbin's admission of forgetting to lock the safe
        reader_observable: true
      - observation: The imitation necklace was returned to the grandmother's room.
        correction: The thief realized the necklace was fake and returned it.
        effect: The returned necklace was a decoy to mislead the family.
        required_evidence:
          - The empty morocco box found by Judy and Punch
          - The imitation necklace found on the dressing table after the theft
        reader_observable: true
      - observation: Punch saw a man in pajamas moving in the house at night.
        correction: The man was Raglan, the thief hiding in the house.
        effect: The thief used pajamas to move unnoticed among guests.
        required_evidence:
          - Punch's witness statement of the man in pajamas
          - Lavender silk pajamas with a big nail tear found in the trunk closet
        reader_observable: true
      - observation: Bruce Applebury had the real necklace in his pocket.
        correction: Bruce was entrusted with the real necklace for safekeeping.
        effect: The real necklace was not stolen from the safe but kept by Bruce.
        required_evidence:
          - Bruce's testimony about retrieving the necklace from the bank
          - Judy's note left for Bruce about keeping the necklace
        reader_observable: true
      - observation: Victoria had financial troubles and pawned the necklace.
        correction: Victoria orchestrated the substitution to hide the pawned necklace.
        effect: Victoria is the mastermind behind the substitution and theft.
        required_evidence:
          - Pawn ticket for the real necklace found in Victoria's desk
          - Bank documents or notes about the pawn transaction
        reader_observable: true
      - observation: Judy and Bill eloped and planned to marry secretly.
        correction: Their elopement was to avoid scandal and family conflict.
        effect: Judy's behavior was motivated by family pressures, not theft.
        required_evidence:
          - Judy's note to her mother and Bruce hidden in the Chinese vase
          - Marriage license application filed by Judy and Bill on the morning after the theft
        reader_observable: true
      - observation: Raglan confessed and returned the real necklace.
        correction: Raglan was caught hiding in the house and surrendered.
        effect: The theft was solved by uncovering the outsider thief.
        required_evidence:
          - Lavender silk pajamas with a big nail tear found in the trunk closet
          - The real necklace recovered from Raglan's hiding place in the trunk closet
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Recreate the timeline of the necklace's disappearance and return by tracking the movements of
      all suspects and witnesses during the critical hours. Verify the presence of the man in
      pajamas and the accessibility of the safe and rooms. Confirm the identity of the pajamas and
      the hiding place of the thief.
    knowledge_revealed: >-
      This test reveals that only an outsider disguised in pajamas could have stolen and returned
      the imitation necklace without detection, and that the real necklace was pawned and kept by
      Bruce.
    pass_condition: >-
      The test passes if the pajamas with the tear are matched to Raglan and the safe's access times
      align with his presence, excluding all family members as the thief.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed accounts of the necklace's whereabouts, the characters'
      movements, and the discovery of the pajamas with the tear. Punch's observations and Mr.
      Smith's expert analysis provide clues to the thief's identity. The false accusations and red
      herrings are clearly presented and later refuted, allowing the attentive reader to deduce the
      true mechanism.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
