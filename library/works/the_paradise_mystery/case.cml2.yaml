CML_VERSION: 2
CASE:
  meta:
    title: The Paradise Mystery
    author: J. S. (Joseph Smith) Fletcher
    license: Public domain (first published 1920; author died 1935). Project Gutenberg ebook 5308.
    era:
      decade: 1890s
      realism_constraints:
        - No modern forensic DNA or electronic surveillance available
        - Travel and communication limited to trains, telegrams, and letters
        - Medical knowledge includes poisons like hydrocyanic acid but no advanced toxicology
    setting:
      location: Wrychester, England, centered around the Cathedral Close and Paradise
      institution: Wrychester Police, with involvement of New Scotland Yard detective
    crime_class:
      category: murder
      subtype: hidden revenge and secret inheritance
  cast:
