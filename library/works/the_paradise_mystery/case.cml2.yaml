      private_secret: knows true parentage of Mary and Dick and the real murderers
      motive_seed: protect his wards and seek justice
      motive_strength: strong
      alibi_window: present at various times, including away on council business
      access_plausibility: high
      opportunity_channels:
        - access to Collishaw's house
        - presence near Cathedral
      behavioral_tells:
        - agitation at discovery
        - vehement denial of guilt
      stakes: high - reputation, guardianship, justice
      evidence_sensitivity:
