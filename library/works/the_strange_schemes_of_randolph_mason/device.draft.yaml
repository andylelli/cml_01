pattern_id: the_strange_schemes_of_randolph_mason
title: The Vanished Corpse
family: identity
axes:
  - authority
principle: >-
  The law requires direct proof of death or criminal violence, which is absent due to the missing
  body. This legal technicality prevents conviction despite the circumstantial evidence.
principleType: physical_law
surface_illusion_template: >-
  the culprit must be guilty because of the blood evidence and his despair.; The victim is dead
  despite the absence of a body.; The disappearance of the body was a deliberate act to evade
  justice.
underlying_reality_template: >-
  the culprit murdered the victim by stabbing her with a knife, then dismembered her body in the
  bath-room using acid and heat to dissolve the remains completely. He carefully removed all traces
  of the body and evidence, including disposing of the acid and cleaning the scene, thus preventing
  discovery of the corpse and direct proof of death.
feasibility:
  eras:
