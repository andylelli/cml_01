  culpability:
    culprit_count: 2
    culprits:
      - Joan Caborn
      - George Caborn
  surface_model:
    narrative:
      summary: >-
        A secret service chief, Seton Darville, uncovers a plot by the Caborns to sabotage the Forth
        Bridge using explosives hidden in hot-water bottles. Meanwhile, his love interest, Edris
        Temperley, is secretly engaged to his friend and rival Karl Weiss, who is also involved in
        espionage. The case appears to be a mix of espionage, betrayal, and personal deception.
    accepted_facts:
      - Joan and George Caborn are enemy agents plotting sabotage
      - Explosives were found attached to the Forth Bridge
      - Edris Temperley is engaged to Karl Weiss while pretending to love Darville
      - Karl Weiss has been offered a secret mission to Russia by the British Secret Service
    inferred_conclusions:
      - Edris truly loves Karl Weiss and has betrayed Darville willingly
      - The Caborns planned to destroy the Forth Bridge successfully
      - Karl Weiss is a loyal friend to Darville and not a threat
  hidden_model:
    mechanism:
      description: >-
        The Caborns attempted to destroy the Forth Bridge by attaching liquid explosives concealed
        in rubber hot-water bottles connected to electrical detonators. Seton Darville secretly
        disabled the detonators by placing paper discs under the electrical terminals, preventing
        the circuit from completing. Meanwhile, Darville orchestrated a trap by offering Karl Weiss
        a secret mission to Russia, effectively removing him as a rival and neutralizing the
        espionage threat.
      delivery_path:
        - step: Caborns place explosive-filled hot-water bottles on bridge piers
        - step: Electrical detonators connected to the explosives are prepared
        - step: >-
            Darville secretly visits the Caborns' house and disables detonators by blocking
            electrical contacts
        - step: Authorities monitor and intercept the Caborns as they attempt to flee by motor boat
        - step: A gunfight ensues and the explosives detonate prematurely, destroying the boat
        - step: Darville arranges for Karl Weiss to be employed on a secret mission to Russia
        - step: Karl Weiss departs, removing the espionage threat from England
    outcome:
      result: >-
        The Forth Bridge is saved from destruction, the Caborns are killed, and Karl Weiss is sent
        on a secret mission to Russia, ending the espionage threat.
  false_assumption:
    statement: Edris Temperley truly loves Seton Darville and is faithful to him.
    type: behavioral
    why_it_seems_reasonable: >-
      Edris repeatedly professes love and affection to Darville, and publicly behaves as his devoted
      lover. Her actions and words create a convincing appearance of loyalty.
    what_it_hides: >-
      Edris is secretly engaged to Karl Weiss and deceives Darville with false professions of love,
      betraying him emotionally and romantically.
  false_solution:
    accused_suspect: Edris Temperley
    supporting_points:
      - She is seen frequently with Karl Weiss, raising suspicion
      - Her letters to Karl reveal engagement and affection
      - Darville's jealousy and suspicions point to her betrayal
      - Her behavior is inconsistent and evasive
    the_one_flaw: >-
      Edris is a victim of Karl Weiss's manipulation and her actions are influenced by his coercion
      and fascination, not solely by her own volition
    refuted_in_chapter: 28
  red_herrings:
    - id: joan_caborn_telegram
      description: Joan Caborn's sudden departure from Corfu with a telegram claiming urgent business
      points_at_suspect: Joan Caborn
      innocent_explanation: The telegram was fabricated to mislead pursuers and cover her espionage activities
      resolved_in_chapter: 6
    - id: karl_weiss_charm
      description: Karl Weiss's charm and apparent friendship with Darville and Edris
      points_at_suspect: Karl Weiss
      innocent_explanation: His charm masks his true intentions as a rival and enemy agent
      resolved_in_chapter: 27
  closed_circle:
    suspects:
      - Joan Caborn
      - George Caborn
      - Karl Weiss
      - Edris Temperley
    rationale: >-
      All suspects are closely connected by relationships and movements, with no outsiders involved;
      the espionage and sabotage plot is contained within this group.
  constraint_space:
    time:
      anchors:
        - midnight explosion under Forth Bridge
        - Karl Weiss's arrival in London on Wednesday
        - Edris's letters dated daily
      windows:
        - Caborns' presence at Strathnairn Road house
        - Edris and Karl's meetings in Switzerland and London
    access:
