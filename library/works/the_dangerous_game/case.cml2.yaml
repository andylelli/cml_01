        - Special Branch Scotland Yard
        - Prime Minister's office
  inference_path:
    steps:
      - observation: Explosives found attached to Forth Bridge piers with electrical terminals
        correction: Terminals could be disabled by blocking electrical contact
        effect: Explosives would not detonate as planned
        required_evidence:
          - Hot-water bottles with electrical terminals found in Caborns' house
          - Paper discs glued under electrical terminal caps discovered by Darville
        reader_observable: true
      - observation: Joan Caborn left Corfu suddenly claiming urgent telegram
        correction: No telegram was received at hotel concierge
        effect: Departure was a ruse to mislead pursuers
        required_evidence:
          - Concierge's telegram register showing no telegram for Caborn
          - Surveillance reports of Caborns' movements
        reader_observable: true
      - observation: Edris Temperley professes love to Darville but is often with Karl Weiss
        correction: Edris is secretly engaged to Karl Weiss and deceives Darville
        effect: Darville's trust in Edris is misplaced
        required_evidence:
          - Love letters from Edris to Karl Weiss intercepted and photographed
          - Surveillance reports of Edris and Karl's affectionate behavior
        reader_observable: true
      - observation: Karl Weiss accepted secret mission to Russia from British Secret Service
        correction: Mission is a trap to remove Karl from England
        effect: Karl is neutralized as a threat
        required_evidence:
          - Official appointment letter to Karl Weiss
          - Correspondence ordering Karl's mission and cancellation letter
        reader_observable: true
      - observation: Caborns attempted to flee by motor boat after attaching explosives
        correction: Authorities intercepted and engaged them in gunfight
        effect: Boat exploded prematurely, killing Caborns
        required_evidence:
          - Witness statements of gunfight and explosion
          - Reports of motor boat wreckage and no survivors
        reader_observable: true
      - observation: Edris's letters to Karl contain disparaging remarks about Darville
        correction: Edris's affection for Darville is false or coerced
        effect: Emotional betrayal confirmed
        required_evidence:
          - Photographed letters with insults to Darville
          - Surveillance reports of Edris's secret meetings with Karl
        reader_observable: true
      - observation: Darville's secret service intercepts and monitors correspondence
        correction: Enables him to uncover betrayal and espionage plot
        effect: Darville gains advantage and sets trap
        required_evidence:
          - Orders to copy and photograph correspondence
          - Reports from Bennett and Forbes on intercepted letters
        reader_observable: true
  discriminating_test:
    method: constraint_proof
    design: >-
      Darville disables the electrical detonators by placing paper discs under the brass screw caps
      of the terminals, preventing the circuit from completing. The test is to observe if the
      explosives detonate when the circuit is triggered. If no detonation occurs, the sabotage
      attempt is foiled and the mechanism is proven.
    knowledge_revealed: >-
      This test reveals that the explosives cannot be detonated remotely due to the disabled
      electrical contacts, confirming the sabotage was neutralized.
    pass_condition: >-
      The explosives fail to detonate when the circuit is activated, proving the sabotage mechanism
      was disabled.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the explosives, the electrical terminals, and
      Darville's secret visit to the Caborns' house where he disables the detonators. The
      intercepted letters and surveillance reports provide clues to the true relationships and
      betrayals. The narrative includes Darville's suspicions and actions, allowing attentive
      readers to piece together the espionage plot and the mechanism of sabotage before the final
      reveal.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
