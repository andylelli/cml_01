    time:
      anchors:
        - January 15th, night of murder
        - January 22nd, morning tide heard by Kinloch
        - March 22nd, last known shelter date
        - April 3rd, Dr. Dunn leaves for Gart
        - April 26th, last meeting with Kinloch
      windows:
        - Murder occurred late night January 15th
        - Kinloch hidden from January 15th to March 22nd
        - Investigation active from January to April
    access:
      actors:
        - Sir Stephen Wye
        - Lady Wye
        - Alexander David Kinloch
        - Francis McNab
        - Inspector Snargrove
      objects:
        - Ponsonby Paget's house
        - walking-stick
        - car 'Plain Jane'
        - Selwyn & Smith offices
        - Stelling Minnis village house
    social:
      trust_channels:
        - Dr. Dunn's medical testimony
        - James Brown's butler testimony
        - Mrs. Spedding's gossip
        - Constable Howley's witness account
      authority_sources:
        - New Scotland Yard
        - Private enquiry agent Francis McNab
        - Dr. Peter Dunn
        - Inspector Snargrove
  inference_path:
    steps:
      - observation: >-
          Walking-stick found at murder scene had wear across heel, not sides, which is unusual for
          a lame man but typical for a blind man using it to feel his way in public places such as a
          garden in London.
        correction: >-
          Walking-stick wear indicates use in darkness, consistent with blind man's use and not a
          lame man's.
        effect: Murderer not lame; walking-stick belongs to Kinloch.
        required_evidence:
          - >-
            Walking-stick with sole bevelled across heel, found in the public garden in London where
            Kinloch was expected to wait.
          - >-
            Dr. Dunn's testimony on Kinloch's blindness and use of stick, confirming Kinloch's
            identity as the blind man.
        reader_observable: true
      - observation: >-
          Fingerprints on broken glass at scene were compared to those of Dick Hollins, a suspected
          impostor, to reveal whether the woman who visited Kinloch in the public garden was
          involved.
        correction: Fingerprints do not match suspect Dick Hollins, who was a red herring.
        effect: Fingerprints likely belong to murderer, not Kinloch or Hollins.
        required_evidence:
          - >-
            Fingerprint analysis from Scotland Yard, confirming the identity of the person present
            at the scene.
          - Comparison of fingerprints taken from Dick Hollins, revealing he was not involved.
        reader_observable: true
      - observation: >-
          Kinloch was blind but later regained sight after surgery, which was not public knowledge
          and thus prevented exposure of the murderer's political ambition.
        correction: Murderers unaware of Kinloch's regained sight, increasing his danger.
        effect: Kinloch becomes a threat to murderer and target for elimination.
        required_evidence:
          - Dr. Dunn's statement on Kinloch's eye operation, confirming the timing and recovery.
          - >-
            McNab's report of Kinloch's regained sight, revealing Kinloch's new ability to identify
            the woman.
        reader_observable: true
      - observation: >-
          Lady Wye fainted near Kinloch and was emotionally involved, and her visits to the public
          garden in London were expected to reveal her identity and confirm her role.
        correction: Lady Wye is protecting Kinloch and involved in concealment.
        effect: Lady Wye is an accomplice but not the murderer.
        required_evidence:
          - Constable Howley's witness statement about Lady Wye's behavior in the public garden.
          - >-
            Mrs. Spedding's gossip and observations about the woman visiting Kinloch, confirming her
            identity.
        reader_observable: true
      - observation: >-
          Sir Stephen Wye had an alibi of being at home, but the timing of his movements and access
          records in London public spaces contradict his story and reveal his attempt to prevent
          exposure of his political ambition.
        correction: Alibi was staged; he left house secretly to commit murder.
        effect: Sir Stephen Wye is the murderer despite alibi.
        required_evidence:
          - >-
            Butler James Brown's testimony about Sir Stephen's absence from home at the relevant
            time.
          - >-
            Inspector Snargrove's investigation of alibi and access records in London, confirming
            the contradiction.
        reader_observable: true
      - observation: >-
          Murderer left no footprints on brick path but car tracks with embedded cartridge were
          found, and the car was seen leaving a public garden in London, which was not expected by
          the police.
        correction: Murderer escaped by car with solid rubber tyres, no hoof marks.
        effect: Car tracks help locate murderer's escape route.
        required_evidence:
          - McNab's observation of wheel marks on driveway and in the public garden in London.
          - Brass cap of cartridge embedded in tyre tread, confirming the car's identity.
        reader_observable: true
      - observation: >-
          Kinloch was forcibly removed from murder scene and hidden in a remote village, but his
          dialect and knowledge of London public gardens revealed his location and confirmed the
          woman's involvement.
        correction: Kinloch was taken to remote village to hide him.
        effect: Kinloch's location discovered through dialect and local names.
        required_evidence:
          - >-
            Mrs. Spedding's gossip about local names and the woman who visited Kinloch in the public
            garden.
          - >-
            Kinloch's recognition of dialect words and place names, confirming his identity and
            location.
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      Kinloch is placed in a public garden in London where he is expected to wait for the woman to
      come to him. Multiple watchers are placed around to observe any visitors. The test relies on
      the woman's need to contact Kinloch and the assumption she will come to the known location.
      The presence of watchers and the timing of visits are carefully controlled.
    knowledge_revealed: >-
      The test reveals the woman's identity and confirms Kinloch's location, allowing the police to
      capture the murderer and accomplices.
    pass_condition: >-
      The woman visits Kinloch at the designated location, confirming her involvement and enabling
      arrest.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the walking-stick wear, the fingerprints, the
      dialect clues, and the timeline of events. The false assumption about the walking-stick
      belonging to a lame man is explicitly challenged by McNab's logical analysis. The presence of
      Kinloch at the scene and his blindness are well established. The clues about the village and
      the woman's involvement are provided through Mrs. Spedding's gossip and Kinloch's
      observations. The reader could deduce the murderer's identity by piecing together these clues
      and rejecting the false assumption about the walking-stick.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
