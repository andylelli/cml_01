  inference_path:
    steps:
      - observation: Veiled woman seen walking through locked doors
        correction: Secret passages and hidden doors exist in the house
        effect: Explains how the woman could enter and exit locked rooms
        required_evidence:
          - Garth's observation of secret door behind curtain in Alsop's house
          - Testimony of Alsop and Marvin about locked doors and veiled woman
        reader_observable: true
      - observation: Taylor's death appears as suicide with a note
        correction: Note was written before death to mislead
        effect: Suggests murder disguised as suicide
        required_evidence:
          - Handwriting analysis of note matching Taylor's
          - Presence of black gown and knife near body
        reader_observable: true
      - observation: Brown attacked after seeing veiled woman
        correction: Attack was to silence a witness to the conspiracy
        effect: Confirms veiled woman is part of criminal gang
        required_evidence:
          - Brown's hospital testimony mentioning veiled woman
          - Discovery of dictaphone in Alsop's house
        reader_observable: true
      - observation: Nora disappears in empty house
        correction: She entered through hidden door and was captured
        effect: Shows gang's awareness and trap for Nora
        required_evidence:
          - Inspector's observation of Nora entering empty house
          - Garth's discovery of hidden trap door
        reader_observable: true
      - observation: Slim and George escape custody
        correction: They kidnap Nora to use as leverage
        effect: Raises stakes and urgency for rescue
        required_evidence:
          - Tailor's eyewitness account of kidnapping
          - Pieces of Nora's muff dropped as trail
        reader_observable: true
      - observation: Veiled woman carries bomb to Alsop's house
        correction: Nora impersonates veiled woman to trap gang
        effect: Allows police to capture gang members
        required_evidence:
          - Nora's disguise and testimony
          - Police surrounding Alsop's house and ambush
        reader_observable: true
      - observation: Slim threatens to blind Garth with acid
        correction: Nora's plan uses staged train wreck to distract
        effect: Garth is saved and gang captured
        required_evidence:
          - Nora's testimony about acid bottle switch
          - Inspector's coordination of police during train incident
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      Nora disguises herself as the veiled woman and waits at the locked door with a bomb. Garth
      hides nearby to ambush the real veiled woman when she arrives to take the bomb. Police
      surround the house to arrest the gang members once the trap is sprung.
    knowledge_revealed: >-
      This test reveals that the veiled woman is a human criminal using disguises and secret
      passages, not a supernatural ghost.
    pass_condition: >-
      The real veiled woman is caught attempting to take the bomb, confirming her identity and
      method.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the locked rooms, secret doors, and the behavior
      of the veiled woman. Clues such as the black gown, the secret passages, and the testimonies of
      witnesses like Alsop and Marvin are presented. The trail of coins and the disguise used by
      Nora provide logical means to deduce the true nature of the veiled woman and the conspiracy.
      The supernatural explanation is a deliberate misdirection, but the physical evidence and
      character actions allow a careful reader to solve the mystery.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
