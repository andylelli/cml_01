principle: >-
  It hides the investigator true role as a vigilante thief who steals from the gang to recover
  stolen property and finance his efforts to make restitution.
principleType: social_logic
surface_illusion_template: >-
  the investigator is the burglar stealing jewels for personal gain.; Mrs. a witness is involved in
  the theft due to financial troubles.; The fourth man at the bank robbery is an independent
  criminal.
underlying_reality_template: >-
  the investigator, formerly a Foreign Office official, uses his knowledge of the gang's activities
  and the Stock Exchange to secretly recover stolen goods from the gang's safe. He exploits the
  gang's safe agency scheme, where safes are sold with keys allowing the gang access. the
  investigator takes money and jewels from the gang's safe to finance his investments, intending to
  restore the stolen property to rightful owners.
