  inference_path:
    steps:
      - observation: Victims showed puncture wounds typical of snake bites but no snake or dart was found.
        correction: The wounds were caused by tiny venom darts that melted after delivery.
        effect: Disproves natural snake attack theory.
        required_evidence:
          - Search of crime scenes showing no physical darts
          - Laboratory discovery of frozen venom dart moulds
        reader_observable: true
      - observation: Mirabelle Leicester was brought into Oberzohn’s laboratory under suspicious circumstances.
        correction: She was targeted due to her inheritance of a valuable gold concession.
        effect: Establishes motive for Oberzohn’s actions.
        required_evidence:
          - Letters and telegrams about concession renewal
          - Barberton’s letter describing gold find
        reader_observable: true
      - observation: Montague Newton died suddenly at the theatre with snake bite wounds.
        correction: He was assassinated using the same venom dart method.
        effect: Shows Monty was a victim, not culprit.
        required_evidence:
          - Medical examination of Monty’s wounds
          - Witness accounts of theatre events
        reader_observable: true
      - observation: Oberzohn’s factory and house contained many deadly snakes and venom extraction equipment.
        correction: Oberzohn used these to produce the venom for the darts.
        effect: Links Oberzohn to the murder weapon.
        required_evidence:
          - Discovery of venom extraction apparatus
          - Frozen venom darts moulds found in laboratory
        reader_observable: true
      - observation: Letters in Braille and documents reveal the gold concession’s value and renewal deadline.
        correction: Oberzohn’s motive was to prevent renewal by detaining Mirabelle.
        effect: Confirms financial motive.
        required_evidence:
          - Braille letters from Barberton
          - Official concession renewal documents
        reader_observable: true
      - observation: Elijah Washington survived a venom dart attack and is immune to snake venom.
        correction: His survival disproves natural snake bite and supports artificial venom use.
        effect: Supports venom dart theory.
        required_evidence:
          - Washington’s medical records
          - Witness testimony of attack
        reader_observable: true
      - observation: Oberzohn was found dead with symptoms of venom dart poisoning.
        correction: He was killed by his own venom darts during the final confrontation.
        effect: Ends Oberzohn’s threat and confirms method.
        required_evidence:
          - Autopsy report
          - Discovery of venom dart cigarette holder
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      The detectives recreated the venom delivery by using the hollow metal cigarette holders and
      frozen venom darts found in Oberzohn’s laboratory. They demonstrated that the darts could be
      blown from the holders, melt upon contact, and deliver lethal venom without leaving physical
      evidence. This reenactment was conducted under observation to confirm the feasibility of the
      murder method.
    knowledge_revealed: >-
      This test revealed that the murders were not caused by a real snake but by a sophisticated
      artificial venom delivery system using frozen darts.
    pass_condition: >-
      The darts must be shown to penetrate skin and deliver venom effectively while melting
      completely, leaving no trace of a dart.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the victims’ wounds, the laboratory equipment,
      and the suspicious behavior of Oberzohn and his gang. Clues such as the absence of physical
      darts, the presence of venom extraction apparatus, and the Braille letters about the gold
      concession are all presented. The method of frozen venom darts is hinted at through the
      discovery of moulds and the explanation of venom freezing. The reader could deduce the
      mechanism by connecting these clues logically.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
