  culpability:
    culprit_count: 1
    culprits:
      - Dr. Eruc Oberzohn
  surface_model:
    narrative:
      summary: >-
        A series of mysterious deaths in London are attributed to a deadly escaped snake, the black
        mamba. Mirabelle Leicester, heir to a valuable gold concession, is kidnapped and held
        captive by Dr. Oberzohn and his gang, who use a novel method of murder involving frozen
        snake venom darts concealed in cigarette holders. The Three Just Men and their allies
        investigate to uncover the truth.
    accepted_facts:
      - Victims died from snake bites with no physical evidence of a snake or dart
      - Mirabelle Leicester is heir to a gold concession in Angola
      - Dr. Oberzohn and his gang are involved in criminal activities
      - Montague Newton died suddenly at a theatre from a snake bite
    inferred_conclusions:
      - The snake is a real escaped black mamba responsible for the murders
      - Montague Newton was killed by the snake accidentally
      - Mirabelle Leicester’s kidnapping is unrelated to the murders
  hidden_model:
    mechanism:
      description: >-
        Dr. Oberzohn extracted venom from various deadly snakes and blended them to create a potent
        poison. He then froze the venom into tiny ice darts, which were concealed inside hollow
        metal cigarette holders used as blowpipes by his assassins. When blown, the darts melted
        upon contact, delivering lethal venom without leaving physical evidence, making the deaths
        appear as natural snake bites.
      delivery_path:
        - step: Venom extracted from snakes and blended by Oberzohn
        - step: Venom diluted and poured into microscopic moulds
        - step: Venom frozen into tiny ice darts
        - step: Darts concealed inside hollow metal cigarette holders
        - step: Assassins used cigarette holders as blowpipes to deliver darts
        - step: Darts melted upon contact, injecting venom without trace
        - step: Victims died from venomous bites with no physical dart evidence
    outcome:
      result: >-
        Dr. Oberzohn’s plot is exposed, he dies from his own venom darts, and Mirabelle’s gold
        concession is secured.
  false_assumption:
    statement: The deaths were caused by an escaped black mamba snake biting the victims.
    type: identity
    why_it_seems_reasonable: >-
      Victims showed puncture wounds typical of snake bites and the presence of a deadly escaped
      black mamba was reported in London. Eyewitnesses and medical opinions initially supported
      snake bite as cause of death.
    what_it_hides: >-
      The actual cause was a sophisticated murder method using frozen venom darts delivered via
      cigarette holders, not a real snake attack.
  false_solution:
    accused_suspect: Montague (Monty) Newton
    supporting_points:
      - Monty was present at key locations and had motive for financial gain
      - He was involved in suspicious activities and had conflicts with investigators
      - His sudden death at the theatre seemed suspicious
      - He had opportunity to harm Mirabelle and others
    the_one_flaw: Montague Newton was actually a victim of the venom dart assassination, not the perpetrator.
    refuted_in_chapter: 34
