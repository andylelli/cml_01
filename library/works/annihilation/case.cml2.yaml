  culpability:
    culprit_count: 1
    culprits:
      - Henry Orbit
  surface_model:
    narrative:
      summary: >-
        A valet named Hughes is found dead from poisoning in a wealthy gated community. Soon after,
        a boy named Horace Goddard disappears and a nursemaid named Lucette dies mysteriously from
        poison gas. The investigation reveals a complex plot involving exotic poisons and a
        secretive household.
    accepted_facts:
      - Alfred Hughes died from physostigmine (Calabar bean) poisoning.
      - Horace Goddard disappeared mysteriously from his home.
      - Lucette Guerin died from inhalation of a deadly poison gas.
      - Henry Orbit was found drugged and later committed suicide leaving a confession.
    inferred_conclusions:
      - The murders and disappearance were unrelated random crimes.
      - The poison gas was accidentally released in Orbit’s conservatory.
      - The kidnappers of Horace Goddard were external criminals unknown to the household.
  hidden_model:
    mechanism:
      description: >-
        Henry Orbit, descended from a criminal lineage, deliberately poisoned his valet Hughes with
        Calabar bean dissolved in a drink and sent him on an errand to a distant part of town where
        he collapsed and died. He then drugged Horace Goddard with luminal in milk, carried him to
        his cellar, and buried him under coal. Lucette was murdered by poison gas released from a
        toy balloon filled with a secret formula gas purchased from a local vendor. Orbit planned
        his own annihilation using hydrofluoric acid but was discovered and cornered.
      delivery_path:
        - step: Orbit poisons Hughes with Calabar bean in a drink and sends him out.
        - step: Hughes collapses and dies near the waterfront.
        - step: Orbit drugs Horace Goddard with luminal in milk and buries him under coal in cellar.
        - step: >-
            Orbit fills a toy balloon with poison gas purchased from a local vendor and gives it to
            Lucette’s charge; balloon bursts killing Lucette.
        - step: Orbit chloroforms himself to fake unconsciousness and evade suspicion.
        - step: Orbit rigs a revolver trap to kill McCarty but fails.
        - step: Orbit escapes to his laboratory and commits suicide by hydrofluoric acid.
    outcome:
      result: >-
        Henry Orbit is arrested but commits suicide by hydrofluoric acid, ending the crime spree and
        revealing the full extent of his murders and plans.
  false_assumption:
    statement: The murders and disappearance were unrelated and caused by different criminals.
    type: identity
    why_it_seems_reasonable: >-
      The victims belonged to different households and the crimes appeared distinct in method and
      timing. The presence of multiple suspects and unrelated motives suggested separate culprits.
    what_it_hides: >-
      It conceals that all crimes were orchestrated by a single mastermind, Henry Orbit, who used
      his household access and knowledge to commit multiple murders and a kidnapping.
  false_solution:
    accused_suspect: Otto Lindholm
    supporting_points:
      - Otto had a quarrel with Hughes and threatened him.
      - Otto fled suddenly after the investigation began.
      - Otto was seen near Hughes when he was ill.
      - Otto’s suspicious behavior suggested guilt.
    the_one_flaw: >-
      Otto lacked the knowledge, opportunity, and motive to commit the complex poisonings and
      disappearance; his flight was due to fear, not guilt.
    refuted_in_chapter: 18
  red_herrings:
    - id: otto_lindholm_quarrel
      description: >-
        Otto Lindholm, the Swedish nurse, threatened Hughes and fled the Mall suddenly, suggesting
        possible involvement.
      points_at_suspect: Otto’s quarrel and sudden disappearance raised suspicion.
      innocent_explanation: Otto fled out of fear and domestic troubles unrelated to the murders.
      resolved_in_chapter: 18
    - id: chinese_butler_ching_lee
      description: >-
        Ching Lee, the Chinese butler, was hostile to Hughes and acted suspiciously, including a
        knife incident.
      points_at_suspect: His animosity and presence at key moments suggested possible guilt.
      innocent_explanation: Ching Lee was protecting his nephew and feared false accusation due to racial prejudice.
      resolved_in_chapter: 22
  closed_circle:
    suspects:
      - Henry Orbit
      - Otto Lindholm
      - Ching Lee
      - Chris Porter
      - Snape
    rationale: >-
      The crime took place within the gated New Queen’s Mall with strict access control; only
      residents and their servants had plausible access to the victims and crime scenes.
  constraint_space:
    time:
      anchors:
        - Hughes last seen before 7 PM
        - Hughes died around 9 PM
        - Horace disappeared Tuesday afternoon
        - Lucette died Wednesday afternoon
        - Orbit chloroformed early morning Thursday
        - Orbit’s suicide Friday night
      windows:
        - Hughes’ poisoning and death between 7 PM and 9 PM
        - Horace’s disappearance Tuesday afternoon
        - Lucette’s death Wednesday afternoon
        - Orbit’s chloroform attack early Thursday morning
    access:
      actors:
        - Henry Orbit
        - Alfred Hughes
        - Ching Lee
        - Fu Moy
        - Jean
        - André
        - Snape
        - Chris Porter
        - Otto Lindholm
      objects:
        - New Queen’s Mall gates
        - Orbit’s house and laboratory
        - Goddard house and cellar
        - Bellamy conservatory
        - Parsons house
    social:
      trust_channels:
        - Servants’ loyalty and knowledge
        - Neighbors’ observations
        - Police inspector and deputies
        - Medical examiner’s reports
      authority_sources:
        - New York Police Department
        - Inspector Druet
        - Medical examiner
        - Benjamin Parsons (philanthropist and employer)
  inference_path:
    steps:
      - observation: Hughes died suddenly with no visible marks but showed symptoms of poisoning.
        correction: Autopsy confirmed physostigmine (Calabar bean) poisoning.
        effect: Murder by poison suspected.
        required_evidence:
          - Medical examiner’s autopsy report on Alfred Hughes
          - Witness statement of Officer Terrence Keenan about Hughes’ collapse
        reader_observable: true
      - observation: Horace Goddard disappeared without leaving the gated Mall.
        correction: His crushed watch found near a side door and coal chute order timing.
        effect: Horace was kidnapped and likely killed within the Mall.
        required_evidence:
          - Shattered platinum watch found at Goddard house side door
          - Coal delivery records and timing at Orbit’s house
        reader_observable: true
      - observation: Lucette died suddenly in Orbit’s conservatory with windows open.
        correction: Medical examiner diagnosed death by inhalation of poison gas.
        effect: Murder by poison gas confirmed.
        required_evidence:
          - Medical examiner’s report on Lucette’s death
          - Witness testimony of Henry Orbit and servants about conservatory
        reader_observable: true
      - observation: Orbit was found drugged with chloroform but no signs of forced entry.
        correction: Orbit chloroformed himself to fake unconsciousness and mislead investigators.
        effect: Orbit’s deception revealed.
        required_evidence:
          - Chloroform bottle and towel found in Orbit’s bedroom
          - Witness testimony of McCarty and Dennis about entry and chloroform
        reader_observable: true
      - observation: A revolver trap was set to kill McCarty in Orbit’s house.
        correction: McCarty discovered and disarmed the trap before it fired.
        effect: Orbit’s attempt to kill McCarty failed.
        required_evidence:
          - Disarmed revolver trap found behind mantelpiece
          - McCarty’s testimony about the trap and shot fired
        reader_observable: true
      - observation: >-
          Orbit’s laboratory contained poison gas apparatus, hydrofluoric acid vat, and evidence of
          balloon purchases from a local vendor.
        correction: >-
          Orbit used hydrofluoric acid to commit suicide, destroying his body, and the toy balloons
          purchased from the local vendor were used to deliver poison gas.
        effect: Orbit’s planned annihilation and the murder method for Lucette confirmed.
        required_evidence:
          - >-
            Hydrofluoric acid vat and lead-lined laboratory with balloon fragments and vendor’s
            receipt for toy balloons
          - Vendor’s statement about Orbit purchasing toy balloons and chemical supplies
        reader_observable: true
      - observation: >-
          Diary entries revealed motives, methods, and sequence of murders, including details of
          criminal lineage and use of his valet in the plot.
        correction: >-
          Diary confirmed Orbit’s guilt, detailed his crimes and plans, and described his descent
          from a criminal lineage and the use of his valet in the murders.
        effect: Complete confession and case closure.
        required_evidence:
          - >-
            Diary found in false bottom of Orbit’s desk drawer describing criminal lineage and
            valet’s involvement
          - Vendor’s logbook showing repeated balloon purchases by Orbit
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      McCarty and Dennis set a trap by purchasing and testing toy balloons from the local vendor,
      checking for poison gas presence by observing color changes and testing gas release. They also
      monitored the balloons for suspicious handling and disappearance to confirm the delivery
      method of poison gas.
    knowledge_revealed: >-
      This test revealed that the poison gas was delivered via toy balloons filled with a deadly gas
      that changed color and decomposed over time, confirming the murder method used on Lucette.
    pass_condition: >-
      Detection of color change and decomposition in the balloon rubber, and confirmation that the
      balloons contained poison gas.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the victims’ symptoms, the poison used, the
      locked nature of the Mall, and the suspicious behaviors of Henry Orbit and others. Clues such
      as the key-ring tag, the diary, the poison gas balloon, and the coal chute are all presented.
      The reader could have deduced Orbit’s guilt by connecting the poisonings, the disappearance,
      and the laboratory evidence, as well as the diary and the final confession.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
