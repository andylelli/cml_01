  inference_path:
    steps:
      - observation: >-
          Wireless broadcast contained a voice resembling Ella Bennett and appeared to reveal a new
          crime.
        correction: >-
          Voice was an imitation by Lola Bassano, and the broadcast was orchestrated to mislead
          investigators.
        effect: >-
          Ella Bennett is innocent of broadcasting Frog messages and the crime was staged to create
          confusion.
        required_evidence:
          - >-
            Wireless telephone message recorded at Caverley House, which was analyzed for voice
            characteristics and revealed the imitation.
          - >-
            Witness statement of Lola Bassano about voice imitation and her role in the broadcast to
            orchestrate the deception.
        reader_observable: true
      - observation: Ray Bennett was sentenced to death for murder and widely believed to be the murderer.
        correction: >-
          Ray was framed by the Frogs and is innocent; the real murderer orchestrated the crime to
          implicate him.
        effect: Ray Bennett is a victim, not the culprit, and the true murderer remains at large.
        required_evidence:
          - >-
            Motion picture showing the actual murder by another man, revealing the orchestrated
            nature of the crime.
          - >-
            Governor’s and Sheriff’s testimony at Gloucester Prison about Ray's conduct and
            timeline, which does not match the murderer's.
        reader_observable: true
      - observation: John Bennett’s absences coincide with burglaries and he is suspected to be the murderer.
        correction: >-
          Absences unrelated; John Bennett is not the Frog or murderer, and his actions were
          orchestrated by others.
        effect: John Bennett is not the criminal mastermind or murderer; suspicion was misdirected.
        required_evidence:
          - >-
            Alibi statements from policemen at Dorking and Kingbridge confirming John Bennett's
            whereabouts during the crimes.
          - >-
            John Bennett’s photographic hobby and travel records, which reveal no connection to the
            orchestrated crimes.
        reader_observable: true
      - observation: >-
          Balder’s escape and bomb attack on police office seemed to reveal him as the murderer and
          orchestrator.
        correction: >-
          Balder is a high-ranking Frog operative, but not the leader or murderer; his actions were
          orchestrated by the real mastermind.
        effect: Balder is an agent, not the mastermind or murderer; the true orchestrator remains hidden.
        required_evidence:
          - >-
            Explosion damage and police reports documenting Balder’s actions but not linking him to
            the murderer's identity.
          - >-
            Recovered wireless messages between Balder and the Frog, revealing he was following
            orders and not orchestrating the crime.
        reader_observable: true
      - observation: Tattoo marks on left wrist identify Frogs and are believed to reveal the murderer.
        correction: >-
          Some high-ranking Frogs are unmarked; the murderer and orchestrator concealed their
          identity.
        effect: >-
          Identification by tattoo is incomplete; the real murderer and orchestrator could evade
          detection.
        required_evidence:
          - >-
            Notes and orders signed by Number Seven, showing orchestrated crimes by unmarked
            members.
          - >-
            Observation of unmarked suspects like Philo Johnson, who played a role in orchestrating
            the crimes.
        reader_observable: true
      - observation: >-
          Joshua Broad is a harmless American peddler and not suspected as the murderer or
          orchestrator.
        correction: >-
          Joshua Broad is Saul Morris, the Frog mastermind and murderer, who orchestrated the crimes
          and framed others.
        effect: Broad is the real culprit; the orchestrator and murderer are revealed.
        required_evidence:
          - >-
            Evidence of Broad’s control over the Frogs, including intercepted wireless messages
            revealing his role as orchestrator and murderer.
          - >-
            A timeline of Broad's movements matching the orchestrated crimes and the murderer's
            presence at key events.
        reader_observable: true
      - observation: >-
          Maitland is a miserly, eccentric millionaire and suspected to be the murderer or
          orchestrator.
        correction: Maitland is a front man for the Frogs; the real murderer and orchestrator is someone else.
        effect: Maitland is a figurehead, not the leader, murderer, or orchestrator.
        required_evidence:
          - >-
            Maitland’s double life and secret meetings, which show he was manipulated by the
            orchestrator.
          - >-
            Johnson’s testimony and will leaving estate to Johnson, revealing Maitland's lack of
            control over the crimes.
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      A motion picture film was obtained showing the actual murder of Lew Brady by a man other than
      Ray Bennett. The film was shown to witnesses and officials to confirm the innocence of Ray
      Bennett and identify the true murderer. This test used visual evidence to distinguish the real
      killer from the framed suspect and revealed how the crime was orchestrated.
    knowledge_revealed: >-
      The film revealed that Ray Bennett was not the murderer and that the crime was orchestrated by
      the Frogs to frame him.
    pass_condition: >-
      The suspect shown in the film committing the murder is not Ray Bennett, disproving his guilt
      and revealing the orchestrator.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is provided with detailed accounts of the characters' movements, the timing of
      events, and the presence of key evidence such as wireless messages, tattoos, and the motion
      picture film. Clues about the true identity of the Frog and the framing of Ray Bennett are
      given through dialogue and observations. The false assumptions about Ray and John Bennett are
      challenged by alibis and contradictory evidence. The final confession and unmasking of Joshua
      Broad as the Frog are foreshadowed, allowing an attentive reader to solve the mystery.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
