  culpability:
    culprit_count: 2
    culprits:
      - Joshua Broad (Saul Morris)
      - Philo Johnson
  surface_model:
    narrative:
      summary: >-
        A secret society called the Frogs is responsible for a series of crimes including murder and
        theft. Ray Bennett, a young clerk, is framed and sentenced to death, while the true
        mastermind remains hidden. The investigation uncovers a complex web of deception involving
        wealthy financiers and criminal operatives.
    accepted_facts:
      - Ray Bennett is under sentence of death for murder.
      - The Frogs are a criminal organization with a secret leader.
      - Ezra Maitland and his sister were murdered.
      - Joshua Broad is an American peddler with mysterious connections.
    inferred_conclusions:
      - Ray Bennett is guilty of murder.
      - Ella Bennett is involved with the Frogs.
      - Ezra Maitland is the Frog leader.
  hidden_model:
    mechanism:
      description: >-
        Joshua Broad, the real Frog and criminal mastermind, controlled the Fellowship of the Frog
        using Philo Johnson as his front. They orchestrated crimes and framed Ray Bennett to protect
        their operations. The murder of Ezra Maitland was part of their scheme to maintain control
        and eliminate threats. The organization used secret wireless broadcasts and tattoos for
        communication and identification.
      delivery_path:
        - step: Joshua Broad established control over the Frogs using Philo Johnson as a front.
        - step: The Frogs committed crimes including burglary, murder, and blackmail.
        - step: Ray Bennett was recruited and later framed to divert suspicion.
        - step: Ezra Maitland was used as a figurehead and later murdered to silence him.
        - step: Wireless broadcasts were used to communicate orders and warnings.
        - step: Detectives infiltrated the organization and captured key members.
        - step: Joshua Broad killed Harry Lyme (the Frog) and revealed himself as the mastermind.
    outcome:
      result: >-
        Joshua Broad (Saul Morris) is revealed as the Frog and mastermind behind the crimes, leading
        to the dismantling of the Fellowship of the Frog.
  false_assumption:
    statement: Ray Bennett is guilty of murder and the primary criminal.
    type: identity
    why_it_seems_reasonable: >-
      Ray Bennett was found under sentence of death with circumstantial evidence and was involved
      with suspicious characters. His behavior and associations suggested guilt.
    what_it_hides: >-
      The true mastermind was Joshua Broad, who orchestrated the framing and crimes from behind the
      scenes, using others as scapegoats.
  false_solution:
    accused_suspect: John Bennett
    supporting_points:
      - John Bennett’s suspicious absences coincided with burglaries.
      - He was found near crime scenes and had a mysterious past.
      - He was seen interacting with key suspects and had a secretive nature.
      - His role as executioner suggested a dark side.
    the_one_flaw: >-
      John Bennett was not the mastermind and was manipulated by the real Frog; evidence against him
      was circumstantial and misinterpreted.
    refuted_in_chapter: 42
  red_herrings:
    - id: john_bennett_suspicious_absences
      description: >-
        John Bennett’s frequent unexplained absences coinciding with burglaries suggested he was
        involved in the crimes.
      points_at_suspect: John Bennett
      innocent_explanation: >-
        His absences were unrelated to the crimes and he was not the Frog; he was a victim of
        circumstance and manipulation.
      resolved_in_chapter: 42
    - id: ella_bennett_wireless_voice
      description: >-
        Wireless broadcasts with a voice resembling Ella Bennett’s suggested she was involved with
        the Frogs.
      points_at_suspect: Ella Bennett
      innocent_explanation: >-
        The voice was an imitation by Lola Bassano, a Frog operative; Ella was innocent and used as
        a cover.
      resolved_in_chapter: 40
  closed_circle:
    suspects:
      - John Bennett
      - Philo Johnson
      - Joshua Broad (Saul Morris)
      - Balder
      - Hagn
      - Lola Bassano
      - Lew Brady
    rationale: >-
      All suspects are connected to the Frogs organization and involved in the criminal activities;
      the circle is closed by their mutual knowledge and interactions.
  constraint_space:
    time:
      anchors:
        - Saturday night to Sunday morning (burglary)
        - Wednesday morning at 3:01 a.m. (wireless broadcast)
        - Execution scheduled Wednesday at 8 a.m.
        - Raid at Heron’s Club at 1:15 a.m.
        - Explosion at headquarters early morning
      windows:
        - Ray Bennett’s absences
        - Maitland’s visits to Horsham
        - Wireless broadcasts timing
        - Police raids and arrests
    access:
      actors:
