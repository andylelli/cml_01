pattern_id: dark_power
title: The Borrowed Face
family: identity
axes:
  - identity
principle: >-
  This assumption conceals the fact that the victim is actually dead and has been impersonated by a
  suspect, enabling the culprit to manipulate the inheritance and cover up the murder.
principleType: social_logic
surface_illusion_template: >-
  the victim was a thief who betrayed the victim and the family.; a suspect was the mastermind
  behind the robbery and disappearance.; the victim is alive and well, merely hiding in the house.
underlying_reality_template: >-
  the culprit orchestrates the concealment of the victim death by forcing a suspect to impersonate
  him in his room, while the culprit, under her influence, accidentally kills the victim in the
  woods. The imposture allows the culprit to manipulate the family, control the victim, and secure
  the inheritance, with the deaths and disappearances serving to maintain her scheme.
