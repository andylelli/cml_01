        - Assay office
        - Skunk's Misery lean-to and tunnels
        - Caraquet road
        - Lac Tremblant lake and ice
    social:
      trust_channels:
        - Nick Stretton and Paulette's trust
        - Collins and Dunn's secret alliance
        - Baker's loyalty to Dudley
        - Charliet's role as cook and ally
      authority_sources:
        - Dudley Wilbraham as mine owner
        - Macartney as mine superintendent
        - Local posse and informal leadership by Nick Stretton
  inference_path:
    steps:
      - observation: Thompson's letter had a hidden message inside the envelope, whose warning was crucial.
        correction: The message was a warning about Macartney's true identity and danger.
        effect: Revealed Macartney as the murderer and criminal mastermind.
        required_evidence:
          - >-
            Thompson's letter with hidden pencil scrawl inside envelope, whose warning was
            orchestrated to reach Nick Stretton
          - Thompson's playing cards with secret writing about Macartney's chance to cause harm
        reader_observable: true
      - observation: Wolf bait was found in the wagon and on the road, showing a chance for wolves to attack.
        correction: Macartney used wolf bait to lure wolves to attack Dudley.
        effect: Showed Macartney's involvement in Dudley's death.
        required_evidence:
          - Broken bottle of wolf bait in wagon, orchestrated by Macartney
          - Dead wolf with throat cut near corduroy road, whose presence was caused by bait
        reader_observable: true
      - observation: >-
          Four mill men were found dead in the assay office, whose deaths were orchestrated to
          eliminate witnesses.
        correction: Macartney staged a robbery and killed them to eliminate witnesses.
        effect: Confirmed Macartney's violent methods to secure control.
        required_evidence:
          - Dead mill men with gunshot wounds in assay office, whose deaths were caused by Macartney
          - >-
            Macartney's empty revolver and slashed doorpost, orchestrated as part of the staged
            robbery
        reader_observable: true
      - observation: >-
          Dunn and Collins were believed dead but reappeared alive, whose disappearance was
          orchestrated by Macartney.
        correction: They were hiding in secret tunnels and allied with Macartney.
        effect: Revealed complicity of Dunn and Collins in the conspiracy.
        required_evidence:
          - Secret tunnels behind Thompson's stope, whose existence was orchestrated for hiding
          - >-
            Dunn and Collins' presence in Skunk's Misery den, caused by their alliance with
            Macartney
        reader_observable: true
      - observation: >-
          Paulette Brown's real name and connection to emerald theft, whose identity was used to
          cause suspicion.
        correction: She was innocent and a victim of Macartney's schemes.
        effect: Cleared Paulette of theft and implicated Macartney.
        required_evidence:
          - >-
            Letter signed Tatiana Paulina Valenka, whose contents were orchestrated to protect
            Paulette
          - Van Ruyne's emerald necklace found on Macartney, showing cause for suspicion
        reader_observable: true
      - observation: >-
          Macartney was seen with Marcia Wilbraham and had fainting fits, whose behavior was
          orchestrated to deflect suspicion.
        correction: Macartney is Dick Hutton, the criminal mastermind.
        effect: Identified Macartney as the true culprit behind murders and theft.
        required_evidence:
          - >-
            Thompson's deuce of hearts with message, whose warning was orchestrated to reveal
            Macartney's identity
          - Macartney's behavior and fainting episodes, caused by his criminal stress
        reader_observable: true
      - observation: >-
          Macartney's men were ambushed and killed by explosion in Thompson's stope, whose fate was
          orchestrated by Nick Stretton.
        correction: Nick Stretton and allies used explosives to trap Macartney's gang.
        effect: Led to Macartney's downfall and capture.
        required_evidence:
          - High explosive placed in Thompson's stope, whose detonation was orchestrated as a trap
          - Explosion and collapse of tunnel entrance, causing Macartney's gang to be incapacitated
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      Nick Stretton and his allies set a trap by sealing themselves in Thompson's stope and placing
      high explosives at the tunnel entrance. They lure Macartney and his gang into the stope and
      detonate the explosives to incapacitate them. This forces Macartney into a direct
      confrontation, revealing his identity and guilt.
    knowledge_revealed: >-
      The trap exposes Macartney as the murderer and criminal mastermind behind the murders, theft,
      and sabotage at La Chance mine.
    pass_condition: >-
      Macartney and his gang are incapacitated by the explosion and forced into a confrontation
      where Macartney's identity and crimes are revealed.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given access to all key clues including Thompson's hidden messages, the wolf
      bait evidence, the sealed gold boxes, and the suspicious behavior of Macartney. The secret
      tunnels and the identity of Macartney as Dick Hutton are hinted at through multiple
      observations. The false solution accusing Billy Jones is presented and refuted. The final trap
      and confession are logically deduced from the gathered evidence.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
