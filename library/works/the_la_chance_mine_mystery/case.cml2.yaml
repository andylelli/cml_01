      - Charliet
      - Thompson (William D. Thompson)
    rationale: >-
      All key characters are present at La Chance or Skunk's Misery with limited access to the mine
      and surrounding bush, forming a closed circle of suspects and witnesses.
  constraint_space:
    time:
      anchors:
        - Thompson's letter dated before his death
        - Dudley's disappearance and death timeline
        - Collins and Dunn's disappearance and reappearance
        - Macartney's arrival and activities
      windows:
