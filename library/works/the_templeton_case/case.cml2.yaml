  culpability:
    culprit_count: 1
    culprits:
      - Francis Norwood
  surface_model:
    narrative:
      summary: >-
        Reginald Templeton is found murdered on his yacht at Marsh Quay. Initial suspects include an
        artist who fled suddenly, a diamond dealer who left town abruptly, and a retired cigar
        merchant with suspicious behavior. The case involves mysterious cigar bands, a
        walking-stick, and missing diamonds.
    accepted_facts:
      - Templeton was murdered on his yacht late Saturday night or early Sunday morning
      - Templeton had diamonds and incriminating papers related to Norwood’s embezzlement
      - A cigar band found at the scene was changed during the inquest
      - The walking-stick found in the dinghy did not belong to Templeton
    inferred_conclusions:
      - The artist Grayson was the murderer due to his sudden departure and cigar evidence
      - Isaac Moss was guilty because he fled and had access to the yacht
      - Joseph Proctor was the culprit because he changed the cigar band and had opportunity
  hidden_model:
    mechanism:
      description: >-
        Norwood arranged a secret meeting with Templeton to obtain incriminating papers. He
        accompanied Templeton back to the yacht, where he murdered him with a dagger. Norwood then
        staged the scene by leaving his walking-stick in the dinghy and changing the cigar band at
        the inquest to mislead investigators. He used the canoe and dinghy to create an alibi and
        escape unnoticed.
      delivery_path:
        - step: Norwood met Templeton in Frattenbury and walked back with him to Marsh Quay
        - step: They boarded the yacht together; Norwood was smoking a cigar
        - step: Norwood used a dagger to fatally stab Templeton in the cabin
        - step: Norwood searched Templeton’s pockets and took papers but missed the diamond bag
        - step: Norwood rowed back in the dinghy, leaving his walking-stick behind
        - step: He returned the dinghy to the yacht using a canoe to avoid suspicion
        - step: At the inquest, Norwood swapped the cigar band to implicate another suspect
    outcome:
      result: >-
        Francis Norwood is arrested for the murder of Reginald Templeton and later commits suicide
        in custody.
  false_assumption:
    statement: The murder was committed by someone who boarded the yacht before Templeton returned.
    type: temporal
    why_it_seems_reasonable: >-
      The presence of the walking-stick in the dinghy and the open cabin door suggested the killer
      was already aboard. Witnesses assumed the murderer was waiting on the yacht.
    what_it_hides: >-
      The killer actually accompanied Templeton to the yacht and committed the murder upon arrival,
      not before.
  false_solution:
    accused_suspect: Harold Grayson
    supporting_points:
      - Sudden departure from Marsh Quay
      - Possession of cigars matching the cigar band found
      - Lack of alibi for the time of murder
      - Avoidance of Templeton during his stay
    the_one_flaw: >-
      Grayson was proven to have been elsewhere during the murder and did not have access to the
      yacht at the critical time.
    refuted_in_chapter: 12
  red_herrings:
    - id: harold_grayson_departure
      description: Harold Grayson’s sudden departure and cigar evidence suggested guilt.
      points_at_suspect: Harold Grayson
      innocent_explanation: >-
        Grayson left early due to personal reasons unrelated to the murder and was confirmed to be
        elsewhere during the crime.
      resolved_in_chapter: 12
    - id: isaac_moss_flight
      description: Isaac Moss’s abrupt departure and nervous behavior raised suspicion.
      points_at_suspect: Isaac Moss
      innocent_explanation: >-
        Moss fled out of fear after discovering Templeton’s body and was later corroborated to have
        an alibi at the hotel.
      resolved_in_chapter: 16
  closed_circle:
    suspects:
      - Harold Grayson
      - Isaac Moss
      - Joseph Proctor
      - Francis Norwood
    rationale: >-
      All suspects were local or had access to the area and were investigated thoroughly; no
      outsiders were involved.
  constraint_space:
    time:
      anchors:
        - Saturday evening departure from Canon Fittleworth’s house
        - Murder estimated before or shortly after midnight
        - Sunday morning discovery of the body
      windows:
        - Templeton’s return to yacht between 9 pm and midnight
        - Murder committed between 11:30 pm and 1 am
        - Norwood’s presence in Frattenbury during the night
