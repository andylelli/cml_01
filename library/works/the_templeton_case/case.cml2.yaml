  inference_path:
    steps:
      - observation: >-
          Walking-stick found in dinghy did not belong to Templeton and its location was arranged to
          incriminate another.
        correction: >-
          The stick belonged to the murderer who left it behind to mislead and was aware of its
          location.
        effect: >-
          Focused suspicion on a left-handed man carrying a walking-stick and revealed the culprit's
          attempt to arrange evidence.
        required_evidence:
          - >-
            Housekeeper’s statement denying stick belonged to Moss and confirming Norwood's stick
            was missing from his umbrella stand on Sunday morning
          - >-
            Observation of Norwood using left hand to draw cork and carry stick, and being seen near
            the dinghy at the relevant time
        reader_observable: true
      - observation: >-
          Cigar band found at scene was changed during inquest, revealing a deliberate attempt to
          mislead.
        correction: >-
          Coroner Norwood swapped the band to mislead investigators and was aware of the
          incriminating evidence.
        effect: >-
          Initial suspicion on Grayson and others smoking similar cigars, but the act revealed the
          culprit's manipulation.
        required_evidence:
          - >-
            Witnesses noting cigar band change at inquest and Norwood's handling of the evidence
            tray
          - Discovery of identical cigar boxes in Norwood’s house and a record of the band swap
        reader_observable: true
      - observation: >-
          Templeton had diamonds but only one found on body; the rest were missing, and the culprit
          arranged to obtain them.
        correction: >-
          Diamonds were handed over to Moss earlier, and the culprit was not aware the diamond bag
          remained.
        effect: >-
          Robbery was not the primary motive, and the culprit's lack of awareness of the diamond
          bag's location is revealed.
        required_evidence:
          - >-
            Moss’s testimony about receiving diamonds and giving receipt, showing the arrangement of
            the transaction
          - >-
            Discovery of diamond bag in Moss’s possession and Templeton's receipt book with the
            transaction recorded
        reader_observable: true
      - observation: >-
          Norwood was wealthy and respected coroner, but secretly arranged to obtain incriminating
          papers and was aware of the risk.
        correction: >-
          Norwood was financially ruined and embezzled money, and the incriminating papers
          threatened to reveal his crimes.
        effect: >-
          Motive for murder was to prevent exposure and blackmail, and the culprit's secret was the
          driving force.
        required_evidence:
          - >-
            Bank records showing Norwood's financial difficulties and bankruptcy risk, and a letter
            arranging a meeting with Templeton
          - >-
            Ezra Grice’s written statement describing Norwood's embezzlement and the incriminating
            documents
        reader_observable: true
      - observation: Moss fled suddenly before murder discovery, but was not aware of the murder at the time.
        correction: Moss fled out of fear, not guilt, and his location was confirmed by access records.
        effect: Moss was cleared as suspect, and the access record revealed his innocence.
        required_evidence:
          - Hotel records confirming Moss’s presence Sunday night, showing his location
          - >-
            Witness statements corroborating Moss’s alibi and his awareness of the murder only after
            the fact
        reader_observable: true
      - observation: >-
          Grayson left suddenly and had no alibi for murder time, but was not aware of the murder or
          the location of the crime.
        correction: >-
          Grayson was at Selham and had witnesses, and access records revealed his absence from the
          scene.
        effect: Grayson was cleared as suspect, and the access record revealed his innocence.
        required_evidence:
          - >-
            Police surveillance and witness statements at Selham confirming Grayson's location at
            the time of the murder
          - >-
            Landlady’s testimony about Grayson’s presence and his lack of awareness of the murder
            until later
        reader_observable: true
      - observation: >-
          Norwood’s walking-stick matched the one found in dinghy, and he arranged to plant a dummy
          stick as incriminating evidence.
        correction: >-
          Norwood planted a dummy stick and kept original, revealing his attempt to incriminate
          others and his awareness of the evidence's location.
        effect: >-
          Direct evidence linking Norwood to the crime scene, and the arrangement of the stick
          revealed the culprit's manipulation.
        required_evidence:
          - >-
            Housekeeper’s recognition of Norwood’s stick and its absence from his umbrella stand,
            showing the arrangement
          - >-
            Colson’s controlled placement of dummy stick in dinghy and observation of Norwood
            attempting to retrieve it, revealing the culprit's awareness and intent
        reader_observable: true
  discriminating_test:
    method: trap
    design: >-
      Detective Colson secretly replaces the walking-stick in the dinghy with a duplicate. He then
      watches to see if the suspect attempts to retrieve the stick, confirming possession and guilt.
      This test uses the walking-stick and the suspect’s behavior as key elements, and reveals the
      culprit's awareness of the stick's location and his attempt to arrange incriminating evidence.
    knowledge_revealed: >-
      The test reveals that the culprit is aware of the walking-stick’s location and attempts to
      recover it, confirming his involvement and arrangement of the evidence.
    pass_condition: >-
      The suspect is observed retrieving the walking-stick from the dinghy during the night,
      demonstrating awareness of its location and intent to obtain incriminating evidence.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given all necessary clues including the walking-stick’s ownership, the cigar
      band’s change, the diamond transactions, and the suspect’s movements. The detective’s
      reasoning is laid out clearly, and the false leads are explained and refuted. The
      incriminating letter and Grice’s confession provide background to motive and identity. Careful
      attention to the timeline and physical evidence allows the reader to deduce the true culprit.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
