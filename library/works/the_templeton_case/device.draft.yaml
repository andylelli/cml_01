pattern_id: the_templeton_case
title: The Planted Stick
family: spatial_routing
axes:
  - temporal
principle: >-
  The killer actually accompanied the victim to the yacht and committed the murder upon arrival, not
  before.
principleType: cognitive_bias
surface_illusion_template: >-
  The artist a suspect was the murderer due to his sudden departure and cigar evidence; a suspect a
  suspect was guilty because he fled and had access to the yacht; a suspect a suspect was the
  culprit because he changed the cigar band and had opportunity
underlying_reality_template: >-
  the culprit arranged a secret meeting with the victim to obtain incriminating papers. He
  accompanied the victim back to the yacht, where he murdered him with a dagger. the culprit then
  staged the scene by leaving his walking-stick in the dinghy and changing the cigar band at the
  inquest to mislead investigators. He used the canoe and dinghy to create an alibi and escape
  unnoticed.
