  culpability:
    culprit_count: 1
    culprits:
      - Jefferson Hope
  surface_model:
    narrative:
      summary: >-
        A wealthy American named Enoch J. Drebber is found dead in an empty London house with no
        visible wounds but surrounded by blood. The police are baffled by the mysterious
        circumstances, including a cryptic blood-written message and a woman's wedding ring found at
        the scene. Sherlock Holmes investigates and uncovers a complex tale of revenge involving
        Mormon settlers and a long-standing feud.
    accepted_facts:
      - Enoch J. Drebber was found dead in an empty house with blood around but no wounds
      - The word 'RACHE' was written in blood on the wall
      - Joseph Stangerson, Drebber's secretary, was also murdered later in London
      - Jefferson Hope was arrested as the murderer and died of an aneurism shortly after
    inferred_conclusions:
      - The blood-written word 'RACHE' indicated a German political motive
      - Joseph Stangerson was an accomplice in Drebber's murder
      - The murders were random acts of violence by political refugees
  hidden_model:
    mechanism:
      description: >-
        Jefferson Hope, seeking revenge for the forced marriage and death of Lucy Ferrier,
        administered poisoned pills to Enoch Drebber and Joseph Stangerson. Each victim was given a
        choice between a deadly pill and a harmless one, ensuring the murderer could claim justice
        rather than cold-blooded murder. The blood on the floor was from the murderer himself, who
        had a nosebleed during the struggle.
      delivery_path:
        - step: Jefferson Hope follows Drebber and Stangerson covertly as a cab driver
        - step: He gains access to the empty house using a duplicate key
        - step: >-
            He forces Drebber to take a poisoned pill from a box containing one deadly and one
            harmless pill
        - step: Drebber dies from the poison; Hope writes 'RACHE' in his own blood as a false clue
        - step: >-
            Hope returns later to administer the same choice to Stangerson, who resists and is
            stabbed
        - step: Hope escapes suspicion by pretending to be drunk and loses the wedding ring
        - step: >-
            Holmes uses footprints, blood analysis, and telegram inquiries to identify and capture
            Hope
    outcome:
      result: Jefferson Hope is captured and confesses before dying of an aneurism, closing the case.
  false_assumption:
    statement: The blood-written word 'RACHE' was a genuine clue pointing to a German political assassin.
    type: behavioral
    why_it_seems_reasonable: >-
      The word was written in blood at the crime scene, suggesting a message from the murderer. The
      victim's foreign background and the political climate made a political motive plausible.
    what_it_hides: >-
      It was a deliberate red herring written by the murderer to mislead investigators away from the
      true personal revenge motive.
  false_solution:
    accused_suspect: Arthur Charpentier
    supporting_points:
      - He was found under lock and key during the investigation
      - He had a violent altercation with Drebber shortly before the murder
      - He carried a stick believed to be the murder weapon
      - He volunteered a suspicious statement about his whereabouts
    the_one_flaw: He had a solid alibi and no motive for the murders
    refuted_in_chapter: 6
  red_herrings:
    - id: rache_blood_message
      description: The word 'RACHE' written in blood on the wall suggested a German political motive.
      points_at_suspect: Political revolutionaries or German assassins
      innocent_explanation: It was a fake clue written by the murderer to mislead the investigation.
      resolved_in_chapter: 4
    - id: arthur_charpentier_suspect
      description: >-
        Arthur Charpentier was arrested as a suspect due to his quarrel with Drebber and possession
        of a stick.
      points_at_suspect: Arthur Charpentier
      innocent_explanation: He had no motive and was later cleared by alibi and lack of evidence.
      resolved_in_chapter: 6
  closed_circle:
    suspects:
      - Jefferson Hope
      - Arthur Charpentier
      - Joseph Stangerson
    rationale: >-
      The investigation focused on those with motive and opportunity; other suspects were excluded
      by alibis or lack of evidence.
  constraint_space:
    time:
      anchors:
        - Night of the murder at 2 AM
        - Stangerson's murder at 6 AM
        - Telegram dates from Cleveland about a month ago
      windows:
        - Drebber's last known movements between 9 PM and 2 AM
        - Stangerson's presence in hotel room until 9 AM
    access:
      actors:
        - Jefferson Hope as cab driver
        - Police constables at crime scenes
      objects:
        - Duplicate key to empty house
        - Poisoned pills box
        - Cab vehicle
    social:
      trust_channels:
        - Telegram communication with Cleveland police
        - Witness statements from constables and hotel staff
      authority_sources:
        - Scotland Yard detectives Gregson and Lestrade
        - Sherlock Holmes' deductions
  inference_path:
    steps:
      - observation: Blood stains in the room but no wounds on victim
        correction: Blood is from another source, possibly the murderer
        effect: Suggests murder by poison rather than physical attack
        required_evidence:
          - Chemical test for blood stains on floor
          - Examination of victim's body for wounds
        reader_observable: true
      - observation: Word 'RACHE' written in blood on wall
        correction: Likely a false clue to mislead investigation
        effect: Discredits political motive theory
        required_evidence:
          - Analysis of handwriting and blood source
          - Contextual knowledge of victim's enemies
        reader_observable: true
      - observation: Two sets of footprints inside and outside the house
        correction: Two men were present, one tall and one with small feet
        effect: Identifies presence of murderer and victim or accomplice
        required_evidence:
          - Footprint measurements in clay and dust
          - Witness statements about victim's height
        reader_observable: true
      - observation: Victim had a sour smell on lips
        correction: Indicates ingestion of poison
        effect: Confirms cause of death as poisoning
        required_evidence:
          - Chemical analysis of victim's lips and stomach contents
          - Medical examination report
        reader_observable: true
      - observation: Victim's companion separated at train station
        correction: Companion had opportunity to administer poison
        effect: Focuses suspicion on companion as murderer
        required_evidence:
          - Train station witness statements
          - Telegram about Jefferson Hope's presence in Europe
        reader_observable: true
      - observation: Cab driver with knowledge of victims' movements
        correction: Cab driver is likely the murderer
        effect: Identifies Jefferson Hope as prime suspect
        required_evidence:
          - Cab company records
          - Witness statements about cab driver
          - Street Arab reports locating cab owner
        reader_observable: true
      - observation: Two types of pills found, one inert and one deadly
        correction: Murderer used a box with one poisoned pill and one harmless pill
        effect: Explains method of murder and victim's choice
        required_evidence:
          - Chemical analysis of pills
          - Terrier's reaction to pills in experiment
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Sherlock Holmes dissolves one pill from the box in water and feeds it to a dog, observing no
      effect. Then he dissolves the other pill and feeds it to the dog, which dies quickly. This
      proves that one pill is harmless and the other is deadly, confirming the murder method.
    knowledge_revealed: >-
      The test reveals that the murderer used a box containing one poisoned pill and one harmless
      pill, forcing the victim to choose, thus confirming the poisoning mechanism.
    pass_condition: >-
      The dog survives after ingesting one pill and dies after ingesting the other, demonstrating
      the presence of both harmless and deadly pills in the box.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given detailed descriptions of the crime scene, footprints, blood stains, and
      the peculiar blood-written message. Holmes' deductions are based on observable facts such as
      the footprints, the chemical test for blood, and the presence of the pills. The method of
      poisoning with choice is explained and the clues to the murderer's identity are all presented,
      allowing an attentive reader to solve the case.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
