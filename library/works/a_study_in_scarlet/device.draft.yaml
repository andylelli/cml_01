principle: >-
  It was a deliberate red herring written by the murderer to mislead investigators away from the
  true personal revenge motive.
principleType: physical_law
surface_illusion_template: >-
  The blood-written word 'RACHE' indicated a German political motive; the victim was an accomplice
  in the victim murder; The murders were random acts of violence by political refugees
underlying_reality_template: >-
  the culprit, seeking revenge for the forced marriage and death of a bystander a bystander,
  administered poisoned pills to the victim and the victim. Each victim was given a choice between a
  deadly pill and a harmless one, ensuring the murderer could claim justice rather than cold-blooded
  murder. The blood on the floor was from the murderer himself, who had a nosebleed during the
  struggle.
