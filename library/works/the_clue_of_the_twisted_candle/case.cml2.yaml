  culpability:
    culprit_count: 1
    culprits:
      - "John Lexman"
  surface_model:
    narrative:
      summary: >
        Remington Kara is found stabbed in a bedroom whose steel latch is dropped on the inside, with
        no other way in or out. His private line to Scotland Yard rang at twenty-five past ten, fixing
        the hour of death at a moment when the only man with a motive was sitting in the very office
        that received the call.
    accepted_facts:
      - "The steel latch was heard to fall at about ten o'clock, after the visitor had left and while the valet watched him go"
      - "The latch cannot be raised from outside; the window was fastened and wired to an alarm"
      - "The private telephone to Scotland Yard rang at 10.25 and the doctor put the death at that hour"
      - "The valet was in the kitchen with the cook throughout, and then fled the house"
    inferred_conclusions:
      - "Kara dropped the latch himself and was therefore alive after his visitor left"
      - "Kara seized the telephone as he was attacked, so he died at 10.25"
      - "Nobody could have been in the room at that hour, so the killer is unfindable"
  hidden_model:
    mechanism:
      description: >
        The killer stabbed Kara, then propped the steel latch open on a small wax candle and rigged the
        telephone receiver to be knocked off by two heavy books balanced on a paper-knife over a second
        candle; the deliberately stoked fire softened both candles after he had gone, so the room
        sealed itself and raised its own alarm while he sat establishing an alibi at Scotland Yard.
      delivery_path:
        - step: "Lexman nurses the real George Gathercole through his last illness in Milan and takes his letters, learning that Kara has never seen his agent"
        - step: "He announces Gathercole's arrival by publishing an article on Patagonia over Gathercole's card, and calls at the house once in daylight to test the disguise"
        - step: "He returns at ten at night, throws an envelope naming the valet's convict number onto the hall table to drive him out of the house, and is shown up"
        - step: "He stabs Kara before he can reach the telephone"
        - step: "He props the raised steel latch on a small Christmas-tree candle so the heat of the huge fire will let it fall after he has gone"
        - step: "He lays a paper-knife across a cigarette box with one end under the telephone receiver and the other on a second cut candle, and weights that end with two heavy books"
        - step: "He talks loudly to the empty room so the valet hears a living Kara, leaves, changes out of the disguise, and reports to Scotland Yard, where the second candle bends and rings the alarm in his hearing"
    outcome:
      result: "A sealed room, a time of death that clears the only suspect, and a killer sitting with the police when the alarm sounds"
  false_assumption:
    statement: "A room that seals itself from the inside was sealed by the man inside it."
    type: temporal
    why_it_seems_reasonable: >
      The latch can only be dropped from within, the valet heard it fall after the visitor had passed
      him on the stairs, and twenty-five minutes later the man's own private telephone called for help.
      Every fact is honestly reported and each one places Kara alive after the only caller had gone.
    what_it_hides: >
      Both events were set running before the killer left and completed themselves in his absence. Wax
      softened by a deliberately stoked fire is a clock, and a clock that runs down after you have gone
      turns the hour of the alarm into evidence of where you were not.
  false_solution:
    accused_suspect: "Fisher, the valet"
    supporting_points:
      - "He was the only other person in the house at the hour of death"
      - "He alone had free access to the corridor outside the sealed room"
      - "He ran from the house hatless and coatless while the police were upstairs and could not be found"
      - "He was a convict living under a false name in a household where six thousand pounds in cash had just been drawn"
    the_one_flaw: >
      He was in the kitchen in the cook's sight from the moment the visitor left until the police rang
      the bell — and no person in the house, himself included, could have raised the fallen latch.
    refuted_in_chapter: 5
  red_herrings:
    - id: "rh_bloodied_scissors"
      description: "A pair of long-bladed scissors, blades dappled with blood, the handle wound in a monogrammed handkerchief, found in the locked cellar"
      points_at_suspect: "Belinda Mary Bartholomew"
      innocent_explanation: "She used them on the great chained dog Kara kept to terrify his prisoner, and the animal is found dead behind a screen in the lower cellar."
      resolved_in_chapter: 15
    - id: "rh_political_feud"
      description: "The two candles read as the signature of an Albanian blood feud, a form of torture Kara was known to dread"
      points_at_suspect: "Kara's Albanian enemies"
      innocent_explanation: "The candles are not a signature but a mechanism; their shape is the accident of wax bending under heat, and the killer chose them because Kara's own hatred of candles guaranteed they would be read as a message."
      resolved_in_chapter: 22
  closed_circle:
    suspects:
      - "John Lexman"
      - "Fisher"
      - "Belinda Mary Bartholomew"
    rationale: "One entrance, a latch that only opens from inside, a barred and alarmed window, and a house containing only the valet and the cook"
  constraint_space:
    time:
      anchors:
        - "The visitor is shown up to the room at about ten o'clock"
        - "The steel latch is heard to fall a few minutes later, while the visitor is on the stairs"
        - "The private telephone rings at Scotland Yard at 10.25"
      windows:
        - "The interval between the visitor entering the room and the latch falling"
        - "The twenty-five minutes between the latch falling and the telephone alarm"
    access:
      actors:
        - "The visitor announced as George Gathercole"
        - "Fisher, in the hall and kitchen"
        - "Mrs. Beale, the cook"
      objects:
        - "The steel latch, which can only be raised by its knob from inside"
        - "The huge fire, which made the room stifling"
        - "The telephone, the ivory paper-knife, the silver cigarette box and two heavy books"
        - "Two candles — one small and twisted, one stouter and cut to fit"
    social:
      trust_channels:
        - "A valet's account of what he heard from the foot of the stairs"
      authority_sources:
        - "A doctor's estimate of the hour of death, taken from the time of the telephone call"
  inference_path:
    steps:
      - observation: "A small Christmas-tree candle lies bent and twisted in the middle of the carpet, and a stouter cut candle lies under the bed."
        correction: "Candles do not bend by themselves; these have been softened by heat while under load."
        effect: "Two objects in the room were carrying weight until the fire deformed them."
        required_evidence:
          - "The bent and twisted little candle found in the middle of the carpet"
          - "The second, stouter candle found lying underneath the bed"
        reader_observable: true
      - observation: "The fire in the grate was built so large that the room was stifling on a bleak February night."
        correction: "Kara kept his rooms hot as a habit, so an unusually large fire attracts no suspicion and is nonetheless the fastest clock in the house."
        effect: "The room was prepared to soften wax on a schedule."
        required_evidence:
          - "The statement that a big fire was burning in the grate, so big that the room was stifling"
          - "Kara's known habit of keeping the temperature of the room unpleasantly close despite the cold"
        reader_observable: true
      - observation: "The telephone is overturned with the receiver on the floor, and beside it lie an ivory paper-knife and two heavy books."
        correction: "A man snatching at a telephone does not leave a paper-knife and two books arranged beside it; that is a balance, not a struggle."
        effect: "The call to Scotland Yard was made by a falling weight, not by a dying man."
        required_evidence:
          - "The overturned telephone with the receiver on the floor and two books and a long ivory paper-knife beside it"
          - "The bell that rang at Scotland Yard at 10.25 with no voice on the line"
        reader_observable: true
      - observation: "The steel latch can only be raised by its knob from inside the room, and it was heard to fall while the visitor was still on the stairs."
        correction: "It can also be held up on something that will later give way, and the sound of it falling proves only that the prop failed."
        effect: "The room sealed itself after the killer had left it."
        required_evidence:
          - "The clang of the steel latch heard from the stairs while the visitor was leaving"
          - "The demonstration that once dropped the latch cannot be raised except by its own knob"
        reader_observable: true
      - observation: "The caller was announced as George Gathercole, an explorer with one artificial arm whom Kara had never met."
        correction: "A man Kara has never seen is a name rather than a face, and a wooden gauntlet is easier to counterfeit than a countenance."
        effect: "Anyone who knew Gathercole's habits could be admitted to that room."
        required_evidence:
          - "The valet's account of striking his knuckles against a wooden forearm beneath the visitor's sleeve"
          - "The report that George Gathercole was listed among the passengers lost with the City of the Argentine"
        reader_observable: true
      - observation: "The visitor's artificial arm was the left one."
        correction: "The real George Gathercole had lost his right arm."
        effect: "The man admitted to Kara's room was an impostor, and the only impostor with a motive is John Lexman."
        required_evidence:
          - "The valet's observation that the visitor's left hand was gloved and thrust into his overcoat pocket"
          - "T. X. Meredith's statement that the real Gathercole had lost his right arm"
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >
      Rebuild the room as it stood: the same stifling fire, the same steel latch raised and propped on
      a small candle, the same paper-knife balanced across the cigarette box with two heavy books on
      the candle end and the far end under the telephone receiver. Time both with a stop watch. Then
      set the visitor's described arm against the real Gathercole's: the caller wore a wooden forearm
      on the left, and the explorer he claimed to be had lost the right.
    knowledge_revealed: >
      The latch and the telephone are both delayed-action devices that complete themselves after the
      room is empty, so the hour of the alarm is no evidence of the hour of death; and the man admitted
      to the room counterfeited the wrong arm.
    pass_condition: >
      A candle of that size under that latch, in a room at that temperature, bends and drops the latch
      within minutes of the door closing, and the weighted paper-knife lifts the receiver a quarter of
      an hour later — while the record of Gathercole's own writings shows the missing arm was the right.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >
      Both candles, the paper-knife, the cigarette box, the two heavy books, the overturned telephone
      and the stifling fire are all laid before the reader in the search of the room. The valet's
      knuckles strike the wooden forearm in the reader's hearing, and Kara's own hatred of candles is
      explained long before it is used. The reader needs no special knowledge — only to notice that wax
      near a large fire is a timer, and to ask which arm the real explorer had lost.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 6
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 2
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
