      motive_seed: "None — he is the victim"
      motive_strength: "none"
      alibi_window: "Alone in his sealed bedroom from the moment his visitor left"
      access_plausibility: "His own room, which only he could open from inside"
      opportunity_channels:
        - "The bedroom with its steel latch"
      behavioral_tells:
        - "Keeps his room stiflingly hot in the coldest weather"
        - "Drops a steel latch nightly and admits nobody until morning"
