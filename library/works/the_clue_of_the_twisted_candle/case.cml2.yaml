      public_persona: "A famously eccentric traveller whom nobody at his club can reliably describe"
      private_secret: "He died of fever in Milan in January and was nursed at the end by John Lexman"
      motive_seed: "None"
      motive_strength: "none"
      alibi_window: "Dead in Italy before the murder"
      access_plausibility: "None — but his name and manner grant total access"
      opportunity_channels: []
