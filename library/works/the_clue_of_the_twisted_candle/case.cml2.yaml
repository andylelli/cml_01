CASE:
  meta:
    title: "The Clue of the Twisted Candle"
    author: "Edgar Wallace"
    license: "Public domain (first published 1918; author died 1932). Project Gutenberg ebook 2688."
    era:
      decade: "1910s"
      realism_constraints:
        - "No forensic time-of-death precision; the hour of death is inferred from a telephone call"
        - "A private telephone line can be run from a house to Scotland Yard on request"
        - "Rooms are heated by open coal fires hot enough to soften wax in minutes"
        - "Identification of an infrequently-seen public figure rests on beard, spectacles and manner"
    setting:
      location: "A guarded bedroom in Cadogan Square, London, in February"
      institution: "Scotland Yard's Special Service Department, investigating a sealed-room killing"
    crime_class:
