open_issues:
  - id: mechanism_family_vocabulary
    severity: finding
    detail: >
      `mechanism_family` was forced to `hidden_accomplice`, and the story has no accomplice and no
      trick. Nothing is staged by the culprit at all: the concealment is performed first by the
      investigators' own framing of what counts as evidence, and then, after the fact, by two
      neighbour women. The enum has no member for a case whose concealment is not an act by the
      culprit. The novelty judge's nearest neighbour is `butler_did_it`, which is the mis-tag showing
      up as a measurement rather than as an opinion.
  - id: axis_is_arguable
    severity: note
    detail: >
      Encoded `behavioral` (an assumption about what a kind of person notices). A defensible
      `authority` reading exists — the county attorney's standing is what makes his designation of the
      kitchen as insignificant stick. Recorded rather than hidden.
