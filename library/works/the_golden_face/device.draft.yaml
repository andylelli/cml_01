pattern_id: the_golden_face
title: The Borrowed Face
family: identity
axes:
  - identity
principle: >-
  The real Lady the culprit is an accomplice named the culprit, and the pearls stolen by the
  investigator are imitation. The theft is a setup to implicate the investigator and conceal the
  true criminals.
principleType: social_logic
surface_illusion_template: >-
  the investigator is the prime thief of Lady the culprit jewels; the culprit acted alone in the
  bank robbery; Lady the culprit is an innocent victim unaware of the theft
underlying_reality_template: >-
  the culprit orchestrated the thefts using trusted agents and elaborate disguises. He manipulated
  the investigator into stealing Lady the culprit pearls under duress, but the pearls were actually
  imitation. The real Lady the culprit was an accomplice named the culprit who used the theft to
  cover her own criminal activities. the culprit also framed Hugh Martyn by transferring Martyn's
  fingerprints onto gloves used in a bank robbery, ensuring Martyn's conviction while the culprit
  remained clean.
