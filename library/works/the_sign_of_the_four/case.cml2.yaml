  culpability:
    culprit_count: 2
    culprits:
      - Jonathan Small
      - Tonga
  surface_model:
    narrative:
      summary: >-
        Bartholomew Sholto is found dead in a locked room with no apparent means of entry or exit
        for the murderer. A valuable treasure has been stolen, and suspicion falls on his brother
        Thaddeus and household staff. The presence of a wooden-legged man and mysterious small
        footprints complicate the case.
    accepted_facts:
      - Bartholomew Sholto was found dead with a poisoned thorn in his scalp
      - The door and window of the room were locked from the inside
      - A secret trap-door in the roof allowed access to the room
      - A valuable treasure was stolen from the house
    inferred_conclusions:
      - Thaddeus Sholto murdered his brother to claim the treasure
      - The murder was committed through the locked door or window
      - The wooden-legged man acted alone in the crime
  hidden_model:
    mechanism:
      description: >-
        The murderer entered the victim's room by climbing up the roof and descending through a
        secret trap-door. The accomplice Tonga, a small Andaman Islander, climbed down a rope
        lowered by Jonathan Small and used poisoned darts to kill Bartholomew. They then lowered the
        treasure chest through the trap-door and escaped the same way.
      delivery_path:
        - step: Jonathan Small and Tonga approach the house at night
        - step: Jonathan climbs to the roof and lowers a rope
        - step: Tonga climbs down the rope into the victim's room
        - step: Tonga uses a poisoned dart to kill Bartholomew Sholto
        - step: They lower the treasure chest through the trap-door
        - step: Tonga climbs back up the rope and the trap-door is secured
        - step: Jonathan and Tonga escape unseen
    outcome:
      result: >-
        Jonathan Small and Tonga are captured after a chase on the Thames, and the treasure is
        recovered but found to be missing its contents.
  false_assumption:
    statement: The murderer must have entered through the locked door or window.
    type: spatial
    why_it_seems_reasonable: >-
      The door and window were locked from the inside, so it is logical to assume the killer used
      one of these points. No other entry points were initially visible.
    what_it_hides: >-
      It hides the existence of a secret trap-door in the roof that provided access, and the
      involvement of an accomplice who climbed down a rope.
  false_solution:
    accused_suspect: Thaddeus Sholto
    supporting_points:
      - He was the last person seen with Bartholomew
      - He had a motive related to the treasure
      - He was found in a disturbed state near the crime scene
      - He had access to the house and the victim
    the_one_flaw: He was locked out of the victim's room at the time of death and had an alibi
    refuted_in_chapter: 6
  red_herrings:
    - id: thaddeus_sholto_nervous_behavior
      description: Thaddeus Sholto's nervousness and quarrel with his brother suggest guilt.
      points_at_suspect: Thaddeus Sholto
      innocent_explanation: He was anxious about the treasure and family disputes but was not the murderer.
      resolved_in_chapter: 6
    - id: lal_rao_butler_suspicion
      description: The butler Lal Rao is suspected of complicity due to his presence and character.
      points_at_suspect: Lal Rao
      innocent_explanation: He was merely a loyal servant and had no involvement in the murder or theft.
      resolved_in_chapter: 12
  closed_circle:
    suspects:
      - Thaddeus Sholto
      - Mrs. Bernstone
      - Lal Rao
      - McMurdo
      - Jonathan Small
      - Tonga
    rationale: >-
      All suspects had access to the house, but only Jonathan Small and Tonga had the means and
      motive to commit the murder and theft, while others were cleared by alibis or lack of
      evidence.
  constraint_space:
    time:
      anchors:
        - Bartholomew locked himself in at 10 PM
        - Thaddeus left the room after 10 PM
        - Murder discovered nearly 11 PM
        - Launch Aurora left at about 3 AM
      windows:
        - Murder occurred between 10 PM and discovery
        - Escape by launch shortly after murder
    access:
      actors:
        - Jonathan Small
        - Tonga
        - Thaddeus Sholto
        - House staff
      objects:
        - Secret trap-door in roof
        - Rope lowered from roof
        - Locked door and window
        - Launch Aurora
    social:
      trust_channels:
        - Communication between Jonathan Small and Tonga
        - Trust between Thaddeus and Bartholomew
        - Information from Mrs. Bernstone
      authority_sources:
        - Scotland Yard
        - Sherlock Holmes's deductions
        - Athelney Jones's police authority
  inference_path:
    steps:
      - observation: The door and window of the victim's room were locked from the inside
        correction: There is a secret trap-door in the roof providing access
        effect: The murderer did not enter through conventional means
        required_evidence:
          - Inspection of the locked room and trap-door by Holmes
          - Witness statement from housekeeper Mrs. Bernstone about locked door
        reader_observable: true
      - observation: Footprints of a wooden stump and small naked feet found in the room
        correction: 'Two perpetrators: one with a wooden leg and a small accomplice'
        effect: Identifies two distinct criminals with different physical characteristics
        required_evidence:
          - Footprint impressions in creosote and dust
          - Description of Tonga's small stature and wooden leg of Jonathan Small
        reader_observable: true
      - observation: Poisoned thorn found in victim's scalp
        correction: Murder was committed using a poisoned dart from a blow-pipe
        effect: Cause of death is poisoning, not blunt force trauma
        required_evidence:
          - Physical examination of the thorn
          - Toxicological analysis of poison
        reader_observable: true
      - observation: Rope found in the victim's room leading to the roof
        correction: Murderer climbed down the rope from the roof
        effect: Confirms secret access route and method of entry/exit
        required_evidence:
          - Rope found near trap-door
          - Holmes's demonstration of climbing method
        reader_observable: true
      - observation: Toby the dog tracked scent from creosote on the rope
        correction: The accomplice dipped foot in creosote to climb down
        effect: Identifies the accomplice's route and presence
        required_evidence:
          - Toby's tracking of creosote scent
          - Creosote stains on rope and footprints
        reader_observable: true
      - observation: Launch Aurora was missing and later found at Jacobson's Yard
        correction: Launch was used for escape and hidden at a boatyard
        effect: Escape route and method identified
        required_evidence:
          - Witness statement from Mrs. Smith about launch departure
          - Holmes's inquiry at Jacobson's Yard
        reader_observable: true
      - observation: Jonathan Small and Tonga captured after chase on Thames
        correction: They are the culprits responsible for murder and theft
        effect: Case solved with arrest of guilty parties
        required_evidence:
          - Eyewitness accounts of chase and capture
          - Physical evidence linking them to crime scene
        reader_observable: true
  discriminating_test:
    method: constraint_proof
    design: >-
      Holmes uses the presence of creosote on the rope and footprints to prove the accomplice
      climbed down from the roof, which is inaccessible by other means. He also uses Toby the dog to
      track the scent trail leading to the escape launch, confirming the route and method of escape.
    knowledge_revealed: >-
      This test reveals the secret access route via the roof trap-door and the involvement of two
      criminals with distinct physical traits. It disproves entry through locked doors or windows.
    pass_condition: >-
      Finding creosote footprints and rope marks consistent with climbing and tracking the scent
      trail to the launch confirms the mechanism of the crime.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given all necessary clues including the locked room, the secret trap-door, the
      footprints of a wooden leg and small feet, the poisoned thorn, and the rope. Holmes's
      reasoning is based on observable physical evidence and logical deduction. The presence of the
      creosote and the dog's tracking provide concrete leads that the reader could follow. The false
      assumptions and red herrings are clearly presented and can be questioned by attentive readers.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
