pattern_id: the_sign_of_the_four
title: The Secret Trap-Door
family: spatial_routing
axes:
  - spatial
principle: >-
  It hides the existence of a secret trap-door in the roof that provided access, and the involvement
  of an accomplice who climbed down a rope.
principleType: physical_law
surface_illusion_template: >-
  a suspect a suspect murdered his brother to claim the treasure; The murder was committed through
  the locked door or window; The wooden-legged man acted alone in the crime
underlying_reality_template: >-
  The murderer entered the victim's room by climbing up the roof and descending through a secret
  trap-door. The accomplice the culprit, a small Andaman Islander, climbed down a rope lowered by
  the culprit and used poisoned darts to kill the victim. They then lowered the treasure chest
  through the trap-door and escaped the same way.
