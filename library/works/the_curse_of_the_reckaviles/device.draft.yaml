pattern_id: the_curse_of_the_reckaviles
title: The Simulated Argument
family: timing
axes:
  - identity
principle: >-
  The real murderer was the culprit, who manipulated evidence and used the dictaphone to fake the
  presence of another person, diverting suspicion onto the culprit.
principleType: physical_law
surface_illusion_template: >-
  the culprit was the murderer, using the alibi to cover his crime.; a suspect a witness was
  involved in the murder due to his secretive behavior and possession of stolen notes.; The murder
  was caused by the the culprit family curse or supernatural forces.
underlying_reality_template: >-
  the culprit, the old servant, murdered Lord the culprit in a fit of revenge by stabbing him with a
  knife while the culprit was distracted. He used the dictaphone to play a recorded argument to
  mislead witnesses and create an alibi for another suspect. the culprit then locked the room and
  staged the scene to suggest an impossible crime, hiding the murder weapon and the recording to
  delay discovery.
