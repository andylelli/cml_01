  culpability:
    culprit_count: 2
    culprits:
      - Betty Harlowe
      - Francine Rollard
  surface_model:
    narrative:
      summary: >-
        Mrs. Harlowe's death is initially thought natural but soon suspected as murder by poison.
        Betty Harlowe is accused, but her alibi at a ball seems strong. The investigation uncovers
        anonymous letters, a secret passage, and a missing pearl necklace, with suspicion falling on
        Betty's friend Ann Upcott and maid Francine Rollard.
    accepted_facts:
      - Mrs. Harlowe died on the night of April 27th
      - Betty Harlowe was at a ball from 9pm to after 1am
      - No poison trace was found in Mrs. Harlowe's body
      - A poison arrow head was found hidden as a pen-holder
    inferred_conclusions:
      - Betty Harlowe is innocent due to her alibi
      - Boris Waberski is the murderer due to motive and accusation
      - Ann Upcott is innocent and a victim of suspicion
  hidden_model:
    mechanism:
      description: >-
        Mrs. Harlowe was murdered by poison administered via a rare African arrow-poison. Betty
        Harlowe, with the help of her maid Francine Rollard, used the secret passage to access the
        victim and applied the poison using the arrow head disguised as a pen-holder. Ann Upcott was
        complicit in the blackmail but not in the murder. The crime was uncovered through
        investigation of the secret passage, timing, and discovery of the arrow head and missing
        pearl necklace.
      delivery_path:
        - step: Betty Harlowe and Francine Rollard prepared the poison arrow and hypodermic needle
        - step: >-
            On the night of April 27th, Mrs. Harlowe unlocked the secret passage to the
            treasure-room
        - step: Betty and Francine entered via the secret passage and administered the poison
        - step: >-
            Ann Upcott was present but unaware of the murder details, later abducted to prevent
            disclosure
        - step: The arrow head was hidden in a pen-holder in Ann Upcott's room
        - step: The pearl necklace was stolen to provide motive and misdirect suspicion
        - step: Jean Cladel, the herbalist who prepared the poison solution, was murdered to silence him
    outcome:
      result: Betty Harlowe and Francine Rollard are arrested and charged with the murder of Mrs. Harlowe.
  false_assumption:
    statement: Betty Harlowe's alibi at the ball proves her innocence of the murder.
    type: temporal
    why_it_seems_reasonable: >-
      Betty was seen at a public ball from 9pm to after 1am, which covers the time of the murder.
      Witnesses and a clock confirm her presence away from the crime scene.
    what_it_hides: >-
      The murder was committed earlier in the night before Betty left for the ball, using a secret
      passage and accomplices, allowing her to establish an alibi while the crime was committed.
  false_solution:
    accused_suspect: Boris Waberski
    supporting_points:
      - He accused Betty Harlowe of poisoning Mrs. Harlowe
      - He had a financial motive as a disgruntled relative expecting inheritance
      - He was seen near the herbalist's shop where poison was obtained
      - He was absent during the murder, suggesting opportunity for a frame-up
    the_one_flaw: He was away fishing during the time of the murder and had no access to the victim
    refuted_in_chapter: 7
  red_herrings:
    - id: boris_waberski_accusation
      description: Boris Waberski accuses Betty Harlowe of poisoning Mrs. Harlowe and demands money.
      points_at_suspect: Betty Harlowe
      innocent_explanation: >-
        Boris is a blackmailer motivated by greed and spite, with no actual involvement in the
        murder.
      resolved_in_chapter: 7
    - id: ann_upcott_night_story
      description: >-
        Ann Upcott claims to have heard a struggle and a whisper 'That will do now' on the night of
        the murder.
      points_at_suspect: Ann Upcott
      innocent_explanation: >-
        Ann's story is partly true but she was manipulated and coerced; she is an accomplice but not
        the primary murderer.
      resolved_in_chapter: 10
  closed_circle:
    suspects:
      - Betty Harlowe
      - Ann Upcott
      - Francine Rollard
      - Boris Waberski
      - Jeanne Baudin
    rationale: >-
      All had access to the house and potential motives; others were excluded by alibis or lack of
      opportunity.
  constraint_space:
    time:
      anchors:
        - Night of April 27th, murder time around half-past ten
        - Betty at ball from 9pm to after 1am
        - Jean Cladel murdered late at night
        - Ann Upcott's escape planned for night of Madame Le Vay's ball
      windows:
        - Murder committed before Betty left for ball
        - Arrow hidden after murder before investigation
        - Ann Upcott abducted after murder to prevent disclosure
    access:
      actors:
        - Betty Harlowe
        - Ann Upcott
        - Francine Rollard
        - Boris Waberski
      objects:
        - Secret passage between Maison Grenelle and Hôtel de Brebizart
        - Locked cabinet in treasure-room
        - Poison arrow pen-holder
        - Pearl necklace
    social:
      trust_channels:
        - Letters between Simon Harlowe and Mrs. Harlowe
        - Anonymous letters signed 'The Scourge'
        - Letters from Boris Waberski
      authority_sources:
        - Examining Magistrate of Dijon
        - Sûreté of Paris
        - Commissary Girardot
        - Notary Monsieur Bex
  inference_path:
    steps:
      - observation: Betty Harlowe was at a ball from 9pm to after 1am
        correction: Murder occurred before 9pm
        effect: Betty's alibi does not exclude her guilt
        required_evidence:
          - Ann Upcott's statement of hearing struggle and whisper at half-past ten
          - Clock on marquetry cabinet showing half-past ten
        reader_observable: true
      - observation: No poison trace found in Mrs. Harlowe's body
        correction: Arrow poison leaves no trace
        effect: Poisoning by arrow poison is plausible despite negative autopsy
        required_evidence:
          - Treatise on Strophanthus Hispidus describing arrow poison
          - Discovery of poison arrow head with pen-holder disguise
        reader_observable: true
      - observation: Anonymous letters accuse Betty and demand money
        correction: Letters are part of blackmail scheme by Betty and accomplices
        effect: Letters are a cover for murder and extortion
        required_evidence:
          - Typed letters from Corona machine found in treasure-room
          - Blackmail letters signed 'The Scourge'
        reader_observable: true
      - observation: Secret passage exists between Maison Grenelle and Hôtel de Brebizart
        correction: Murderers used secret passage to commit crime and hide evidence
        effect: Access to victim and concealment of evidence explained
        required_evidence:
          - Discovery of secret passage in locked cabinet
          - Historical records of passage construction
        reader_observable: true
      - observation: Pearl necklace missing from jewel-case
        correction: Necklace stolen to provide motive and misdirect suspicion
        effect: Motive for murder and theft established
        required_evidence:
          - Jewel-case found unlocked with necklace missing
          - Recovered pearl necklace found in matchbox
        reader_observable: true
      - observation: Jean Cladel found murdered with stab wound
        correction: Cladel murdered to silence him about poison preparation
        effect: Eliminates witness and links herbalist to poison
        required_evidence:
          - Body of Jean Cladel found in back room
          - Medical report of stab wound and time of death
        reader_observable: true
      - observation: Arrow head found disguised as pen-holder
        correction: Arrow used as hypodermic needle for poison injection
        effect: Confirms murder weapon and method
        required_evidence:
          - Pen-holder with arrow head found in Ann Upcott's room
          - Hanaud's experiment reenacting whisper and light switch
        reader_observable: true
  discriminating_test:
    method: reenactment
    design: >-
      Hanaud stages a reenactment of the murder scene with Francine Rollard and Betty Harlowe in the
      bedroom and treasure-room, replicating Ann Upcott's account of the whisper 'That will do now'
      and the light switch. The test aims to observe reactions and verify the plausibility of the
      murder method and presence of suspects.
    knowledge_revealed: >-
      The reenactment confirms the position of the murderer and the use of the whisper, but fails to
      break Francine's silence, indicating her fear rather than guilt. It also reveals Betty's
      readiness to use poison on herself, confirming her guilt and desperation.
    pass_condition: >-
      Successful reenactment matches Ann Upcott's story and reveals behavioral tells that
      distinguish the guilty parties.
  fair_play:
    all_clues_visible: true
    no_special_knowledge_required: true
    no_late_information: true
    reader_can_solve: true
    explanation: >-
      The reader is given all essential clues: the timing of the murder, the secret passage, the
      missing pearl necklace, the poison arrow and its unique properties, the anonymous letters, and
      the alibis of suspects. The detective's reasoning and the reenactment provide a logical path
      to identify the murderers. The false accusation against Boris Waberski and the misleading
      alibi of Betty Harlowe serve as deliberate misdirections, but the reader can solve the case by
      carefully analyzing the timeline, access, and evidence.
  quality_controls:
    inference_path_requirements:
      min_steps: 6
      max_steps: 7
      require_observation_correction_effect: true
    clue_visibility_requirements:
      essential_clues_min: 5
      essential_clues_before_test: true
      early_clues_min: 2
      mid_clues_min: 2
      late_clues_min: 1
    discriminating_test_requirements:
      timing: mid_act3
      must_reference_inference_step: true
