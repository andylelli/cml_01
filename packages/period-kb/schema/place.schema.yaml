# Strict schema for a Period KB place entry (packages/period-kb/places/<archetype>.yaml).
# JSON Schema draft-07, authored in YAML, compiled by ajv at load time.
$schema: "http://json-schema.org/draft-07/schema#"
title: "PeriodKB Place Entry"
type: object
additionalProperties: false
required:
  - archetype
  - display_name
  - isolation
  - access_points
  - observability
  - key_areas
  - movement_constraints
  - social_rules
  - typical_summary
  - sources
properties:
  archetype:
    type: string
    pattern: "^[a-z][a-z0-9_]*$"
  display_name:
    type: string
    minLength: 1
  isolation:
    type: object
    additionalProperties: false
    required: [profile, summary]
    properties:
      profile:
        type: string
        enum: [low, moderate, high, extreme]
      summary: { type: string, minLength: 1 }
      outside_help_latency_hours: { type: number }
  access_points:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, kind, control]
      properties:
        id: { type: string }
        kind: { type: string }
        control: { type: string }
  observability:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [from, sees]
      properties:
        from: { type: string }
        sees:
          type: array
          minItems: 1
          items: { type: string }
  key_areas:
    type: array
    minItems: 1
    items: { type: string }
  movement_constraints:
    type: array
    minItems: 1
    items: { type: string }
  social_rules:
    type: array
    minItems: 1
    items: { type: string }
  typical_summary:
    type: string
    minLength: 1
  sources:
    type: array
    minItems: 1
    items: { type: string }
