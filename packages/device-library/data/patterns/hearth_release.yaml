pattern_id: hearth_release
title: The Heat-Sprung Latch
family: timing
axes: [temporal, spatial]
principle: Predictable thermal expansion can move a metal mechanism at a calculable time, releasing a latch after the culprit has gone.
principleType: physical_law
surface_illusion_template: The door was bolted from the inside long after everyone agrees the culprit had left the wing.
underlying_reality_template: Heat from the rekindled hearth expanded a rigged metal linkage that dropped the bolt at a predictable later time — a delayed-action lock.
