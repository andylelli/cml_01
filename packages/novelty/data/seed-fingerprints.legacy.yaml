# Abstract structural fingerprints of the seed library (examples/*_cml2.yaml). Derived artifact —
# regenerated when the seeds change (§5). These are STRUCTURE, not surface: two cases sharing zero
# names can still be the same mystery, and that is what these fields capture. Hand-authored for this
# first increment; the §9.1-spike-2 LLM extractor is the gated next phase.

- id: the_moonstone
  corpus: seed
  axis: epistemic
  mechanism_family: unconscious_act
  false_assumption_pattern: "the_actor_acted_knowingly"
  discriminating_test_shape: reconstruction
  inference_shape: "reconstruct_altered_mental_state"
  premise: "A jewel vanishes; the taker took it without knowing, under opium."
  source: "examples/the_moonstone_cml2.yaml"

- id: the_mysterious_affair_at_styles
  corpus: seed
  axis: temporal
  mechanism_family: poison_delayed
  false_assumption_pattern: "time_of_symptom=time_of_act"
  discriminating_test_shape: chemical_timing
  inference_shape: "decouple_act_from_symptom"
  premise: "Strychnine kills hours after it is given, breaking the obvious alibi window."
  source: "examples/the_mysterious_affair_at_styles_cml2.yaml"

- id: the_big_bow_mystery
