theme: "Golden Age murder within a closed circle of suspects. Enforce strict fair-play: reveal all mechanism-critical clues to the reader by mid-story, place the discriminating test no later than early Act III, include at least 3 explicit evidence clues tied to the final deduction, and ensure every red herring is inference-isolated from the true solution chain."
eraPreference: "1950s"
locationPreset: SeasideHotel
tone: "Classic"
primaryAxis: identity
# A_52 role model: the fair-play cast is 1 detective + 1 victim + (n-2) suspects.
# n=6 here — 1 detective + 1 victim + 4 suspects (culprit + 3 red herrings) for a richer
# misdirection field. (n=5 is the lean minimum; 6 trades a little more weave load for novelty.)
castSize: 6
castNames:
  - "Eleanor Voss"
  - "Dr. Mallory Finch"
  - "Captain Ivor Hale"
  - "Beatrice Quill"
  - "Sylvia Trent"
  - "Hugo Vane"
# Gender lock: prevents per-run ambiguity for names the LLM may misread.
# Captain Ivor Hale (Ivor = Welsh male name) and Hugo Vane are masculine — lock to male.
# All other characters are female. This is non-negotiable via Agent2 prompt.
castGenders:
  "Eleanor Voss": female
  "Dr. Mallory Finch": female
  "Captain Ivor Hale": male
  "Beatrice Quill": female
  "Sylvia Trent": female
  "Hugo Vane": male
#  - "Agnes Pike"
detectiveType: amateur
targetLength: short
narrativeStyle: dark
skipNoveltyCheck: false
similarityThreshold: 0.9
proseBatchSize: 1
# runId: "mystery-custom-run-id"
# projectId: "proj_example"
enableLockedFactRegistry: true
enableLockedFactGate: true
enableCharacterBundle: true
enableBindingGates: true
enableSurgicalFingerprintRetry: true
enableOutlineCompleteness: true
