# CR-01 (documentation/code-review) — run the existing suites on every push to main and every PR.
# `npm test` runs `pretest` first: build:all (the worker consumes dist) and the module-const flag check.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Flag register (flags:check, flags:runtime)
        run: npm run verify:flags
      - name: Workspaces declare what they import; build order respects the graph
        run: npm run deps:check
      - name: Code review ledger is current and fully assigned
        run: npm run ledger:check
      - name: Build and unit suites (all workspaces)
        run: npm test
      - name: Script suites
        run: npm run test:scripts && npm run test:canary-loop && npm run test:exp-regen-clue
