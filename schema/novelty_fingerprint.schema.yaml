# Novelty Fingerprint — the abstract structural fingerprint of a mystery (Agent 8 redesign §4.1).
# "The schema the whole redesign is built on." Novelty is a property of the *idea* — axis, mechanism,
# false-assumption shape, discriminating-test shape, inference shape — NOT of surface text (names,
# eras). A fingerprint is a few hundred tokens; it can be compared against the seeds, a genre-cliche
# ledger, and a cross-run store cheaply, before any 8000-token CML is elaborated.
#
# JSON Schema draft-07 in YAML, ajv-compiled. `additionalProperties: false` keeps the ledger honest.
$schema: "http://json-schema.org/draft-07/schema#"
title: "Novelty Fingerprint"
type: object
additionalProperties: false
required:
  - id
  - corpus
  - axis
  - mechanism_family
  - false_assumption_pattern
  - discriminating_test_shape
  - inference_shape
properties:
  id:
    type: string
    pattern: "^[a-z][a-z0-9_]*$"
  # Which corpus this fingerprint belongs to — the three things a new idea must diverge from (§4.4).
  corpus:
    type: string
    enum: [seed, cliche, prior_run]
  # The primary axis the mystery turns on.
  axis:
    type: string
    enum: [temporal, spatial, identity, epistemic, behavioral, authority]
  # The mechanism family — the trick's structural kind (shared vocabulary with the §4.4 device library).
  mechanism_family:
    type: string
    enum:
      - locked_room_key
      - locked_room_timing
      - alibi_fabrication
      - impersonation
      - substituted_body
      - poison_delayed
      - poison_substitution
      - staged_scene
      - unconscious_act
      - disguised_natural_agent
      - hidden_accomplice
      - information_leak
      - recorded_presence
      - secret_will_inheritance
      # A_77 §16.5 / §16.9 — added 2026-08-31. The 14 above could not express two of the strongest
      # cases in the library, and forcing them produced a MEASURABLE defect: *A Jury of Her Peers*
      # filed as `hidden_accomplice` made its nearest novelty neighbour `butler_did_it`, a cliche it
      # resembles in nothing. A family is a retrieval key, so a wrong one is a wrong retrieval.
      #
      # role_invisibility: the culprit is not disguised as a PERSON but occupies a ROLE whose
      #   occupant is not perceived as a person at all — the postman nobody sees.
      #   (Chesterton, *The Invisible Man*.)
      # investigative_blind_spot: the concealment is not an act by the culprit. It is performed by
      #   the investigation's own framing of what counts as evidence.
      #   (Glaspell, *A Jury of Her Peers* — there is no accomplice and no trick.)
      - role_invisibility
      - investigative_blind_spot
  # The reader's load-bearing wrong belief (a short canonical phrase, e.g. "locked_room=>suicide").
  false_assumption_pattern:
    type: string
    minLength: 1
  # How the truth is finally forced.
  discriminating_test_shape:
    type: string
    enum:
      - physical_trace
      - timetable_contradiction
      - behavioral_tell
      - identity_disambiguation
      - reconstruction
      - chemical_timing
  # The skeleton of the deduction, abstracted from props (a short canonical phrase).
  inference_shape:
    type: string
    minLength: 1
  # One-line premise (display only; never compared).
  premise:
    type: string
  # Provenance.
  source:
    type: string
  # A_79 A2 — whether this row was DERIVED from a validator-clean case or is a legacy hand-authored
  # entry retained until its work is re-encoded. A_77 §4.3 measured 11 of 14 legacy rows disagreeing
  # with their own sources, so a ledger that cannot say which of its rows are trustworthy is a
  # ledger that gets trusted uniformly and wrongly.
  provenance:
    # A_79 A2. Three states, because "we looked and it failed" and "we never looked" are different
    # claims: `derived` passed the anchor-evidence gate, `derived_unverified` was re-encoded but has
    # no evidence on disk to check it against, `legacy_hand_authored` was never re-encoded OR was
    # re-encoded and demoted by the gate.
    type: string
    enum: [derived, derived_unverified, legacy_hand_authored]
