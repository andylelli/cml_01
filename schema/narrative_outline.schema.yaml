# Narrative Outline Artifact Schema
# Generated by Agent 7: Narrative Formatter
# Scene-by-scene narrative outline with three-act structure

acts:
  type: array
  required: true
  items:
    type: object
    fields:
      actNumber:
        type: number
        required: true
        allowed: [1, 2, 3]
      title:
        type: string
        required: true
      purpose:
        type: string
        required: true
      pacingNotes:
        type: string
        required: false
        description: "Act-level pacing guidance"
      scenes:
        type: array
        required: true
        items:
          type: object
          fields:
            sceneNumber:
              type: number
              required: true
            act:
              type: number
              required: true
              allowed: [1, 2, 3]
            title:
              type: string
              required: true
            setting:
              type: object
              required: true
              fields:
                location:
                  type: string
                  required: true
                timeOfDay:
                  type: string
                  required: true
                atmosphere:
                  type: string
                  required: true
                microMomentBeats:
                  type: array
                  required: false
                  items: string
                  description: "Non-plot emotional pause beats for this setting"
            characters:
              type: array
              required: true
              items: string
              description: "Character names present in scene"
            purpose:
              type: string
              required: true
              description: "Why this scene exists"
            cluesRevealed:
              type: array
              required: true
              items: string
              description: "Clue IDs revealed in this scene"
            dramaticElements:
              type: object
              required: true
              fields:
                conflict:
                  type: string
                  required: false
                tension:
                  type: string
                  required: false
                revelation:
                  type: string
                  required: false
                misdirection:
                  type: string
                  required: false
                microMomentBeats:
                  type: array
                  required: false
                  items: string
                  description: "Non-plot emotional pause beats (1-sentence each): grief, relief, memory, dread. Target: at least 1 per 5 scenes."
                redHerringPlacement:
                  type: object
                  required: false
                  description: "Red-herring placement recorded alongside the scene's dramatic elements"
                resolution:
                  type: string
                  required: false
                  description: "How the scene's dramatic tension resolves"
            summary:
              type: string
              required: true
              description: "2-3 sentence scene description"
            estimatedWordCount:
              type: number
              required: true
            # ── Pillar 4 scene contracts + World-First enrichment, declared 2026-09-07 ───────────
            # These are WRITTEN by the orchestrator, REQUIRED by the outline completeness gate ("all N
            # scenes have concrete pivotElement, factEstablished and redHerringPlacement contracts"),
            # and none of them was declared here. The artifact validator warns on every undeclared
            # field, per scene, so a ten-scene outline emitted ~63 warnings a run for fields the
            # pipeline itself demands. MEASURED over the 26 post-X70 runs: 1,640 of 5,458 run warnings
            # (30%) were these, the four largest warning shapes in the corpus.
            #
            # EVERY TYPE HERE WAS READ OFF A REAL ARTIFACT, not inferred from the field name. The first
            # version of this block guessed `permittedBehavioursByAct: object` and
            # `redHerringPlacement: string` and turned 1,640 warnings into 14 ERRORS on replay
            # (`must be object, got object`) — it is an array of {characterName, behaviour} and an
            # object of {redHerringId, placementDetail}. Objects and arrays are declared WITHOUT
            # `fields`/`items` on purpose: the validator only descends when those are present, so the
            # shape stays free to evolve without re-creating the warning storm this block removes.
            #
            # `mechanismRevealAllowed` and `cluesPlanted` were invisible until the four above were
            # silenced — they are the signal the noise was burying.
            pivotElement:
              type: string
              required: false
              description: "The single concrete thing this scene turns on (Pillar 4)"
            factEstablished:
              type: string
              required: false
              description: "The fact the reader may treat as settled after this scene (Pillar 4)"
            permittedBehavioursByAct:
              type: array
              required: false
              description: "Per-character behavioural steering; the only such steering that reaches Agent 9"
            redHerringPlacement:
              type: object
              required: false
              description: "Which red herring this scene plants or complicates (Pillar 4)"
            mechanismRevealAllowed:
              type: boolean
              required: false
              description: "Whether this scene may disclose the concealment mechanism"
            cluesPlanted:
              type: array
              required: false
              items: string
              description: "Clue IDs planted (not yet revealed) in this scene"
            suspectClearanceAllowed:
              type: boolean
              required: false
              description: "Whether this scene may clear a suspect (X29 bounds clearances to the reveal chapter)"
            motiveBeatCulprit:
              type: string
              required: false
              description: "Culprit whose motive beat this scene plants (diagnosis-batch #2)"
            # TYPE DELIBERATELY UNDECLARED. `mechanism_stage` is written with two different types
            # across the stored artifacts — `null` in most, the number `4` in canary_1788607565000 —
            # so pinning either one turns a warning into an error on the other half of the corpus
            # (which is exactly what the first attempt did). `isType` accepts anything when `type` is
            # omitted, so this silences the warning without asserting a shape the writers do not
            # agree on. The disagreement itself is worth fixing at the writer, not here.
            mechanism_stage:
              required: false
              description: "Staged mechanism disclosure state; null until a stage is assigned"
            # SWEEP B — Golden Age structural beat for the 10-chapter format (optional).
            beat:
              type: string
              required: false
              allowed: [gathering, crime, first_enquiries, motives, alibis, false_solution, secrets, pattern, final_trap, revelation]
              description: "Named Golden Age beat this chapter fulfils; assigned in order for 10-chapter stories."

            # ── World-First enrichment fields (populated when WORLD_DOCUMENT is present) ──
            emotionalRegister:
              type: string
              required: false
              description: >
                One sentence. The emotional tone this scene should carry, drawn from
                WORLD_DOCUMENT.storyEmotionalArc. E.g. "Eye of the storm — surface
                civility with subterranean dread." Agent 9 must honour this register.
            dominantCharacterNote:
              type: object
              required: false
              fields:
                name:
                  type: string
                  required: true
                  description: "The character whose voice and perspective dominates this scene."
                voiceRegister:
                  type: string
                  required: true
                  description: >
                    One sentence. How this character sounds in this scene, drawn from
                    WORLD_DOCUMENT.characterVoiceSketches for this character.
            humourGuidance:
              type: object
              required: false
              fields:
                permission:
                  type: string
                  required: true
                  allowed: [permitted, conditional, forbidden]
                character:
                  type: string
                  required: false
                  description: "Name of the character who may carry wit in this scene."
                form:
                  type: string
                  required: false
                  description: "The humour form permitted, e.g. 'understatement' or 'dry_wit'."
                condition:
                  type: string
                  required: false
                  description: "Present when permission is 'conditional'."
            eraTextureNote:
              type: string
              required: false
              description: >
                One sentence. Any era-specific physical or social constraint that
                should be felt in this scene, drawn from
                WORLD_DOCUMENT.historicalMoment. E.g. "Blackout in effect — meeting
                by candlelight, voices kept low." Agent 9 may use this as a detail.
            locationRegisterNote:
              type: string
              required: false
              description: >
                One sentence. The emotional stance for entering and writing this
                location in this scene, drawn from WORLD_DOCUMENT.locationRegisters
                for the scene's setting location.
            subtextNote:
              type: string
              required: false
              description: >
                One sentence. What this scene is REALLY about beneath its surface purpose.
                E.g. 'Surface: taking statements. Real: two people who suspect each other
                pretending they don't.' Or 'Surface: social visit. Real: the detective
                watching to see if the suspect already knows the victim is dead.'
                Agent 9 uses this to write scenes with tension beyond their plot function —
                dialogue that means something other than what it says.
      estimatedWordCount:
        type: number
        required: true

totalScenes:
  type: number
  required: true

estimatedTotalWords:
  type: number
  required: true

pacingNotes:
  type: array
  required: true
  items: string

cost:
  type: number
  required: true

durationMs:
  type: number
  required: true
